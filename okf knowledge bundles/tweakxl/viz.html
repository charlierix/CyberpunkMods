const NODES=[{"id": "apis/red4ext-header", "type": "API", "title": "RED4ext C++ Header", "description": "C++ header class for RED4ext plugins to register tweaks with TweakXL at the native level.", "tags": ["tweakxl", "red4ext", "cpp", "header", "native", "plugin"], "group": "apis", "sz": 43, "body": "# Overview\n\nThe `TweakXL.hpp` header provides a C++ API for RED4ext plugin developers to register tweak files (YAML, RED) and tweak directories with TweakXL from native code. It handles deferred registration via RTTI callbacks when TweakXL's Redscript facade is not yet available, and resolves paths relative to the calling module.\n\nThis is the native-side counterpart to the Redscript [TweakXL Core](/apis/tweakxl-core.md) class. The C++ class calls into the Redscript `TweakXL` class via RTTI function execution (`RegisterTweak` / `RegisterDir`).\n\n# Member Types\n\n| Type | Kind | Source File | Key Members |\n|------|------|------------|-------------|\n| TweakXL | C++ static class | support/red4ext/TweakXL.hpp | RegisterTweak, RegisterTweaks, Initialize, RegisterPathOrQueue, RegisterPath, RegisterPendingPaths, GetModulePath |\n\n# Public API\n\n### TweakXL::RegisterTweak(path)\n\n```cpp\nstatic bool RegisterTweak(std::filesystem::path aPath)\n```\n\nRegisters a single tweak file. Returns `false` if the path does not exist or is not a regular file.\n\n### TweakXL::RegisterTweak(handle, path)\n\n```cpp\nstatic bool RegisterTweak(HMODULE aHandle, std::filesystem::path aPath)\n```\n\nRegisters a tweak file relative to the calling module's directory. Resolves relative paths using `GetModulePath(aHandle)`.\n\n### TweakXL::RegisterTweaks(path)\n\n```cpp\nstatic bool RegisterTweaks(std::filesystem::path aPath)\n```\n\nRegisters a directory of tweak files. Returns `false` if the path does not exist or is not a directory.\n\n### TweakXL::RegisterTweaks(handle, path)\n\n```cpp\nstatic bool RegisterTweaks(HMODULE aHandle, std::filesystem::path aPath)\n```\n\nRegisters a directory of tweak files relative to the calling module's directory.\n\n# Internal Methods\n\n| Method | Visibility | Description |\n|--------|-----------|-------------|\n| Initialize | private static | Checks if TweakXL's RTTI facade is available; sets `s_facade` |\n| RegisterPathOrQueue | private static | If initialized, registers immediately; otherwise queues the path for deferred registration |\n| RegisterPath | private static | Executes `RegisterTweak` or `RegisterDir` via RTTI on the `TweakXL` Redscript class |\n| RegisterPendingPaths | private static | Flushes queued paths once RTTI is ready; re-registers callback if still not ready |\n| GetModulePath | private static | Returns the parent directory of the given HMODULE |\n\n# Static State\n\n| Member | Type | Description |\n|--------|------|-------------|\n| s_facade | `RED4ext::CClass*` | Cached RTTI class pointer for the Redscript `TweakXL` class |\n| s_paths | `std::vector<std::filesystem::path>` | Queue of paths awaiting registration when RTTI is not yet ready |\n\n# Deferred Registration Flow\n\n1. Plugin calls `RegisterTweak` or `RegisterTweaks` during module load\n2. If TweakXL's RTTI facade is not yet available, the path is queued in `s_paths`\n3. `RegisterPendingPaths` is called via `AddPostRegisterCallback` \u2014 a RED4ext RTTI lifecycle hook\n4. Once RTTI registration completes, queued paths are flushed and registered via `RegisterPath`\n\n# Dependencies\n\n- **RED4ext SDK** \u2014 `RED4ext::CRTTISystem`, `RED4ext::CClass`, `RED4ext::CStackType`, `RED4ext::Callback`\n- **Windows API** \u2014 `HMODULE`, `GetModuleFileNameW`, `MAX_PATH`\n- **C++17** \u2014 `std::filesystem`\n\n# Usage Example\n\n```cpp\n#include <TweakXL.hpp>\n\n// Register a single tweak file relative to the plugin's directory\nTweakXL::RegisterTweak(hModule, \"tweaks/my_tweak.yaml\");\n\n// Register an entire directory of tweaks\nTweakXL::RegisterTweaks(hModule, \"tweaks/\");\n```\n\n# Related Concepts\n\n- [TweakDB API](/apis/tweakdb-api.md) \u2014 The Redscript-side TweakDB operations this header hooks into\n- [TweakXL Core](/apis/tweakxl-core.md) \u2014 The Redscript class whose `Version()` function is checked during initialization\n\n# Citations\n\n- [TweakXL.hpp](https://github.com/psiberx/cp2077-tweak-xl/blob/main/support/red4ext/TweakXL.hpp)\n- [RED4ext Documentation](https://docs.red4ext.com)"}, {"id": "apis/scriptable-tweaks", "type": "Class", "title": "Scriptable Tweak", "description": "Abstract native class for creating scriptable tweaks with custom apply logic.", "tags": ["tweakxl", "redscript", "scriptable", "tweak", "abstract"], "group": "apis", "sz": 32, "body": "# Overview\n\n`ScriptableTweak` is an abstract native class that serves as the base class for scriptable tweaks \u2014 tweaks that require complex logic or dynamic changes beyond what declarative YAML or RED tweaks can express. Modders subclass `ScriptableTweak` and implement the `OnApply` callback to perform their TweakDB modifications.\n\nThis is the entry point for the script extensions feature of TweakXL, allowing mods to add arbitrary Redscript logic to the tweak application pipeline.\n\n# Member Types\n\n| Type | Kind | Source File | Key Members |\n|------|------|------------|-------------|\n| ScriptableTweak | Abstract native class | scripts/ScriptableTweak.reds | `OnApply()` callback |\n\n# Methods\n\n### ScriptableTweak.OnApply\n\n```reds\nprotected cb func OnApply() -> Void\n```\n\nThe callback invoked when the scriptable tweak is applied. Subclasses override this method to execute custom TweakDB operations using the [TweakDB API](/apis/tweakdb-api.md). This is a `cb func` (callback function) marked `protected`, so only subclasses can invoke it.\n\n# Usage Example\n\n```reds\npublic class MyCustomTweak extends ScriptableTweak {\n    protected cb func OnApply() -> Void {\n        let batch = TweakDBManager.StartBatch();\n        batch.SetFlat(TDBID.Create(\"Items.BasePistol.damage\"), 75.0);\n        batch.Commit();\n    }\n}\n```\n\n# Related Concepts\n\n- [TweakDB API](/apis/tweakdb-api.md) \u2014 Used inside OnApply for TweakDB operations\n- [TweakXL Core](/apis/tweakxl-core.md) \u2014 Framework version checking\n\n# Citations\n\n- [ScriptableTweak.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/ScriptableTweak.reds)\n- [Script Extensions Wiki](https://github.com/psiberx/cp2077-tweak-xl/wiki/Script-Extensions)"}, {"id": "apis/tweakdb-api", "type": "Class", "title": "TweakDB API", "description": "TweakDB operation classes for record creation, cloning, batch operations, and querying.", "tags": ["tweakdb", "redscript", "records", "batch", "query"], "group": "apis", "sz": 51, "body": "# Overview\n\nThe TweakDB API provides three Redscript classes that together expose TweakDB manipulation to modders. `TweakDBManager` offers static methods for direct record and flat operations. `TweakDBBatch` provides the same operations in a batched transaction with a `Commit()` call. `TweakDBInterface` adds query methods to the existing engine class via `@addMethod`.\n\nThese classes are the primary programmatic interface for mods that need to create, modify, or query TweakDB records at runtime.\n\n# Member Types\n\n| Type | Kind | Source File | Key Methods |\n|------|------|------------|-------------|\n| TweakDBManager | Abstract native class | scripts/TweakDBManager.reds | SetFlat, CreateRecord, CloneRecord, UpdateRecord, RegisterEnum, RegisterName, StartBatch |\n| TweakDBBatch | Native class | scripts/TweakDBBatch.reds | SetFlat, CreateRecord, CloneRecord, UpdateRecord, RegisterEnum, RegisterName, Commit |\n| TweakDBInterface | Method extensions (@addMethod) | scripts/TweakDBInterface.reds | GetFlat, GetRecord, GetRecords, GetRecordCount, GetRecordByIndex, GetRecords(keys), GetRecordIDs |\n\n# TweakDBManager Methods\n\n| Method | Signature | Description |\n|--------|-----------|-------------|\n| SetFlat | `(id: TweakDBID, value: Variant) -> Bool` | Sets a flat value on an existing TweakDB record by ID |\n| SetFlat | `(name: CName, value: Variant) -> Bool` | Convenience overload that converts CName to TweakDBID and registers the name |\n| CreateRecord | `(id: TweakDBID, type: CName) -> Bool` | Creates a new record with the given ID and type |\n| CreateRecord | `(name: CName, type: CName) -> Bool` | Convenience overload with CName and auto-registration |\n| CloneRecord | `(id: TweakDBID, base: TweakDBID) -> Bool` | Clones an existing record as a new record |\n| CloneRecord | `(name: CName, base: TweakDBID) -> Bool` | Convenience overload with CName and auto-registration |\n| UpdateRecord | `(id: TweakDBID) -> Bool` | Triggers an update/refresh of a record after flat modifications |\n| RegisterEnum | `(id: TweakDBID)` | Registers a flat as an enum value for TweakDB validation |\n| RegisterName | `(name: CName) -> Bool` | Registers a CName in TweakDB's name registry |\n| StartBatch | `() -> ref<TweakDBBatch>` | Starts a batch operation context, returns a TweakDBBatch instance |\n\n# TweakDBBatch Methods\n\n| Method | Signature | Description |\n|--------|-----------|-------------|\n| SetFlat | `(id: TweakDBID, value: Variant) -> Bool` | Queues a flat set operation in the batch |\n| SetFlat | `(name: CName, value: Variant) -> Bool` | Convenience overload with CName and auto-registration |\n| CreateRecord | `(id: TweakDBID, type: CName) -> Bool` | Queues a record creation in the batch |\n| CreateRecord | `(name: CName, type: CName) -> Bool` | Convenience overload with CName and auto-registration |\n| CloneRecord | `(id: TweakDBID, base: TweakDBID) -> Bool` | Queues a record clone in the batch |\n| CloneRecord | `(name: CName, base: TweakDBID) -> Bool` | Convenience overload with CName and auto-registration |\n| UpdateRecord | `(id: TweakDBID) -> Bool` | Queues a record update in the batch |\n| RegisterEnum | `(id: TweakDBID)` | Queues an enum registration in the batch |\n| RegisterName | `(name: CName) -> Bool` | Queues a name registration in the batch |\n| Commit | `()` | Commits all queued operations to TweakDB atomically |\n\n# TweakDBInterface Extensions\n\n| Method | Signature | Description |\n|--------|-----------|-------------|\n| GetFlat | `(path: TweakDBID) -> Variant` | Retrieves a flat value by TweakDBID |\n| GetRecord | `(path: TweakDBID) -> ref<TweakDBRecord>` | Retrieves a record by TweakDBID |\n| GetRecords | `(type: CName) -> array<ref<TweakDBRecord>>` | Retrieves all records of a given type |\n| GetRecordCount | `(type: CName) -> Uint32` | Returns the count of records of a given type |\n| GetRecordByIndex | `(type: CName, index: Uint32) -> ref<TweakDBRecord>` | Retrieves a record by type and index |\n| GetRecords | `(keys: array<TweakDBID>) -> array<ref<TweakDBRecord>>` | Retrieves multiple records by TweakDBID array (filters undefined) |\n| GetRecordIDs | `(type: CName) -> array<TweakDBID>` | Returns all TweakDBIDs for records of a given type |\n\n# Usage Examples\n\n### Direct flat modification\n\n```reds\nTweakDBManager.SetFlat(TDBID.Create(\"Items.BasePistol.damage\"), 50.0);\n```\n\n### Batch operations\n\n```reds\nlet batch = TweakDBManager.StartBatch();\nbatch.SetFlat(TDBID.Create(\"Items.BasePistol.damage\"), 50.0);\nbatch.CreateRecord(TDBID.Create(\"Items.MyCustomPistol\"), n\"Item\");\nbatch.CloneRecord(TDBID.Create(\"Items.MyPistolClone\"), TDBID.Create(\"Items.BasePistol\"));\nbatch.Commit();\n```\n\n### Querying records\n\n```reds\nlet allItems = TweakDBInterface.GetRecords(n\"Item\");\nlet itemIDs = TweakDBInterface.GetRecordIDs(n\"Item\");\nlet count = TweakDBInterface.GetRecordCount(n\"Item\");\n```\n\n# Related Concepts\n\n- [TweakXL Core](/apis/tweakxl-core.md) \u2014 Version checking for the framework\n- [Scriptable Tweak](/apis/scriptable-tweaks.md) \u2014 Uses these TweakDB operations in OnApply callbacks\n- [Extra Flats](/references/extra-flats.md) \u2014 Defines flat fields consumed by these operations\n- [Inheritance Map](/references/inheritance-map.md) \u2014 Provides inheritance chains for CloneRecord\n\n# Citations\n\n- [TweakDBManager.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/TweakDBManager.reds)\n- [TweakDBBatch.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/TweakDBBatch.reds)\n- [TweakDBInterface.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/TweakDBInterface.reds)"}, {"id": "apis/tweakxl-core", "type": "Class", "title": "TweakXL Core", "description": "Core framework class with version checking and Redscript module declaration.", "tags": ["tweakxl", "redscript", "version", "core"], "group": "apis", "sz": 34, "body": "# Overview\n\nTweakXL is a modding tool and framework for modifying TweakDB \u2014 the proprietary database of REDengine 4 that stores essential information about game entities and behavior in Cyberpunk 2077. The core module provides version checking capabilities and the Redscript module declaration that all other TweakXL scripts depend on.\n\nTweakXL supports YAML and RED declarative tweak formats, script extensions for complex logic, and hot reloading for development speed. It targets Cyberpunk 2077 2.3 with redscript 0.5.27+ and RED4ext 1.28.0+.\n\n# Member Types\n\n| Type | Kind | Source File | Key Members |\n|------|------|------------|-------------|\n| TweakXL | Abstract native class | scripts/TweakXL.reds | `Require(version: String) -> Bool`, `Version() -> String` |\n| TweakXL (module) | Redscript module | scripts/Module.reds | `module TweakXL` |\n\n# Methods\n\n### TweakXL.Require\n\n```reds\npublic static native func Require(version: String) -> Bool\n```\n\nChecks whether the loaded TweakXL version meets or exceeds the specified version string. Returns `true` if the requirement is satisfied, `false` otherwise. Used by mods to assert a minimum TweakXL version at runtime.\n\n### TweakXL.Version\n\n```reds\npublic static native func Version() -> String\n```\n\nReturns the current TweakXL version as a string (e.g. `\"1.10.3\"`).\n\n# Dependencies\n\n- **redscript** 0.5.27+ \u2014 Redscript compiler/runtime\n- **RED4ext** 1.28.0+ \u2014 Plugin framework providing native function bindings\n- The native `TweakXL` class is implemented in the C++ RED4ext plugin; see [RED4ext C++ Header](/apis/red4ext-header.md)\n\n# Related Concepts\n\n- [TweakDB API](/apis/tweakdb-api.md) \u2014 TweakDB record manipulation classes\n- [Scriptable Tweak](/apis/scriptable-tweaks.md) \u2014 Abstract class for scriptable tweak types\n\n# Citations\n\n- [TweakXL.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/TweakXL.reds)\n- [Module.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/Module.reds)\n- [README.md](https://github.com/psiberx/cp2077-tweak-xl/blob/main/README.md)"}, {"id": "patches/status-effect-icon", "type": "Patch", "title": "Status Effect Icon Fix", "description": "WrapMethod patch fixing status effect icon rendering in the stealth mappin controller.", "tags": ["tweakxl", "redscript", "patch", "status-effect", "icon", "ui", "mappin"], "group": "patches", "sz": 34, "body": "# Overview\n\nThis patch wraps `StealthMappinController.UpdateStatusEffectIcon()` to fix status effect icon rendering. When a status effect is showing, it resolves the icon from TweakDB's `UIIcon` records and applies the correct atlas texture part and resource. If the icon record is not found, it falls back to a default buff info atlas.\n\n# Member Types\n\n| Type | Kind | Source File | Key Members |\n|------|------|------------|-------------|\n| StealthMappinController (wrapped) | `@wrapMethod` patch | scripts/StatusEffect.reds | `UpdateStatusEffectIcon()` |\n\n# Patched Method\n\n### StealthMappinController.UpdateStatusEffectIcon\n\n```reds\n@wrapMethod(StealthMappinController)\nprivate final func UpdateStatusEffectIcon() {\n    wrappedMethod();\n    if this.m_statusEffectShowing {\n        let iconRecord = TweakDBInterface.GetUIIconRecord(\n            TDBID.Create(\"UIIcon.\" + this.m_mappin.GetStatusEffectIconPath())\n        );\n        if IsDefined(iconRecord) {\n            inkImageRef.SetTexturePart(this.m_statusEffectIcon, iconRecord.AtlasPartName());\n            inkImageRef.SetAtlasResource(this.m_statusEffectIcon, iconRecord.AtlasResourcePath());\n        } else {\n            inkImageRef.SetAtlasResource(\n                this.m_statusEffectIcon,\n                r\"base/gameplay/gui/widgets/healthbar/atlas_buffinfo.inkatlas\"\n            );\n        }\n    }\n}\n```\n\n# Behavior\n\n1. Calls the original `wrappedMethod()` first\n2. Checks if a status effect is currently showing (`m_statusEffectShowing`)\n3. Constructs a TweakDBID for the UIIcon record from the status effect's icon path\n4. Resolves the icon record via `TweakDBInterface.GetUIIconRecord`\n5. If found: sets the texture part and atlas resource from the record\n6. If not found: falls back to `base/gameplay/gui/widgets/healthbar/atlas_buffinfo.inkatlas`\n\n# Dependencies\n\n- Uses [TweakDBInterface](/apis/tweakdb-api.md) extensions to resolve UIIcon records\n- `inkImageRef` \u2014 ink UI framework for image manipulation\n\n# Citations\n\n- [StatusEffect.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/StatusEffect.reds)"}, {"id": "patches/vehicle-scanner-icon", "type": "Patch", "title": "Vehicle Scanner Icon Fix", "description": "WrapMethod patch fixing vehicle manufacturer icon rendering in the scanner HUD.", "tags": ["tweakxl", "redscript", "patch", "vehicle", "scanner", "icon", "ui"], "group": "patches", "sz": 33, "body": "# Overview\n\nThis patch wraps `ScannervehicleGameController.OnVehicleManufacturerChanged()` to fix vehicle manufacturer icon rendering in the scanner HUD. When the manufacturer changes, it resolves the manufacturer's icon from TweakDB's `UIIcon` records and applies the correct atlas resource to the scanner's manufacturer image element.\n\n# Member Types\n\n| Type | Kind | Source File | Key Members |\n|------|------|------------|-------------|\n| ScannervehicleGameController (wrapped) | `@wrapMethod` patch | scripts/VehicleScanner.reds | `OnVehicleManufacturerChanged(value: Variant)` |\n\n# Patched Method\n\n### ScannervehicleGameController.OnVehicleManufacturerChanged\n\n```reds\n@wrapMethod(ScannervehicleGameController)\nprotected cb func OnVehicleManufacturerChanged(value: Variant) -> Bool {\n    wrappedMethod(value);\n    if this.m_isValidVehicleManufacturer {\n        let vehicleManufacturer = FromVariant<ref<ScannerVehicleManufacturer>>(value);\n        let iconRecord = TweakDBInterface.GetUIIconRecord(\n            TDBID.Create(\"UIIcon.\" + vehicleManufacturer.GetVehicleManufacturer())\n        );\n        inkImageRef.SetAtlasResource(this.m_vehicleManufacturer, iconRecord.AtlasResourcePath());\n    }\n}\n```\n\n# Behavior\n\n1. Calls the original `wrappedMethod(value)` first\n2. Checks if the vehicle manufacturer is valid (`m_isValidVehicleManufacturer`)\n3. Extracts the `ScannerVehicleManufacturer` from the Variant parameter\n4. Constructs a TweakDBID for the UIIcon record from the manufacturer name\n5. Resolves the icon record via `TweakDBInterface.GetUIIconRecord`\n6. Sets the atlas resource on the manufacturer image element\n\n# Dependencies\n\n- Uses [TweakDBInterface](/apis/tweakdb-api.md) extensions to resolve UIIcon records\n- `inkImageRef` \u2014 ink UI framework for image manipulation\n- `ScannerVehicleManufacturer` \u2014 engine record type for vehicle manufacturer data\n\n# Citations\n\n- [VehicleScanner.reds](https://github.com/psiberx/cp2077-tweak-xl/blob/main/scripts/VehicleScanner.reds)"}, {"id": "references/extra-flats", "type": "Reference", "title": "Extra Flats", "description": "YAML reference mapping TweakDB record types to flat field definitions not included in the base game schema.", "tags": ["tweakxl", "tweakdb", "flats", "yaml", "reference", "schema"], "group": "references", "sz": 52, "body": "# Overview\n\n`ExtraFlats.yaml` defines flat fields that TweakXL adds to TweakDB record types beyond what the base game schema includes. Each top-level key is a TweakDB record type name, and its nested keys are flat field names with their type information. This allows mods to set flats on record types that the base game does not expose by default.\n\nThe file contains **60 record types** with a total of ~1439 lines of flat definitions.\n\n# Schema\n\n```yaml\nRecordType:\n  flatName:\n    flatType: <type>           # Required \u2014 the TweakDB flat type (e.g. String, Float, Bool, CName, TweakDBID, array:TweakDBID)\n    foreignType: <type>         # Optional \u2014 the foreign record type this flat references (e.g. Program, Affiliation)\n```\n\n# Complete Record Type Listing\n\nAll 60 record types defined in ExtraFlats.yaml:\n\n| # | Record Type | Flat Fields | Notable Flats |\n|---|------------|------------|---------------|\n| 1 | Minigame_Def | 1 | forbiddenPrograms (array:TweakDBID \u2192 Program) |\n| 2 | Vehicle | 3 | hijackDifficulty, fullDisplayName, crackLockDifficulty |\n| 3 | Device | 2 | deviceType, UI_PlayerScanningTime |\n| 4 | device_role_action_desctiption | 3 | revealOrder, isQuickHack, skillcheck |\n| 5 | npc_scanning_data | 1 | affiliation (TweakDBID \u2192 Affiliation) |\n| 6 | InteractionBase | 1 | tag (CName) |\n| 7 | ContentAssignment | 2 | overrideValue, upToCheck |\n| 8 | device_scanning_data | 1 | revealOrder |\n| 9 | AimAssistMagnetism | 1 | finishingEnabled |\n| 10 | ApplyStatusEffectEffector | 1 | isRandom |\n| 11 | TriggerAttackEffector | 7 | woundType, chance, isRandom, applicationChance, bodyPart, hitPosition, attackPositionSlotName, isCritical |\n| 12 | SubCharacter | \u2014 | *(defined as a record type with flats)* |\n| 13 | Attack_Projectile | \u2014 | *(defined as a record type with flats)* |\n| 14 | Attack_Melee | \u2014 | *(defined as a record type with flats)* |\n| 15 | HudEnhancer | \u2014 | *(defined as a record type with flats)* |\n| 16 | Item | \u2014 | *(defined as a record type with flats)* |\n| 17 | StatPoolPrereq | \u2014 | *(defined as a record type with flats)* |\n| 18 | WeaponItem | \u2014 | *(defined as a record type with flats)* |\n| 19 | HitPrereq | \u2014 | *(defined as a record type with flats)* |\n| 20 | LootTable | \u2014 | *(defined as a record type with flats)* |\n| 21 | AttachmentSlot | \u2014 | *(defined as a record type with flats)* |\n| 22 | IPrereq | \u2014 | *(defined as a record type with flats)* |\n| 23 | Clothing | \u2014 | *(defined as a record type with flats)* |\n| 24 | ProgressionBuild | \u2014 | *(defined as a record type with flats)* |\n| 25 | ItemAction | \u2014 | *(defined as a record type with flats)* |\n| 26 | Grenade | \u2014 | *(defined as a record type with flats)* |\n| 27 | Weakspot | \u2014 | *(defined as a record type with flats)* |\n| 28 | HitPrereqCondition | \u2014 | *(defined as a record type with flats)* |\n| 29 | GameplayRestrictionStatusEffect | \u2014 | *(defined as a record type with flats)* |\n| 30 | Attack_Landing | \u2014 | *(defined as a record type with flats)* |\n| 31 | Stat | \u2014 | *(defined as a record type with flats)* |\n| 32 | GameplayLogicPackages | \u2014 | *(defined as a record type with flats)* |\n| 33 | Effector | \u2014 | *(defined as a record type with flats)* |\n| 34 | StatusEffect | \u2014 | *(defined as a record type with flats)* |\n| 35 | ModifyStatPoolValueEffector | \u2014 | *(defined as a record type with flats)* |\n| 36 | BroadcastStimEffector | \u2014 | *(defined as a record type with flats)* |\n| 37 | ContinuousEffector | \u2014 | *(defined as a record type with flats)* |\n| 38 | MinigameAction | \u2014 | *(defined as a record type with flats)* |\n| 39 | VehicleTPPCameraPresetParams | \u2014 | *(defined as a record type with flats)* |\n| 40 | ScannableData | \u2014 | *(defined as a record type with flats)* |\n| 41 | RangedAttack | \u2014 | *(defined as a record type with flats)* |\n| 42 | ApplyStatGroupEffector | \u2014 | *(defined as a record type with flats)* |\n| 43 | NewSkillsProficiency | \u2014 | *(defined as a record type with flats)* |\n| 44 | ParentAttachmentType | \u2014 | *(defined as a record type with flats)* |\n| 45 | SpreadEffector | \u2014 | *(defined as a record type with flats)* |\n| 46 | Gadget | \u2014 | *(defined as a record type with flats)* |\n| 47 | InventoryItem | \u2014 | *(defined as a record type with flats)* |\n| 48 | device_gameplay_role | \u2014 | *(defined as a record type with flats)* |\n| 49 | FocusClue | \u2014 | *(defined as a record type with flats)* |\n| 50 | ModifyStatPoolModifierEffector | \u2014 | *(defined as a record type with flats)* |\n| 51 | VehicleDataPackage | \u2014 | *(defined as a record type with flats)* |\n| 52 | ConsumableItem | \u2014 | *(defined as a record type with flats)* |\n| 53 | Attack_GameEffect | \u2014 | *(defined as a record type with flats)* |\n| 54 | TriggerHackingMinigameEffector | \u2014 | *(defined as a record type with flats)* |\n| 55 | Character | \u2014 | *(defined as a record type with flats)* |\n| 56 | StatusEffectPrereq | \u2014 | *(defined as a record type with flats)* |\n| 57 | NewPerk | \u2014 | *(defined as a record type with flats)* |\n| 58 | ObjectAction | \u2014 | *(defined as a record type with flats)* |\n| 59 | SensePreset | \u2014 | *(defined as a record type with flats)* |\n| 60 | CrackAction | \u2014 | *(defined as a record type with flats)* |\n\n# Flat Types\n\nThe following `flatType` values appear in ExtraFlats.yaml:\n\n| Flat Type | Description |\n|-----------|-------------|\n| `String` | String value |\n| `Float` | Floating-point number |\n| `Bool` | Boolean value |\n| `Int32` | 32-bit integer |\n| `CName` | CName (engine string identifier) |\n| `TweakDBID` | TweakDB record/flat identifier |\n| `array:TweakDBID` | Array of TweakDBID values |\n| `Vector3` | 3D vector (x, y, z) |\n\n# Related Concepts\n\n- [TweakDB API](/apis/tweakdb-api.md) \u2014 These flat definitions are consumed by TweakDBManager/TweakDBBatch SetFlat operations\n\n# Citations\n\n- [ExtraFlats.yaml](https://github.com/psiberx/cp2077-tweak-xl/blob/main/data/ExtraFlats.yaml)"}, {"id": "references/inheritance-map", "type": "Reference", "title": "Inheritance Map", "description": "YAML reference mapping TweakDB record names to their inherited child record names for inheritance resolution.", "tags": ["tweakxl", "tweakdb", "inheritance", "yaml", "reference", "mapping"], "group": "references", "sz": 40, "body": "# Overview\n\n`InheritanceMap.yaml` maps TweakDB record names to arrays of record names that inherit from them. This mapping is used by TweakXL to resolve inheritance chains when performing `CloneRecord` operations \u2014 ensuring that cloned records maintain correct inheritance relationships and that flat modifications propagate to child records.\n\nThe file contains **8,492 entries** across ~69,300 lines, covering items, characters, attacks, conditions, cameras, actions, and other TweakDB record categories.\n\n# Schema\n\n```yaml\nRecordName:\n  - ChildRecordName1\n  - ChildRecordName2\n  - ChildRecordName3\n```\n\nEach top-level key is a TweakDB record ID (using dot notation, e.g. `Items.BasePistol`). The value is a list of record IDs that inherit from the parent record.\n\n# Record Categories\n\nThe 8,492 entries span multiple TweakDB domains, identifiable by their key prefixes:\n\n| Prefix | Domain | Example |\n|--------|--------|---------|\n| `Items.` | Game items (weapons, armor, consumables) | `Items.BaseDeckTier5` \u2192 `[Items.FuyutsuiTinkererLegendaryMKIII, ...]` |\n| `Character.` | NPC character records | `Character.AnimalsPrimaryHandgunPool` \u2192 `[Character.animals_bouncer2_ranged2_burya_mb_inline1, ...]` |\n| `Attack_` / `MeleeActions.` / `RangedAttack` | Attack definitions | `MeleeActions.Combo02MeleeAttackLight03RecoverMissDefinition` |\n| `Condition.` | Gameplay conditions | `Condition.StrafeCooldownHit` |\n| `Prereqs.` | Prerequisite records | `Prereqs.PostProcessHitTriggered` |\n| `Camera.` | Camera presets | `Camera.VehicleTPP_4w_Shion_High_Medium` |\n| `UIMaps.` | UI map records | `UIMaps.Inhaler` \u2192 `[UIMaps.Con_Inhaler]` |\n| `Weakspots.` | Weakspot definitions | `Weakspots.Engine_Zetatech_Av_Weakspot_Base` |\n| `StrongArmsAttacks.` | Strong arms attack definitions | `StrongArmsAttacks.OnePunchSpecialAttack` |\n| `NetrunnerActions.` | Netrunner action records | `NetrunnerActions.CoverHackAction` |\n| `DashAndDodgeActions.` | Dodge action definitions | `DashAndDodgeActions.GrenadeDodgeKerenzikovLeftFrontDefinition` |\n| `BaseStats.` | Base stat modifiers | `BaseStats.SmartGunSpiralRampDistanceEndModifier` |\n\n# Sample Entries\n\n```yaml\nItems.EmptySlotsHelmet_Intrinsic:\n  - Items.Helmet_04_old_01\n  - Items.Helmet_01_basic_01\n  - Items.Helmet_01_rich_01\n  - Items.Helmet_02_old_01\n  - Items.Helmet_02_basic_04\n  - Items.Helmet_02_old_02\n  - Items.Helmet_02_basic_02\n  - Items.Helmet_04_rich_02\n  - Items.Helmet_02_rich_04\n  - Items.Helmet_02_rich_02\n\nItems.AdvancedKiroshiOpticsSensorRarePlus:\n  - Items.AdvancedKiroshiOptics_Tutorial_RarePlus\n\nUIMaps.Inhaler:\n  - UIMaps.Con_Inhaler\n```\n\n# Usage\n\nThis map is used internally by TweakXL when processing declarative tweaks that involve record inheritance. When a mod clones a record via the [TweakDB API](/apis/tweakdb-api.md), TweakXL consults this map to determine which child records should inherit the clone's properties.\n\n# Related Concepts\n\n- [TweakDB API](/apis/tweakdb-api.md) \u2014 CloneRecord operations use this map for inheritance resolution\n- [Extra Flats](/references/extra-flats.md) \u2014 Defines flat fields on the record types referenced here\n\n# Citations\n\n- [InheritanceMap.yaml](https://github.com/psiberx/cp2077-tweak-xl/blob/main/data/InheritanceMap.yaml)"}], EDGES=[{"source": "apis/red4ext-header", "target": "apis/tweakxl-core"}, {"source": "apis/red4ext-header", "target": "apis/tweakdb-api"}, {"source": "apis/scriptable-tweaks", "target": "apis/tweakdb-api"}, {"source": "apis/scriptable-tweaks", "target": "apis/tweakxl-core"}, {"source": "apis/tweakdb-api", "target": "apis/tweakxl-core"}, {"source": "apis/tweakdb-api", "target": "apis/scriptable-tweaks"}, {"source": "apis/tweakdb-api", "target": "references/extra-flats"}, {"source": "apis/tweakdb-api", "target": "references/inheritance-map"}, {"source": "apis/tweakxl-core", "target": "apis/red4ext-header"}, {"source": "apis/tweakxl-core", "target": "apis/tweakdb-api"}, {"source": "apis/tweakxl-core", "target": "apis/scriptable-tweaks"}, {"source": "patches/status-effect-icon", "target": "apis/tweakdb-api"}, {"source": "patches/vehicle-scanner-icon", "target": "apis/tweakdb-api"}, {"source": "references/extra-flats", "target": "apis/tweakdb-api"}, {"source": "references/inheritance-map", "target": "apis/tweakdb-api"}, {"source": "references/inheritance-map", "target": "references/extra-flats"}];
const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,

   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'breadthfirst',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>

 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}

 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}
document.getElementById('search').oninput=applyFilter;
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
document.getElementById('layout').onchange=e=>{cy.layout({name:e.target.value,animate:true,padding:40,
 nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='breadthfirst';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
