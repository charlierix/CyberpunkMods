const NODES=[{"id": "apis/logging", "type": "API", "title": "v1::Logger", "description": "Logging API exposed to plugins with 6 levels in narrow/wide and plain/format variants \u2014 24 functions total.", "tags": ["logging", "api", "v1", "trace", "debug", "info", "warn", "error", "critical"], "group": "apis", "sz": 39, "body": "# Overview\n\nThe `v1::Logger` namespace provides a structured logging API that plugins call through the SDK's `Logger` struct. It offers six severity levels, each available in four variants: narrow-char plain, narrow-char format, wide-char plain, and wide-char format. Every function takes a `PluginHandle` as its first argument to identify the calling plugin in log output.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| `v1::Logger` | Namespace | 24 free functions for plugin logging |\n\n# Complete Function Listing\n\n## Trace (6 levels \u00d7 4 variants = 24 functions)\n\n| Level | Narrow plain | Narrow format | Wide plain | Wide format |\n|-------|-------------|---------------|------------|-------------|\n| Trace | `Trace(handle, msg)` | `TraceF(handle, fmt, ...)` | `TraceW(handle, msg)` | `TraceWF(handle, fmt, ...)` |\n| Debug | `Debug(handle, msg)` | `DebugF(handle, fmt, ...)` | `DebugW(handle, msg)` | `DebugWF(handle, fmt, ...)` |\n| Info | `Info(handle, msg)` | `InfoF(handle, fmt, ...)` | `InfoW(handle, msg)` | `InfoWF(handle, fmt, ...)` |\n| Warn | `Warn(handle, msg)` | `WarnF(handle, fmt, ...)` | `WarnW(handle, msg)` | `WarnWF(handle, fmt, ...)` |\n| Error | `Error(handle, msg)` | `ErrorF(handle, fmt, ...)` | `ErrorW(handle, msg)` | `ErrorWF(handle, fmt, ...)` |\n| Critical | `Critical(handle, msg)` | `CriticalF(handle, fmt, ...)` | `CriticalW(handle, msg)` | `CriticalWF(handle, fmt, ...)` |\n\n# Function Signatures\n\nAll functions share the same pattern:\n\n```cpp\n// Narrow-char plain\nvoid Level(RED4ext::v1::PluginHandle aHandle, const char* aMessage);\n\n// Narrow-char format (printf-style)\nvoid LevelF(RED4ext::v1::PluginHandle aHandle, const char* aFormat, ...);\n\n// Wide-char plain\nvoid LevelW(RED4ext::v1::PluginHandle aHandle, const wchar_t* aMessage);\n\n// Wide-char format (wprintf-style)\nvoid LevelWF(RED4ext::v1::PluginHandle aHandle, const wchar_t* aFormat, ...);\n```\n\n# Usage\n\nPlugins access logging through the SDK struct passed to `Main()`:\n\n```cpp\nRED4EXT_C_EXPORT bool RED4EXT_CALL Main(\n    RED4ext::v1::PluginHandle aHandle,\n    RED4ext::v1::EMainReason aReason,\n    const RED4ext::v1::Sdk* aSdk)\n{\n    if (aReason == RED4ext::v1::EMainReason::Load)\n    {\n        aSdk->logger->Info(aHandle, \"Plugin loaded successfully\");\n        aSdk->logger->InfoF(aHandle, \"Plugin version: %d.%d.%d\", 1, 0, 0);\n    }\n    return true;\n}\n```\n\n# Severity Levels\n\n| Level | Typical use |\n|-------|-------------|\n| Trace | Very detailed flow tracing, usually disabled in release |\n| Debug | Diagnostic information for development |\n| Info | General informational messages |\n| Warn | Non-critical issues that warrant attention |\n| Error | Errors that the plugin can recover from |\n| Critical | Severe errors that may require termination |\n\n# Related Concepts\n\n- The [v1::Plugin](/plugin-contract/v1-plugin.md) constructor populates the SDK `Logger` struct with these function pointers\n\n# Citations\n\n[1] [src/dll/v1/Logger.hpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/v1/Logger.hpp)\n[2] [src/dll/v1/Logger.cpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/v1/Logger.cpp)"}, {"id": "apis/sdk-functions", "type": "API", "title": "v1 SDK Functions", "description": "SDK function implementations for Hooking, GameStates, and Scripts that plugins call at runtime.", "tags": ["hooking", "game-states", "scripts", "api", "v1"], "group": "apis", "sz": 38, "body": "# Overview\n\nThe `v1` namespace provides three groups of SDK functions that plugins call through the SDK struct: `Hooking` (attach/detach function hooks), `GameStates` (register custom game state handlers), and `Scripts` (register script resources and reference types). These are the primary ways plugins interact with the game engine at runtime.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| `v1::Hooking` | Namespace | Function hooking API (Attach/Detach) |\n| `v1::GameStates` | Namespace | Game state registration API (Add) |\n| `v1::Scripts` | Namespace | Script registration API (Add, RegisterNeverRefType, RegisterMixedRefType) |\n\n# Complete Function Listing\n\n## Hooking\n\n| Function | Signature | Returns | Description |\n|----------|-----------|---------|-------------|\n| `Attach` | `bool Attach(PluginHandle aHandle, void* aTarget, void* aDetour, void** aOriginal)` | `bool` | Attaches a detour function to a target function; `aOriginal` receives the trampoline to call the original |\n| `Detach` | `bool Detach(PluginHandle aHandle, void* aTarget)` | `bool` | Detaches a previously attached detour from the target function |\n\n## GameStates\n\n| Function | Signature | Returns | Description |\n|----------|-----------|---------|-------------|\n| `Add` | `bool Add(PluginHandle aHandle, RED4ext::EGameStateType aType, RED4ext::v1::GameState* aState)` | `bool` | Registers a custom game state handler for the specified game state type |\n\n## Scripts\n\n| Function | Signature | Returns | Description |\n|----------|-----------|---------|-------------|\n| `Add` | `bool Add(PluginHandle aHandle, const wchar_t* aPath)` | `bool` | Registers a script resource file (e.g. `.reds` Redscript file) with the script compilation system |\n| `RegisterNeverRefType` | `bool RegisterNeverRefType(const char* aType)` | `bool` | Registers a native type that should never be garbage-collected by the script VM |\n| `RegisterMixedRefType` | `bool RegisterMixedRefType(const char* aType)` | `bool` | Registers a native type with mixed reference semantics for the script VM |\n\n# Usage\n\nPlugins access these through the SDK struct:\n\n```cpp\n// Hooking\nvoid* original = nullptr;\naSdk->hooking->Attach(aHandle, targetFunc, myDetour, &original);\n// ... later\naSdk->hooking->Detach(aHandle, targetFunc);\n\n// Game states\naSdk->gameStates->Add(aHandle, RED4ext::EGameStateType::Session, &myState);\n\n// Scripts\naSdk->scripts->Add(aHandle, L\"plugins/myplugin/scripts.reds\");\n```\n\n# Related Concepts\n\n- For in-process hooking with RAII, use the [Hook<T> template](/hooks/hook-template.md)\n- For game state vtable hooking, see [GameStateHook<T>](/hooks/gamestate-hook-template.md)\n- The [v1::Plugin](/plugin-contract/v1-plugin.md) constructor wires these into the SDK struct\n\n# Citations\n\n[1] [src/dll/v1/Funcs.hpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/v1/Funcs.hpp)\n[2] [src/dll/v1/Funcs.cpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/v1/Funcs.cpp)"}, {"id": "hooks/gamestate-hook-template", "type": "Class", "title": "GameStateHook<T>", "description": "Template class for hooking game state virtual table functions (OnEnter, OnUpdate, OnExit) with memory protection handling.", "tags": ["hooking", "template", "game-state", "vtable", "memory-protection"], "group": "hooks", "sz": 44, "body": "# Overview\n\n`GameStateHook<T>` is a template class for hooking the three virtual functions of a game state object (`OnEnter`, `OnUpdate`, `OnExit`). Unlike [Hook<T>](/hooks/hook-template.md) which uses Microsoft Detours for function-level detours, `GameStateHook<T>` directly swaps vtable entries with memory protection handling via `MemoryProtection`. The template constrains `T` to derive from `RED4ext::IGameState`.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| `GameStateHook<T>` | Template class | Game state vtable hook wrapper |\n| `Func_t` | Type alias | `bool (*)(T*, RED4ext::CGameApplication*)` \u2014 the vtable function signature |\n| `FuncHook` | Internal struct | Holds detour pointer, original pointer, and shouldExecute flag |\n\n# Class Definition\n\n```cpp\ntemplate<typename T>\nclass GameStateHook\n{\npublic:\n    using Func_t = bool (*)(T*, RED4ext::CGameApplication*);\n\n    static_assert(std::is_base_of_v<RED4ext::IGameState, T>,\n                  \"T should inherit IGameState\");\n\n    GameStateHook(Func_t aOnEnter, Func_t aOnUpdate, Func_t aOnExit);\n\n    bool AttachAt(T* aState);\n    bool DetachAt(T* aState);\n\n    bool OnEnter(T* aState, RED4ext::CGameApplication* aApp);\n    bool OnUpdate(T* aState, RED4ext::CGameApplication* aApp);\n    bool OnExit(T* aState, RED4ext::CGameApplication* aApp);\n\nprivate:\n    struct FuncHook\n    {\n        FuncHook(Func_t aDetour);\n        bool shouldExecute;\n        Func_t detour;\n        Func_t orig;\n    };\n\n    bool SwapVFuncs(T* aState, Func_t aOnEnter, Func_t aOnUpdate, Func_t aOnExit);\n\n    bool m_isAttached;\n    FuncHook m_onEnter;\n    FuncHook m_onUpdate;\n    FuncHook m_onExit;\n};\n```\n\n# Methods\n\n| Method | Return type | Description |\n|--------|-------------|-------------|\n| `GameStateHook(onEnter, onUpdate, onExit)` | \u2014 | Constructor; stores three detour functions |\n| `AttachAt(state)` | `bool` | Swaps vtable entries at indices 3, 4, 5 (OnEnter/OnUpdate/OnExit) with the detour functions; saves originals |\n| `DetachAt(state)` | `bool` | Restores the original vtable entries |\n| `OnEnter(state, app)` | `bool` | Calls the original `OnEnter` once (guarded by `shouldExecute`); subsequent calls return `true` |\n| `OnUpdate(state, app)` | `bool` | Calls the original `OnUpdate` once; subsequent calls return `true` |\n| `OnExit(state, app)` | `bool` | Calls the original `OnExit` once; subsequent calls return `true` |\n\n# Internal FuncHook Struct\n\n| Member | Type | Description |\n|--------|------|-------------|\n| `shouldExecute` | `bool` | Guards one-shot execution of the original function |\n| `detour` | `Func_t` | The replacement function pointer |\n| `orig` | `Func_t` | The saved original function pointer |\n\n# Vtable Layout\n\nThe hook targets three consecutive vtable entries:\n\n| Vtable index | Function |\n|-------------|----------|\n| 3 | `OnEnter` |\n| 4 | `OnUpdate` |\n| 5 | `OnExit` |\n\nThe `SwapVFuncs` method temporarily changes memory protection to `PAGE_READWRITE` using a `MemoryProtection` RAII guard, writes the new function pointers, then restores the original protection.\n\n# Error Handling\n\n`SwapVFuncs` catches three exception types:\n\n| Exception | Behavior |\n|-----------|----------|\n| `MemoryProtection::Exception` | Logs warning, returns `false` |\n| `std::exception` | Logs warning with `e.what()`, returns `false` |\n| `...` (catch-all) | Logs warning, returns `false` |\n\n# Private Members\n\n| Member | Type | Description |\n|--------|------|-------------|\n| `m_isAttached` | `bool` | Whether the hook is currently attached |\n| `m_onEnter` | `FuncHook` | Hook state for OnEnter |\n| `m_onUpdate` | `FuncHook` | Hook state for OnUpdate |\n| `m_onExit` | `FuncHook` | Hook state for OnExit |\n\n# Related Concepts\n\n- Unlike [Hook<T>](/hooks/hook-template.md) which uses Detours, this hooks vtable entries directly\n- Game states can also be registered via the SDK's [GameStates::Add](/apis/sdk-functions.md) function\n\n# Citations\n\n[1] [src/dll/GameStateHook.hpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/GameStateHook.hpp)"}, {"id": "hooks/hook-template", "type": "Class", "title": "Hook<T>", "description": "Template class for function hooking via Microsoft Detours with address or hash-based resolution.", "tags": ["hooking", "template", "detours", "function-hook", "raii"], "group": "hooks", "sz": 38, "body": "# Overview\n\n`Hook<T>` is a template class that wraps a single function hook using Microsoft Detours. It supports two modes: direct address (pass the function pointer) or hash-based (pass a hash and the address is resolved lazily via the `Addresses` singleton). The class provides RAII-style `Attach()` and `Detach()` methods that are idempotent.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| `Hook<T>` | Template class | Function hook wrapper with address or hash resolution |\n\n# Class Definition\n\n```cpp\ntemplate<typename T>\nclass Hook\n{\npublic:\n    Hook(T aAddress, T aDetour);\n    Hook(std::uint32_t aHash, T aDetour);\n\n    operator T() const;\n    uintptr_t GetAddress() const;\n    int32_t Attach();\n    int32_t Detach();\n\nprivate:\n    bool m_isAttached;\n    mutable T m_address;\n    T m_detour;\n    uint32_t m_hash;\n};\n```\n\n# Constructors\n\n| Constructor | Parameters | Description |\n|-------------|-----------|-------------|\n| `Hook(address, detour)` | `T aAddress`, `T aDetour` | Creates a hook with a known function address |\n| `Hook(hash, detour)` | `uint32_t aHash`, `T aDetour` | Creates a hook that resolves the address lazily from `Addresses::Instance()->Resolve(hash)` |\n\n# Methods\n\n| Method | Return type | Description |\n|--------|-------------|-------------|\n| `operator T()` | `T` | Returns the current address (implicit conversion) |\n| `GetAddress()` | `uintptr_t` | Resolves and returns the raw address; lazily resolves from hash if address is 0 |\n| `Attach()` | `int32_t` | Calls `DetourAttach` on the address with the detour; idempotent (returns 0 if already attached) |\n| `Detach()` | `int32_t` | Calls `DetourDetach` to restore the original function; idempotent |\n\n# Private Members\n\n| Member | Type | Description |\n|--------|------|-------------|\n| `m_isAttached` | `bool` | Whether the hook is currently attached |\n| `m_address` | `mutable T` | The target function pointer (mutable for lazy resolution) |\n| `m_detour` | `T` | The detour function pointer |\n| `m_hash` | `uint32_t` | Hash for lazy address resolution (0 if direct address was used) |\n\n# Usage Example\n\n```cpp\nusing SomeFunc_t = void (*)(int);\nSomeFunc_t originalFunc = nullptr;\n\nvoid MyDetour(int param)\n{\n    // Pre-hook logic\n    originalFunc(param);\n    // Post-hook logic\n}\n\n// Direct address\nHook<SomeFunc_t> hook(reinterpret_cast<SomeFunc_t>(0x12345678), MyDetour);\nhook.Attach();\n\n// Hash-based\nHook<SomeFunc_t> hashHook(0xABCDEF01, MyDetour);\nhashHook.Attach(); // Address resolved from Addresses singleton\n\n// ... later\nhook.Detach();\n```\n\n# Related Concepts\n\n- For game state vtable hooking, see [GameStateHook<T>](/hooks/gamestate-hook-template.md)\n- The SDK also exposes [Hooking::Attach/Detach](/apis/sdk-functions.md) for runtime-managed hooks\n\n# Citations\n\n[1] [src/dll/Hook.hpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/Hook.hpp)"}, {"id": "plugin-contract/plugin-base", "type": "Class", "title": "PluginBase", "description": "Abstract base class for plugins providing Query, Main, and metadata accessors.", "tags": ["plugin", "base-class", "abstract", "lifecycle"], "group": "plugin-contract", "sz": 40, "body": "# Overview\n\n`PluginBase` is the abstract base class that the RED4ext runtime uses to manage a loaded plugin. It stores the plugin's DLL path and module handle, and delegates version-specific behavior to pure virtual methods implemented by subclasses such as [v1::Plugin](/plugin-contract/v1-plugin.md).\n\nThe runtime calls `Query()` to populate plugin info and `Main()` with an `EMainReason` to drive load/unload lifecycle events.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| `PluginBase` | Class | Abstract base for all plugin versions |\n\n# Class Definition\n\n```cpp\nclass PluginBase\n{\npublic:\n    PluginBase(const std::filesystem::path& aPath, wil::unique_hmodule aModule);\n    virtual ~PluginBase() = default;\n\n    virtual const uint32_t GetApiVersion() const = 0;\n    virtual void* GetPluginInfo() = 0;\n    virtual const void* GetSdkStruct() const = 0;\n\n    virtual const std::wstring_view GetName() const = 0;\n    virtual const std::wstring_view GetAuthor() const = 0;\n    virtual const RED4ext::v1::SemVer& GetVersion() const = 0;\n    virtual const RED4ext::v1::FileVer& GetRuntimeVersion() const = 0;\n    virtual const RED4ext::v1::SemVer& GetSdkVersion() const = 0;\n\n    const std::filesystem::path& GetPath() const;\n    HMODULE GetModule() const;\n\n    bool Query();\n    bool Main(RED4ext::v1::EMainReason aReason);\n\nprivate:\n    std::filesystem::path m_path;\n    wil::unique_hmodule m_module;\n};\n```\n\n# Methods\n\n## Public API\n\n| Method | Return type | Description |\n|--------|-------------|-------------|\n| `PluginBase(path, module)` | \u2014 | Constructor; stores DLL path and module handle |\n| `~PluginBase()` | virtual | Virtual default destructor |\n| `GetApiVersion()` | `uint32_t` | Pure virtual \u2014 returns the API version (e.g. `RED4EXT_API_VERSION_1`) |\n| `GetPluginInfo()` | `void*` | Pure virtual \u2014 returns pointer to the plugin info struct |\n| `GetSdkStruct()` | `const void*` | Pure virtual \u2014 returns pointer to the SDK struct passed to `Main()` |\n| `GetName()` | `wstring_view` | Pure virtual \u2014 returns plugin name |\n| `GetAuthor()` | `wstring_view` | Pure virtual \u2014 returns plugin author |\n| `GetVersion()` | `SemVer&` | Pure virtual \u2014 returns plugin semantic version |\n| `GetRuntimeVersion()` | `FileVer&` | Pure virtual \u2014 returns target game runtime version |\n| `GetSdkVersion()` | `SemVer&` | Pure virtual \u2014 returns SDK version the plugin was built against |\n| `GetPath()` | `filesystem::path&` | Returns the DLL file path |\n| `GetModule()` | `HMODULE` | Returns the loaded module handle |\n| `Query()` | `bool` | Calls the plugin's exported `Query` function via the module |\n| `Main(reason)` | `bool` | Calls the plugin's exported `Main` function with the SDK struct |\n\n## Private Members\n\n| Member | Type | Description |\n|--------|------|-------------|\n| `m_path` | `std::filesystem::path` | Path to the plugin DLL on disk |\n| `m_module` | `wil::unique_hmodule` | RAII wrapper around the Windows `HMODULE` |\n\n# Related Concepts\n\n- The concrete v1 implementation is [v1::Plugin](/plugin-contract/v1-plugin.md)\n- See [Plugin Lifecycle](/plugin-contract/plugin-lifecycle.md) for the export contract that `Query()` and `Main()` invoke\n\n# Citations\n\n[1] [src/dll/PluginBase.hpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/PluginBase.hpp)\n[2] [src/dll/PluginBase.cpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/PluginBase.cpp)"}, {"id": "plugin-contract/plugin-lifecycle", "type": "Reference", "title": "Plugin Lifecycle", "description": "Plugin entry point contract \u2014 the three exports every RED4ext plugin must implement.", "tags": ["plugin", "lifecycle", "exports", "entry-point"], "group": "plugin-contract", "sz": 40, "body": "# Overview\n\nEvery RED4ext plugin is a DLL that exports three C functions. The runtime calls these in order: `Supports` to query the API version, `Query` to populate plugin metadata, and `Main` for load/unload lifecycle events. This contract is the integration point between a plugin and the RED4ext runtime.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| `Main` | Exported function | Called on load and unload; receives plugin handle, reason, and SDK pointer |\n| `Query` | Exported function | Populates `RED4ext::v1::PluginInfo` with name, author, version, runtime, and SDK version |\n| `Supports` | Exported function | Returns the highest API version the plugin supports |\n\n# Export Details\n\n## `Main`\n\n```cpp\nRED4EXT_C_EXPORT bool RED4EXT_CALL Main(\n    RED4ext::v1::PluginHandle aHandle,\n    RED4ext::v1::EMainReason aReason,\n    const RED4ext::v1::Sdk* aSdk\n);\n```\n\n- **aHandle** \u2014 opaque handle identifying this plugin instance; pass it to SDK functions\n- **aReason** \u2014 `EMainReason::Load` or `EMainReason::Unload`\n- **aSdk** \u2014 pointer to the SDK struct containing function pointers for logging, hooking, game states, and scripts\n- **Returns** \u2014 `true` on success; returning `false` on load aborts plugin initialization\n\n## `Query`\n\n```cpp\nRED4EXT_C_EXPORT void RED4EXT_CALL Query(RED4ext::v1::PluginInfo* aInfo);\n```\n\nPopulates the `PluginInfo` struct:\n\n| Field | Type | Example |\n|-------|------|---------|\n| `name` | `wchar_t*` | `L\"MyPlugin\"` |\n| `author` | `wchar_t*` | `L\"AuthorName\"` |\n| `version` | `SemVer` | `RED4EXT_V1_SEMVER(1, 0, 0)` |\n| `runtime` | `FileVer` | `RED4EXT_V1_RUNTIME_VERSION_LATEST` |\n| `sdk` | `SemVer` | `RED4EXT_V1_SDK_VERSION_CURRENT` |\n\n## `Supports`\n\n```cpp\nRED4EXT_C_EXPORT uint32_t RED4EXT_CALL Supports();\n```\n\nReturns the API version the plugin was built against (e.g. `RED4EXT_API_VERSION_1`). The runtime uses this to instantiate the correct [PluginBase](/plugin-contract/plugin-base.md) subclass.\n\n# Example\n\nFrom `src/playground/Main.cpp`:\n\n```cpp\nRED4EXT_C_EXPORT bool RED4EXT_CALL Main(RED4ext::v1::PluginHandle aHandle,\n                                         RED4ext::v1::EMainReason aReason,\n                                         const RED4ext::v1::Sdk* aSdk)\n{\n    switch (aReason)\n    {\n    case RED4ext::v1::EMainReason::Load:\n        // Initialize plugin, attach hooks, register game states\n        break;\n    case RED4ext::v1::EMainReason::Unload:\n        // Detach hooks, free resources\n        break;\n    }\n    return true;\n}\n\nRED4EXT_C_EXPORT void RED4EXT_CALL Query(RED4ext::v1::PluginInfo* aInfo)\n{\n    aInfo->name = L\"RED4ext.Playground\";\n    aInfo->author = L\"WopsS\";\n    aInfo->version = RED4EXT_V1_SEMVER(1, 0, 0);\n    aInfo->runtime = RED4EXT_V1_RUNTIME_VERSION_LATEST;\n    aInfo->sdk = RED4EXT_V1_SDK_VERSION_CURRENT;\n}\n\nRED4EXT_C_EXPORT uint32_t RED4EXT_CALL Supports()\n{\n    return RED4EXT_API_VERSION_1;\n}\n```\n\n# Related Concepts\n\n- The runtime creates a [PluginBase](/plugin-contract/plugin-base.md) instance from the exported info\n- Use the SDK's [Logger API](/apis/logging.md) for plugin logging\n- Call [SDK functions](/apis/sdk-functions.md) for hooking, game states, and scripts\n\n# Citations\n\n[1] [src/playground/Main.cpp](https://github.com/WopsS/RED4ext/blob/main/src/playground/Main.cpp)"}, {"id": "plugin-contract/v1-plugin", "type": "Class", "title": "v1::Plugin", "description": "Concrete v1 plugin implementation that assembles the SDK struct with function pointers for logging, hooking, game states, and scripts.", "tags": ["plugin", "v1", "sdk", "implementation"], "group": "plugin-contract", "sz": 42, "body": "# Overview\n\n`v1::Plugin` is the concrete implementation of [PluginBase](/plugin-contract/plugin-base.md) for API version 1. Its constructor populates the `RED4ext::v1::Sdk` struct with function pointers from the [Logger](/apis/logging.md), [Hooking/GameStates/Scripts](/apis/sdk-functions.md) APIs, which are then passed to the plugin's exported `Main` function.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| `v1::Plugin` | Class | Concrete `PluginBase` subclass for API v1 |\n\n# Class Definition\n\n```cpp\nnamespace v1\n{\nclass Plugin : public PluginBase\n{\npublic:\n    Plugin(const std::filesystem::path& aPath, wil::unique_hmodule aModule);\n\n    const uint32_t GetApiVersion() const final;\n    void* GetPluginInfo() final;\n    const void* GetSdkStruct() const final;\n\n    virtual const std::wstring_view GetName() const final;\n    virtual const std::wstring_view GetAuthor() const final;\n    virtual const RED4ext::v1::SemVer& GetVersion() const final;\n    virtual const RED4ext::v1::FileVer& GetRuntimeVersion() const final;\n    virtual const RED4ext::v1::SemVer& GetSdkVersion() const final;\n\nprivate:\n    RED4ext::v1::PluginInfo m_info;\n    RED4ext::v1::Sdk m_sdk;\n    RED4ext::v1::SemVer m_runtime;\n    RED4ext::v1::Logger m_logger;\n    RED4ext::v1::Hooking m_hooking;\n    RED4ext::v1::GameStates m_gameStates;\n    RED4ext::v1::Scripts m_scripts;\n};\n} // namespace v1\n```\n\n# SDK Struct Assembly\n\nThe constructor wires function pointers into SDK sub-structs:\n\n| SDK field | Sub-struct | Source functions |\n|-----------|-----------|------------------|\n| `m_sdk.runtime` | `SemVer` | `Image::Get()->GetProductVersion()` |\n| `m_sdk.logger` | `Logger` | All 24 functions from [v1::Logger](/apis/logging.md) |\n| `m_sdk.hooking` | `Hooking` | `v1::Hooking::Attach`, `v1::Hooking::Detach` |\n| `m_sdk.gameStates` | `GameStates` | `v1::GameStates::Add` |\n| `m_sdk.scripts` | `Scripts` | `v1::Scripts::Add`, `RegisterNeverRefType`, `RegisterMixedRefType` |\n\n# Method Implementations\n\n| Method | Returns | Description |\n|--------|---------|-------------|\n| `GetApiVersion()` | `RED4EXT_API_VERSION_1` | Returns the constant API version |\n| `GetPluginInfo()` | `&m_info` | Pointer to the populated `PluginInfo` struct |\n| `GetSdkStruct()` | `&m_sdk` | Pointer to the assembled `Sdk` struct |\n| `GetName()` | `m_info.name` | Plugin name from `Query()` |\n| `GetAuthor()` | `m_info.author` | Plugin author from `Query()` |\n| `GetVersion()` | `m_info.version` | Plugin SemVer from `Query()` |\n| `GetRuntimeVersion()` | `m_info.runtime` | Target runtime version from `Query()` |\n| `GetSdkVersion()` | `m_info.sdk` | SDK version from `Query()` |\n\n# Private Members\n\n| Member | Type | Description |\n|--------|------|-------------|\n| `m_info` | `PluginInfo` | Populated by the plugin's exported `Query` function |\n| `m_sdk` | `Sdk` | Struct passed to the plugin's `Main` function |\n| `m_runtime` | `SemVer` | Game runtime version from the PE image |\n| `m_logger` | `Logger` | SDK logger sub-struct with 24 function pointers |\n| `m_hooking` | `Hooking` | SDK hooking sub-struct with Attach/Detach |\n| `m_gameStates` | `GameStates` | SDK game states sub-struct with Add |\n| `m_scripts` | `Scripts` | SDK scripts sub-struct with Add + type registration |\n\n# Related Concepts\n\n- Inherits from [PluginBase](/plugin-contract/plugin-base.md)\n- Populates the SDK's [Logger struct](/apis/logging.md) with function pointers\n- Populates the SDK's [Hooking/GameStates/Scripts structs](/apis/sdk-functions.md) with function pointers\n\n# Citations\n\n[1] [src/dll/v1/Plugin.hpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/v1/Plugin.hpp)\n[2] [src/dll/v1/Plugin.cpp](https://github.com/WopsS/RED4ext/blob/main/src/dll/v1/Plugin.cpp)"}], EDGES=[{"source": "apis/logging", "target": "plugin-contract/v1-plugin"}, {"source": "apis/sdk-functions", "target": "hooks/hook-template"}, {"source": "apis/sdk-functions", "target": "hooks/gamestate-hook-template"}, {"source": "apis/sdk-functions", "target": "plugin-contract/v1-plugin"}, {"source": "hooks/gamestate-hook-template", "target": "hooks/hook-template"}, {"source": "hooks/gamestate-hook-template", "target": "apis/sdk-functions"}, {"source": "hooks/hook-template", "target": "hooks/gamestate-hook-template"}, {"source": "hooks/hook-template", "target": "apis/sdk-functions"}, {"source": "plugin-contract/plugin-base", "target": "plugin-contract/v1-plugin"}, {"source": "plugin-contract/plugin-base", "target": "plugin-contract/plugin-lifecycle"}, {"source": "plugin-contract/plugin-lifecycle", "target": "plugin-contract/plugin-base"}, {"source": "plugin-contract/plugin-lifecycle", "target": "apis/logging"}, {"source": "plugin-contract/plugin-lifecycle", "target": "apis/sdk-functions"}, {"source": "plugin-contract/v1-plugin", "target": "plugin-contract/plugin-base"}, {"source": "plugin-contract/v1-plugin", "target": "apis/logging"}, {"source": "plugin-contract/v1-plugin", "target": "apis/sdk-functions"}];
const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'breadthfirst',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?marked.parse(n.body):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}
document.getElementById('search').oninput=applyFilter;
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
document.getElementById('layout').onchange=e=>{cy.layout({name:e.target.value,animate:true,padding:40,
 nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='breadthfirst';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
