const NODES=[{"id": "apis/red4ext", "type": "API", "title": "RED4ext C++ API", "description": "C++ header for RED4ext plugin integration with ArchiveXL runtime.", "tags": ["red4ext", "cpp", "api", "plugin"], "group": "apis", "sz": 36, "body": "# Overview\n\nThe RED4ext C++ API provides a header-only `ArchiveXL` class that allows other RED4ext plugins to register custom archives and archive directories with the ArchiveXL runtime. It uses RTTI to call into the ArchiveXL Redscript facade at runtime.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| ArchiveXL | C++ class | Static utility class for registering archives with ArchiveXL |\n\n# Public Methods\n\n| Method | Signature | Description |\n|--------|-----------|-------------|\n| RegisterArchive | `static bool RegisterArchive(std::filesystem::path aPath)` | Registers a single archive file at the given path |\n| RegisterArchive | `static bool RegisterArchive(HMODULE aHandle, std::filesystem::path aPath)` | Registers an archive relative to a module handle |\n| RegisterArchives | `static bool RegisterArchives(std::filesystem::path aPath)` | Registers all archives in a directory |\n| RegisterArchives | `static bool RegisterArchives(HMODULE aHandle, std::filesystem::path aPath)` | Registers all archives in a directory relative to a module handle |\n\n# Internal Methods\n\n| Method | Visibility | Description |\n|--------|-----------|-------------|\n| Initialize | private | Initializes the RTTI facade by looking up the `ArchiveXL` class and its `Version` function |\n| RegisterPathOrQueue | private | Registers a path immediately or queues it for later if ArchiveXL is not yet loaded |\n| RegisterPath | private | Calls `RegisterArchive` or `RegisterDir` on the ArchiveXL RTTI facade |\n| RegisterPendingPaths | private | Flushes queued paths once ArchiveXL is initialized, or re-queues via post-register callback |\n| GetModulePath | private | Resolves a module handle to its parent directory path |\n\n# Static State\n\n| Member | Type | Description |\n|--------|------|-------------|\n| s_facade | `RED4ext::CClass*` | Cached RTTI class pointer to the ArchiveXL facade |\n| s_paths | `std::vector<std::filesystem::path>` | Queue of paths pending registration |\n\n# Usage Example\n\n```cpp\n#include <ArchiveXL.hpp>\n\n// Register a single archive\nArchiveXL::RegisterArchive(GetModuleHandle(nullptr), \"plugins\\my_mod\\my_mod.archive\");\n\n// Register all archives in a directory\nArchiveXL::RegisterArchives(GetModuleHandle(nullptr), \"plugins\\my_mod\\archives\\\");\n```\n\n# Dependencies\n\n- RED4ext SDK (`RED4ext/Callback.hpp`, `RED4ext/Memory/Allocators.hpp`, `RED4ext/RTTISystem.hpp`)\n- Windows API (`libloaderapi.h`, `minwindef.h`)\n- C++17 `<filesystem>`\n\n# Citations\n\n[1] [ArchiveXL.hpp](https://github.com/psiberx/cp2077-archive-xl/blob/main/support/red4ext/ArchiveXL.hpp)"}, {"id": "apis/redscript", "type": "API", "title": "Redscript API", "description": "Native ArchiveXL class and dynamic appearance functions callable from Redscript.", "tags": ["redscript", "api", "dynamic-appearance", "native"], "group": "apis", "sz": 41, "body": "# Overview\n\nThe Redscript API provides the primary interface for modders working with ArchiveXL from Redscript code. It consists of a native `ArchiveXL` class with static methods and a set of helper functions for manipulating dynamic appearance strings.\n\nDynamic appearances use .xl resources \u2014 see [Resource Format](/references/resource-format.md) for the .xl file specification.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| ArchiveXL | Native class | Static native class providing version checks, garment offset control, and body type queries |\n| DynamicAppearance | Module | Helper functions for manipulating dynamic appearance condition strings |\n| ArchiveXL (module) | Module declaration | Module declaration establishing the `ArchiveXL` namespace |\n\n# ArchiveXL Native Class\n\nDeclared in `Facade.reds`:\n\n| Method | Signature | Description |\n|--------|-----------|-------------|\n| GetBodyType | `static native func GetBodyType(puppet: wref<GameObject>) -> CName` | Returns the body type CName for the given puppet |\n| EnableGarmentOffsets | `static native func EnableGarmentOffsets()` | Enables garment offset adjustments |\n| DisableGarmentOffsets | `static native func DisableGarmentOffsets()` | Disables garment offset adjustments |\n| Require | `static native func Require(version: String) -> Bool` | Checks if the installed ArchiveXL version meets the requirement |\n| Version | `static native func Version() -> String` | Returns the installed ArchiveXL version string |\n\n# DynamicAppearance Module\n\nDeclared in `DynamicAppearance.reds` under `module ArchiveXL.DynamicAppearance`:\n\n| Function | Signature | Description |\n|----------|-----------|-------------|\n| OverrideDynamicAppearanceCondition | `func OverrideDynamicAppearanceCondition(app: String, attr: String, value: String) -> String` | Overrides or appends a condition attribute in a dynamic appearance string |\n| ConvertAppearanceNameToTPP | `func ConvertAppearanceNameToTPP(app: String) -> String` | Converts an appearance name to third-person perspective |\n| ConvertAppearanceNameToFPP | `func ConvertAppearanceNameToFPP(app: String) -> String` | Converts an appearance name to first-person perspective |\n| ConvertAppearanceNameToPartialSleeves | `func ConvertAppearanceNameToPartialSleeves(app: String) -> String` | Converts an appearance name to partial sleeves variant |\n| ConvertAppearanceNameToFullSleeves | `func ConvertAppearanceNameToFullSleeves(app: String) -> String` | Converts an appearance name to full sleeves variant |\n\n## Dynamic Appearance String Format\n\nDynamic appearance strings use the format: `base!condition1=value1+condition2=value2%hash`\n\n- `base` \u2014 the base appearance name\n- `!` \u2014 separator between base and dynamic conditions\n- `+` \u2014 separator between multiple conditions\n- `%` \u2014 separator before the optional hash suffix\n\nThe `OverrideDynamicAppearanceCondition` function parses this format, replaces the matching attribute if found, or appends it if not.\n\n# Module Declaration\n\n`Module.reds` declares `module ArchiveXL`, establishing the root namespace for all ArchiveXL Redscript code.\n\n# Citations\n\n[1] [Facade.reds](https://github.com/psiberx/cp2077-archive-xl/blob/main/scripts/Facade.reds)\n[2] [DynamicAppearance.reds](https://github.com/psiberx/cp2077-archive-xl/blob/main/scripts/DynamicAppearance.reds)\n[3] [Module.reds](https://github.com/psiberx/cp2077-archive-xl/blob/main/scripts/Module.reds)"}, {"id": "overview", "type": "Reference", "title": "Project Overview", "description": "ArchiveXL modding tool for loading custom resources without touching original game files.", "tags": ["archive", "modding", "cyberpunk", "overview"], "group": "(root)", "sz": 33, "body": "# Overview\n\nArchiveXL is a Cyberpunk 2077 modding tool that allows you to load custom resources without touching original game files, thus allowing multiple mods to expand the same resources without conflicts.\n\n## Capabilities\n\n- Load custom entity factories (necessary for item additions)\n- Add localization texts usable in scripts, resources, and TweakDB\n- Edit existing localization texts without overwriting original resources\n- Override submesh visibility of entity parts\n- Add visual tags to clothing items\n- Spawn widgets from any library without registering dependencies\n\n## Compatibility\n\n| Requirement | Version |\n|-------------|--------|\n| Cyberpunk 2077 | 2.31 |\n| redscript | 0.5.31+ |\n| RED4ext | 1.29.0+ |\n\n## Installation\n\n1. Install [RED4ext](https://docs.red4ext.com/getting-started/installing-red4ext) 1.29.0+\n2. Extract the release archive `ArchiveXL-x.x.x.zip` into the Cyberpunk 2077 directory\n\n## Key APIs\n\n- [Redscript API](/apis/redscript.md) \u2014 Native class and dynamic appearance functions for Redscript modders\n- [RED4ext C++ API](/apis/red4ext.md) \u2014 C++ header for plugin integration\n- [ArchiveXL Resource Format](/references/resource-format.md) \u2014 The .xl file format specification\n\n## Documentation Links\n\n- [Dynamic appearances](https://github.com/psiberx/cp2077-archive-xl/wiki#dynamic-appearances)\n- [Body types](https://github.com/psiberx/cp2077-archive-xl/wiki#body-types)\n- [Appearance suffixes](https://github.com/psiberx/cp2077-archive-xl/wiki#appearance-suffixes)\n- [Components overrides](https://github.com/psiberx/cp2077-archive-xl/wiki#components-overrides)\n- [Visual tags](https://github.com/psiberx/cp2077-archive-xl/wiki#visual-tags)\n- [Extending resources](https://github.com/psiberx/cp2077-archive-xl/wiki#extending-resources)\n\n# Citations\n\n[1] [ArchiveXL README](https://github.com/psiberx/cp2077-archive-xl/blob/main/README.md)"}, {"id": "references/builtin-resources/fix", "type": "Reference", "title": "Fix Operation", "description": "Built-in .xl files demonstrating the fix operation for correcting appearance name and path mappings.", "tags": ["xl", "fix", "builtin", "appearance-mapping"], "group": "references", "sz": 37, "body": "# Overview\n\nThe `fix` operation corrects appearance name and path mappings in game resources. It supports three sub-operations: `paths` (remap appearance paths), `names` (rename material submesh names), and `context` (set material context values). ArchiveXL ships with 5 built-in fix `.xl` files.\n\nDemonstrates the fix operation from the [Resource Format](/references/resource-format.md). Fixes are often paired with [Scope Operation](/references/builtin-resources/scope.md).\n\n# Member Files\n\n| # | File | Description |\n|---|------|-------------|\n| 1 | PlayerCustomizationBeardFix.xl | Fixes beard mesh material names with `@beard` suffix and character customization appearance paths |\n| 2 | PlayerCustomizationBrowsFix.xl | Fixes eyebrow appearance paths in character customization UI (13 brow variants \u00d7 male/female) |\n| 3 | PlayerCustomizationEyesFix.xl | Fixes eye appearance paths in character customization UI with YAML anchor reuse for male/female |\n| 4 | PlayerCustomizationHairFix.xl | Fixes hair mesh material names with `@cap` and `@dread` suffixes (largest file, ~19K lines) |\n| 5 | PlayerCustomizationLashesFix.xl | Fixes eyelash mesh material names with `@lashes` suffix and context material references |\n\n# Fix Sub-Operations\n\n## paths\n\nRemaps old appearance paths to new ones within a target resource:\n\n```yaml\nresource:\n  fix:\n    base\\gameplay\\gui\\female_cco.inkcharcustomization:\n      paths:\n        base\\old.app: archive_xl\\new.app\n```\n\n## names\n\nRenames material submesh names with a suffix. Uses YAML anchors for reuse across resources:\n\n```yaml\nresource:\n  fix:\n    base\\head.mesh:\n      names: &MaterialFix\n        red_merlot: red_merlot@eyes\n        black_carbon: black_carbon@eyes\n```\n\n## context\n\nSets material context values for a target resource:\n\n```yaml\nresource:\n  fix:\n    base\\head.mesh:\n      context:\n        LashesBaseMaterial: archive_xl\\eyes\\hel_pwa.mi\n        AppearanceExpansionSource: eyelashes__blonde_platinum\n```\n\n# YAML Anchor Reuse\n\nFix files use YAML anchors (`&AppearanceFixF`, `&AppearanceFixM`, `&MaterialFix`) and aliases (`*AppearanceFixF`, `*MaterialFix`) to avoid repeating large configuration blocks for male/female variants.\n\n# Material Name Suffixes\n\n| Fix file | Suffix used | Purpose |\n|----------|------------|---------|\n| BeardFix | `@beard` | Beard material submesh names |\n| EyesFix | `@eyes` | Eye material submesh names |\n| LashesFix | `@lashes` | Eyelash material submesh names |\n| HairFix | `@cap`, `@dread` | Hair cap and dreadlock material submesh names |\n\n# Citations\n\n[1] [ArchiveXL resources directory](https://github.com/psiberx/cp2077-archive-xl/tree/main/bundle/source/resources)"}, {"id": "references/builtin-resources/migration", "type": "Reference", "title": "Link Operation (Migration)", "description": "Built-in .xl file demonstrating the link operation for migrating resources between paths.", "tags": ["xl", "link", "migration", "builtin"], "group": "references", "sz": 32, "body": "# Overview\n\nThe `link` operation creates links between resource paths, allowing one resource path to resolve to another. This is used for migration and backward compatibility \u2014 when a resource is renamed or moved, a link ensures old paths still resolve correctly.\n\nDemonstrates the link operation from the [Resource Format](/references/resource-format.md).\n\n# Member Files\n\n| # | File | Description |\n|---|------|-------------|\n| 1 | Migration.xl | Links old ArchiveXL resource paths to new paths for hair, lashes, and eyebrow appearance files |\n\n# Link Pattern\n\n```yaml\nresource:\n  link:\n    <old-path>:\n      - <new-path-1>\n      - <new-path-2>\n```\n\n# Migration Entries\n\nThe `Migration.xl` file contains link entries for the following resource categories:\n\n| Category | Old path pattern | New path pattern | Count |\n|----------|-----------------|------------------|-------|\n| Hair mesh | `h1_base_color_patch.mesh` | `base_color_patch.mesh` | 1 |\n| Lashes (male) | `hel_000_pma__basehead.app` | `hel_pma_lashes.app` | 1 |\n| Lashes (female) | `hel_000_pwa__basehead.app` | `hel_pwa_lashes.app` | 1 |\n| Brows (male) | `heb_000_pma__basehead_01-13.app` | `heb_pma_brows__01-13.app` | 13 |\n| Brows (female) | `heb_000_pwa__basehead_01-13.app` | `heb_pwa_brows__01-13.app` | 13 |\n\n**Total: 29 link entries**\n\n# Notes\n\n- The migration file ensures that resources renamed in newer versions of ArchiveXL remain accessible at their old paths.\n- Brow appearance files are migrated for both male (`pma`) and female (`pwa`) body types, covering 13 brow variants each.\n- The hair mesh link is a single entry for the base color patch mesh.\n\n# Citations\n\n[1] [Migration.xl](https://github.com/psiberx/cp2077-archive-xl/blob/main/bundle/source/resources/Migration.xl)"}, {"id": "references/builtin-resources/patch", "type": "Reference", "title": "Patch & Copy Operations", "description": "Built-in .xl files demonstrating patch and copy operations for mesh property overrides and resource duplication.", "tags": ["xl", "patch", "copy", "builtin", "mesh-override"], "group": "references", "sz": 36, "body": "# Overview\n\nThe `patch` operation overrides specific properties of a source resource onto target resources. The `copy` operation duplicates a resource to a new path. ArchiveXL ships with 4 built-in files that use these operations.\n\nDemonstrates patch/copy operations from the [Resource Format](/references/resource-format.md).\n\n# Member Files\n\n| # | File | Operations used | Description |\n|---|------|-----------------|-------------|\n| 1 | PlayerCustomizationBrowsPatch.xl | copy + patch | Copies eyebrow morphtarget and mesh resources, then patches brow mesh/morphtarget properties onto player base brow resources |\n| 2 | PlayerCustomizationEyesPatch.xl | copy + patch | Copies eye morph resources with normal fixes, patches eye mesh appearances onto player base eye meshes, patches null morphtarget base textures |\n| 3 | PlayerCustomizationHairPatch.xl | patch | Patches hair mesh appearances onto player male/female hair meshes |\n| 4 | PlayerCustomizationLashesPatch.xl | patch | Patches eyelash mesh appearances onto player base lash meshes and hair mesh |\n\n# Patch Operation\n\nOverrides specific properties of a source resource onto target resources:\n\n```yaml\nresource:\n  patch:\n    <source-resource>:\n      props: [ <property-name>, ... ]\n      targets: [ <target-resource>, ... ]\n```\n\n## Properties used in built-in patches\n\n| Property | Used in | Description |\n|----------|---------|-------------|\n| `appearances` | EyesPatch, HairPatch, LashesPatch | Override appearance data on target meshes |\n| `blob, boundingBox, targets` | BrowsPatch | Override morphtarget blob and bounding data |\n| `renderResourceBlob` | BrowsPatch | Override render resource blob on meshes |\n| `baseTexture, baseTextureParamName` | EyesPatch | Override base texture on null morphtarget |\n\n# Copy Operation\n\nDuplicates a resource to a new path:\n\n```yaml\nresource:\n  copy:\n    <source-resource>:\n      - <destination-resource-1>\n      - <destination-resource-2>\n```\n\n## Copy patterns in built-in files\n\n| Source | Destination | File |\n|--------|-------------|------|\n| `he_000_pwa__morphs.morphtarget` | `he_000_pwa__morphs_normal_fix.morphtarget` | EyesPatch |\n| `he_000_pma__morphs.morphtarget` | `he_000_pma__morphs_normal_fix.morphtarget` | EyesPatch |\n| `heb_000_pwa__morphs.morphtarget` | `heb_000_pwa__morphs.morphtarget` (self-copy) | BrowsPatch |\n| `heb_000_pwa_c__basehead.mesh` | `heb_000_pwa_c__basehead.mesh` (self-copy) | BrowsPatch |\n\n# Citations\n\n[1] [ArchiveXL resources directory](https://github.com/psiberx/cp2077-archive-xl/tree/main/bundle/source/resources)"}, {"id": "references/builtin-resources/scope", "type": "Reference", "title": "Scope Operation", "description": "Built-in .xl files demonstrating the scope operation for restricting resource visibility to specific entities.", "tags": ["xl", "scope", "builtin", "resource-visibility"], "group": "references", "sz": 37, "body": "# Overview\n\nThe `scope` operation restricts which resources are visible to specific entities. It maps a resource path to a list of entity/resource paths that should be able to see it. ArchiveXL ships with 9 built-in scope `.xl` files that demonstrate this operation.\n\nDemonstrates the scope operation from the [Resource Format](/references/resource-format.md). Dynamic appearances may reference scoped resources via [Redscript API](/apis/redscript.md).\n\n# Member Files\n\n| # | File | Description |\n|---|------|-------------|\n| 1 | PhotoModeScope.xl | Scopes photo mode entity resources for all photo mode characters (male, female, big, cat, iguana) |\n| 2 | PlayerBaseScope.xl | Scopes player base entities (player.ent \u2192 player_ma.ent, player_wa.ent) with FPP/TPP/cutscene variants |\n| 3 | PlayerCustomizationScope.xl | Empty placeholder for player customization scoping |\n| 4 | PlayerCustomizationBeardScope.xl | Scopes beard appearance and mesh resources for male player customization |\n| 5 | PlayerCustomizationBrowsScope.xl | Scopes eyebrow appearance, morphtarget, and mesh resources for both body types |\n| 6 | PlayerCustomizationEyesScope.xl | Scopes eye appearance, morphtarget, and mesh resources for both body types |\n| 7 | PlayerCustomizationHairScope.xl | Scopes hair appearance and mesh resources for both body types with multiple hair styles |\n| 8 | PlayerCustomizationLashesScope.xl | Scopes eyelash appearance, morphtarget, and mesh resources for both body types |\n| 9 | QuestBaseScope.xl | Scopes quest resources (cyberpunk2077.quest \u2192 main and ep1 quest files) |\n\n# Scope Pattern\n\nAll scope files follow this structure:\n\n```yaml\nresource:\n  scope:\n    <resource-path>:\n      - <visible-to-path-1>\n      - <visible-to-path-2>\n```\n\n## Key scope targets\n\n| Scope key | Typical targets |\n|-----------|----------------|\n| `player_customization.app` | Body-type-specific appearance files (e.g. `player_ma_eyes.app`, `player_wa_hair.app`) |\n| `player.ent` | `player_ma.ent`, `player_wa.ent` (male/female player entities) |\n| `photomode_wa.ent` / `photomode_ma.ent` / `photomode_mb.ent` / `photomode_mm.ent` | Character-specific photo mode entities |\n| `cyberpunk2077.quest` | `cyberpunk2077_main.quest`, `cyberpunk2077_ep1.quest` |\n\n# Notes\n\n- Scope files use a cascading pattern: a top-level resource maps to intermediate resources, which in turn map to specific game resources.\n- The `PlayerCustomizationScope.xl` file is empty (0 bytes) \u2014 it exists as a placeholder.\n- `PhotoModeScope.xl` covers the most entities (50+ photo mode characters across base game and Phantom Liberty).\n\n# Citations\n\n[1] [ArchiveXL resources directory](https://github.com/psiberx/cp2077-archive-xl/tree/main/bundle/source/resources)"}, {"id": "references/resource-format", "type": "Reference", "title": "ArchiveXL Resource Format", "description": "The .xl file format specification for modders defining factories, localization, and resource operations.", "tags": ["xl", "resource-format", "yaml", "modding"], "group": "references", "sz": 40, "body": "# Overview\n\nThe ArchiveXL resource format (`.xl` files) is a YAML-based format that allows modders to extend game resources without modifying original files. Each `.xl` file is placed alongside a mod's archive and declares resource operations under a top-level `resource:` key.\n\n# Template\n\nThe template file `mod.archive.xl` shows the minimal structure:\n\n```yaml\nfactories:\n  - mymod\\factories\\clothing.csv\n  - mymod\\factories\\weapons.csv\nlocalization:\n  onscreens:\n    en-us: mymod\\localization\\en-us.json\n    de-de: mymod\\localization\\de-de.json\n```\n\n# Top-Level Keys\n\n| Key | Description |\n|-----|-------------|\n| `factories` | List of factory CSV file paths to register custom entity factories |\n| `localization` | Localization file mappings with sub-keys for locale categories |\n| `localization.onscreens` | On-screen localization entries keyed by locale code |\n| `resource` | Container for resource operations (scope, fix, patch, copy, link) |\n\n# Resource Operations\n\nAll resource operations live under the `resource:` key:\n\n## scope\n\nRestricts which resources are visible to specific entities. Maps a resource path to a list of entity paths that can see it.\n\n```yaml\nresource:\n  scope:\n    player.ent:\n      - player_ma.ent\n      - player_wa.ent\n```\n\nSee [Scope Operation](/references/builtin-resources/scope.md) for built-in examples.\n\n## fix\n\nCorrects appearance name and path mappings. Supports `paths` (remap old\u2192new appearance paths), `names` (rename material submesh names), and `context` (set material context values). Uses YAML anchors for reuse.\n\n```yaml\nresource:\n  fix:\n    base\\gameplay\\gui\\main_menu\\female_cco.inkcharcustomization:\n      paths:\n        base\\appearances\\old.app: archive_xl\\appearances\\new.app\n```\n\nSee [Fix Operation](/references/builtin-resources/fix.md) for built-in examples.\n\n## patch\n\nOverrides specific properties of a resource onto target resources. Each entry specifies `props` (list of property names to copy) and `targets` (list of resource paths to patch).\n\n```yaml\nresource:\n  patch:\n    archive_xl\\patch_mesh.mesh:\n      props: [ appearances ]\n      targets: [ player_ma_hair.mesh, player_wa_hair.mesh ]\n```\n\nSee [Patch & Copy Operations](/references/builtin-resources/patch.md) for built-in examples.\n\n## copy\n\nDuplicates a resource to a new path. Maps a source resource path to a list of destination paths.\n\n```yaml\nresource:\n  copy:\n    base\\morphs.morphtarget:\n      - archive_xl\\morphs_copy.morphtarget\n```\n\nSee [Patch & Copy Operations](/references/builtin-resources/patch.md) for built-in examples.\n\n## link\n\nCreates links between resources, allowing one resource path to resolve to another. Used for migration and backward compatibility.\n\n```yaml\nresource:\n  link:\n    archive_xl\\old_path.mesh:\n      - archive_xl\\new_path.mesh\n```\n\nSee [Link Operation (Migration)](/references/builtin-resources/migration.md) for built-in examples.\n\n# Related Templates\n\n- [Factory CSV Template](/templates/factory.md) \u2014 Template for custom entity factory files\n- [Localization Template](/templates/localization.md) \u2014 Template for localization JSON files\n\n# Citations\n\n[1] [mod.archive.xl template](https://github.com/psiberx/cp2077-archive-xl/blob/main/support/templates/mod.archive.xl)"}, {"id": "references/wolvenkit-hints", "type": "Config", "title": "WolvenKit Hints", "description": "WolvenKit hint configuration for ArchiveXL resource types and extensions.", "tags": ["wolvenkit", "hints", "config"], "group": "references", "sz": 29, "body": "# Overview\n\nThe `ArchiveXL.toml` file provides WolvenKit hint configuration for ArchiveXL-specific resource types and file extensions. WolvenKit uses hint files to understand how to handle custom file formats in modding projects.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| ArchiveXL.toml | TOML config | WolvenKit hint file for ArchiveXL resource types |\n\n# Current State\n\nThe `ArchiveXL.toml` file in the source repository is currently **empty** (0 bytes). It serves as a placeholder for future WolvenKit hint configuration. The file exists in the `support/hints/` directory and is distributed with ArchiveXL releases.\n\n# Notes\n\n- WolvenKit hint files are TOML-format configurations that tell WolvenKit how to display, edit, and validate custom file types.\n- The `.xl` extension and ArchiveXL-specific resource operations may be documented here in future versions.\n- Modders typically do not need to modify this file directly.\n\n# Citations\n\n[1] [ArchiveXL.toml](https://github.com/psiberx/cp2077-archive-xl/blob/main/support/hints/ArchiveXL.toml)"}, {"id": "templates/factory", "type": "Template", "title": "Factory CSV Template", "description": "Template for custom entity factory CSV files used to register new items with ArchiveXL.", "tags": ["template", "factory", "csv", "entity", "items"], "group": "templates", "sz": 32, "body": "# Overview\n\nThe factory CSV template provides the structure for custom entity factory files. These files register new entities (items, clothing, weapons) with the game via ArchiveXL. The template is distributed as a WolvenKit JSON export of a CR2W `C2dArray` resource.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| factory.csv.json | JSON/CR2W | WolvenKit JSON export of a C2dArray (CSV) resource |\n\n# Schema\n\nThe factory CSV uses three columns:\n\n| Column | Type | Description |\n|--------|------|-------------|\n| name | String | Factory entry name (e.g. `mymod_item`) |\n| path | String | Entity file path (e.g. `mymod\\items\\clothing\\item.ent`) |\n| preload | String (boolean) | Whether to preload the entity (`true` or `false`) |\n\n# Template Content\n\n```json\n{\n  \"Header\": {\n    \"WKitJsonVersion\": \"0.0.3\",\n    \"GameVersion\": 1600,\n    \"DataType\": \"CR2W\"\n  },\n  \"Data\": {\n    \"Version\": 195,\n    \"BuildVersion\": 0,\n    \"RootChunk\": {\n      \"$type\": \"C2dArray\",\n      \"compiledData\": [\n        [\n          \"mymod_item\",\n          \"mymod\\\\items\\\\clothing\\\\item.ent\",\n          \"true\"\n        ]\n      ],\n      \"compiledHeaders\": [\n        \"name\",\n        \"path\",\n        \"preload\"\n      ],\n      \"cookingPlatform\": \"PLATFORM_PC\"\n    },\n    \"EmbeddedFiles\": []\n  }\n}\n```\n\n# Usage\n\n1. Copy the template and rename to `<your-mod>.csv.json`\n2. Add rows in `compiledData` for each entity you want to register\n3. Reference the factory file in your `mod.archive.xl` under the `factories:` key\n\nSee [ArchiveXL Resource Format](/references/resource-format.md) for how to reference factory files.\n\n# Citations\n\n[1] [factory.csv.json](https://github.com/psiberx/cp2077-archive-xl/blob/main/support/templates/factory.csv.json)"}, {"id": "templates/localization", "type": "Template", "title": "Localization Template", "description": "Template for custom localization JSON files for on-screen text overrides.", "tags": ["template", "localization", "json", "onscreens"], "group": "templates", "sz": 33, "body": "# Overview\n\nThe localization template provides the structure for custom localization JSON files. These files add or override on-screen text entries that can be used in scripts, resources, and TweakDB. The template is distributed as a WolvenKit JSON export of a CR2W `JsonResource`.\n\n# Member Types\n\n| Type | Kind | Description |\n|------|------|-------------|\n| localization.json | JSON/CR2W | WolvenKit JSON export of a localization persistence resource |\n\n# Schema\n\nEach localization entry uses these fields:\n\n| Field | Type | Description |\n|-------|------|-------------|\n| secondaryKey | String | The localization key (e.g. `MyMod-Item-Name`) |\n| femaleVariant | String | The localized text value (used for all variants unless male-specific) |\n\n# Template Content\n\n```json\n{\n  \"Header\": {\n    \"WKitJsonVersion\": \"0.0.3\",\n    \"GameVersion\": 1600,\n    \"DataType\": \"CR2W\"\n  },\n  \"Data\": {\n    \"Version\": 195,\n    \"BuildVersion\": 0,\n    \"RootChunk\": {\n      \"$type\": \"JsonResource\",\n      \"cookingPlatform\": \"PLATFORM_PC\",\n      \"root\": {\n        \"HandleId\": \"0\",\n        \"Data\": {\n          \"$type\": \"localizationPersistenceOnScreenEntries\",\n          \"entries\": [\n            {\n              \"$type\": \"localizationPersistenceOnScreenEntry\",\n              \"secondaryKey\": \"MyMod-Item-Name\",\n              \"femaleVariant\": \"Samurai Mask & Aviators\"\n            }\n          ]\n        }\n      }\n    },\n    \"EmbeddedFiles\": []\n  }\n}\n```\n\n# Usage\n\n1. Copy the template and rename to `<locale>.json` (e.g. `en-us.json`)\n2. Add entries in the `entries` array for each localization key\n3. Reference the file in your `mod.archive.xl` under `localization.onscreens.<locale>`\n\nSee [ArchiveXL Resource Format](/references/resource-format.md) for how to reference localization files.\n\n# Citations\n\n[1] [localization.json](https://github.com/psiberx/cp2077-archive-xl/blob/main/support/templates/localization.json)"}], EDGES=[{"source": "apis/redscript", "target": "references/resource-format"}, {"source": "overview", "target": "apis/redscript"}, {"source": "overview", "target": "apis/red4ext"}, {"source": "overview", "target": "references/resource-format"}, {"source": "references/builtin-resources/fix", "target": "references/resource-format"}, {"source": "references/builtin-resources/fix", "target": "references/builtin-resources/scope"}, {"source": "references/builtin-resources/migration", "target": "references/resource-format"}, {"source": "references/builtin-resources/patch", "target": "references/resource-format"}, {"source": "references/builtin-resources/scope", "target": "references/resource-format"}, {"source": "references/builtin-resources/scope", "target": "apis/redscript"}, {"source": "references/resource-format", "target": "references/builtin-resources/scope"}, {"source": "references/resource-format", "target": "references/builtin-resources/fix"}, {"source": "references/resource-format", "target": "references/builtin-resources/patch"}, {"source": "references/resource-format", "target": "references/builtin-resources/migration"}, {"source": "references/resource-format", "target": "templates/factory"}, {"source": "references/resource-format", "target": "templates/localization"}, {"source": "templates/factory", "target": "references/resource-format"}, {"source": "templates/localization", "target": "references/resource-format"}];
const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'breadthfirst',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?marked.parse(n.body):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}
document.getElementById('search').oninput=applyFilter;
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
document.getElementById('layout').onchange=e=>{cy.layout({name:e.target.value,animate:true,padding:40,
 nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='breadthfirst';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
