pletely Non-Manual Looting-16040-2-13-01-1727125795 | `r6/scripts/Completely Non-Manual Loot/CNML.reds` | Adds `GameObject.ShouldBeQuest` |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Services/DFPlayerStateService.reds` | Wraps `GameObject.ProcessDamageReceived` |\n| Immersive Hit-24225-1-0-1-1759399866 | `r6/scripts/Immsersive Hit/IMH_Modules.reds` | Adds `GameObject.OnIMH_ClearFxEvent` |\n| Limited HUD 2592 2.22.4 2026-07-26T18-22Z LACBAIyo3 | `r6/scripts/LHUD/core/common.reds` | Adds `GameObject.QueueLHUDEvent` |\n| ShaderDrift-16279-0-9-0-1770918250 | `r6/scripts/ShaderDrift/ShaderDrift.reds` | Wraps `GameObject.OnVehicleHit` |\n\n*2 more mods use this pattern.*\n\n## Related Concepts\n\n- [ScriptableService Registration](/systems/scriptable-service-registration.md) \u2014 Using the ScriptableService pattern to create persistent background services that run throughout the game session.\n- [Device Interaction Extensions](/world/device-interaction-extensions.md) \u2014 Extending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior."}, {"id": "systems/hacking-system-extensions", "type": "Mechanic Pattern", "title": "Hacking System Extensions", "description": "Extending quickhack and hacking system classes to modify network breach and quickhack behavior.", "tags": ["systems hacking quickhack network"], "group": "systems", "sz": 33, "body": "# Hacking System Extensions\n\nExtending quickhack and hacking system classes to modify network breach and quickhack behavior.\n\n## Approach\n\nMods reference `Quickhack` (1070 occurrences), `HackingSystem`, `HackingMinigameState`, `NetworkBreach`, and related classes to modify hacking behavior. This includes custom quickhack effects, modified breach protocol minigames, or extended network breach mechanics. The `@addMethod` pattern is commonly used to add new quickhack actions to device components.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/Hacking/Breach.reds` | References quickhack/hacking system |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/AntiTheftMeasures/Hacking/Breach.reds` | References quickhack/hacking system |\n| Auto Leveler-27010-2-31-01-1769096078 | `r6/scripts/Auto Leveler/AutoLevel.reds` | References quickhack/hacking system |\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/scripts/Consumable Animations/Services/CAAnimationService.reds` | References quickhack/hacking system |\n| CustomHackingSystem v1.3.0-5091-1-3-0-1704395205 | `r6/scripts/CustomHackingSystem/CodewareExtensions/UI/Atlas/InkAtlasPaths.reds` | References quickhack/hacking system |\n\n*24 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vehicle Quickhack Interception](/vehicle/vehicle-quickhack-interception.md) \u2014 Wrapping VehicleComponentPS.GetQuickHackActions to intercept and modify vehicle quickhack options.\n- [Access Point Modifications](/world/access-point-modifications.md) \u2014 Extending AccessPointControllerPS to modify access point hacking behavior.\n- [Player Vision Mode](/player/player-vision-mode.md) \u2014 Intercepting PlayerVisionModeController to modify scanning and vision modes."}, {"id": "systems/npc-puppet-extensions", "type": "Mechanic Pattern", "title": "NPC Puppet Extensions", "description": "Adding methods to NPCPuppet via @addMethod to extend NPC behavior and capabilities.", "tags": ["systems npc extensions"], "group": "systems", "sz": 32, "body": "# NPC Puppet Extensions\n\nAdding methods to NPCPuppet via @addMethod to extend NPC behavior and capabilities.\n\n## Approach\n\nMods use `@addMethod(NPCPuppet)` (26 instances) to add new methods to the NPC entity class. This enables custom NPC behavior, extended NPC state tracking, or integration of NPC-specific mod features. NPCPuppet is the base class for all NPC entities, so additions here affect all NPCs.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Deck Of Spell 32170 1.0.0 2026-08-02T05-07Z ujWojTqiR | `r6/scripts/DeckOfSpells/elements_recovery.reds` | Adds `NPCPuppet.RecordDeckElementsDamage` |\n| DynamicEnemyMultiplier_1.1 31555 1.1 2026-07-17T00-18Z k8Iw8mCTa | `r6/scripts/DynamicEnemyMultiplier/CloneCombatBehavior.reds` | Adds `NPCPuppet.SEMSetOriginal` |\n| MEArmorSystem 30548 1.0.4 2026-06-24T22-55Z 6ZNKZci2Q | `r6/scripts/EnemyArmorOverhaul/npcPuppetAdditions.reds` | Adds `NPCPuppet.MEAddAddrenaline` |\n| Much Better Eddies 30532 1.3 2026-07-12T02-46Z LACBAIygB | `r6/scripts/BetterEddies/DeadChannel/DeadChannelDroneAttitude.reds` | Adds `NPCPuppet.MBE_DCAllyAttitudeFix` |\n| Reinforcements Gang Vs Gang-24243-2-0-0-1759309714 | `r6/scripts/reinforcements_gangvgang/SpawnAttiutudeFixer.reds` | Adds `NPCPuppet.GRAttitudeFix` |\n\n*3 more mods use this pattern.*\n\n## Related Concepts\n\n- [Reaction Manager Overrides](/systems/reaction-manager-overrides.md) \u2014 Wrapping ReactionManagerComponent to modify NPC reaction behavior.\n- [Death and Defeat Handling](/player/death-and-defeat-handling.md) \u2014 Wrapping OnDeath and OnDefeated on PlayerPuppet and ScriptedPuppet to intercept death/defeat events."}, {"id": "systems/prevention-system-overrides", "type": "Mechanic Pattern", "title": "Prevention System Overrides", "description": "Wrapping PreventionSystem to modify police response and crime detection behavior.", "tags": ["systems prevention police crime"], "group": "systems", "sz": 32, "body": "# Prevention System Overrides\n\nWrapping PreventionSystem to modify police response and crime detection behavior.\n\n## Approach\n\nMods wrap `PreventionSystem` methods (30 wraps, 14 @addMethod) to modify how the game handles crime detection and police response. This includes changing police spawn behavior, modifying crime level thresholds, or disabling prevention entirely. The prevention system controls the wanted level and police response mechanics.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/CounterMeasure/NotifyNcpd/NotifyNcpd.reds` | References PreventionSystem |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/AntiTheftMeasures/CounterMeasure/NotifyNcpd/NotifyNcpd.reds` | References PreventionSystem |\n| Borderline Psycho 31363 1.4 2026-07-13T16-28Z q7jg7fhSv | `r6/scripts/z_BorderlinePsycho/BorderlinePsycho.reds` | References PreventionSystem |\n| Completely Non-Manual Looting-16040-2-13-01-1727125795 | `r6/scripts/Completely Non-Manual Loot/CNML.reds` | References PreventionSystem |\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/scripts/Consumable Animations/Services/CAAnimationService.reds` | References PreventionSystem |\n\n*24 more mods use this pattern.*\n\n## Related Concepts\n\n- [Combat State Transitions](/player/combat-state-transitions.md) \u2014 Wrapping OnCombatStateChanged to intercept combat state changes and apply custom behavior.\n- [Reaction Manager Overrides](/systems/reaction-manager-overrides.md) \u2014 Wrapping ReactionManagerComponent to modify NPC reaction behavior.\n- [Fact System Manipulation](/systems/fact-system-manipulation.md) \u2014 Using GetFact and SetFact to read and modify game quest facts that control game state."}, {"id": "systems/reaction-manager-overrides", "type": "Mechanic Pattern", "title": "Reaction Manager Overrides", "description": "Wrapping ReactionManagerComponent to modify NPC reaction behavior.", "tags": ["systems npc reactions ai"], "group": "systems", "sz": 32, "body": "# Reaction Manager Overrides\n\nWrapping ReactionManagerComponent to modify NPC reaction behavior.\n\n## Approach\n\nMods wrap `ReactionManagerComponent` (15 wraps) to modify how NPCs react to stimuli. This includes changing aggro behavior, modified detection ranges, or custom reaction triggers. The reaction manager controls NPC awareness and combat engagement decisions.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Audioware-12001-v1-9-2-1775355328 | `r6/scripts/Audioware/Hooks.reds` | Wraps `ReactionManagerComponent.OnIncapacitatedEvent` |\n| Drug Dealer 27800 6.5.6 2026-06-26T12-36Z 5em9eoSzt | `r6/scripts/DrugDealer/Job/SellDrugs/Interaction.reds` | Wraps `ReactionManagerComponent.OnPlayerProximityStartEvent` |\n| DynamicEnemyMultiplier_1.1 31555 1.1 2026-07-17T00-18Z k8Iw8mCTa | `r6/scripts/DynamicEnemyMultiplier/CloneCombatBehavior.reds` | Wraps `ReactionManagerComponent.ShouldIgnoreCombatStim` |\n| Reinforcements Gang Vs Gang-24243-2-0-0-1759309714 | `r6/scripts/reinforcements_gangvgang/ReinforcementsCall.reds` | Wraps `ReactionManagerComponent.HandleStimEvent` |\n| Reinforcements System 21532 1.2 2026-06-16T14-22Z iubCuMHAW | `r6/scripts/ReinforcementsSystem/ReinforcementsCall.reds` | Wraps `ReactionManagerComponent.HandleStimEvent` |\n\n*6 more mods use this pattern.*\n\n## Related Concepts\n\n- [Prevention System Overrides](/systems/prevention-system-overrides.md) \u2014 Wrapping PreventionSystem to modify police response and crime detection behavior.\n- [AI Behavior Modification](/systems/ai-behavior-modification.md) \u2014 Modifying AI behavior classes and AISubAction records to alter NPC AI behavior.\n- [NPC Puppet Extensions](/systems/npc-puppet-extensions.md) \u2014 Adding methods to NPCPuppet via @addMethod to extend NPC behavior and capabilities."}, {"id": "systems/rpg-manager-overrides", "type": "Mechanic Pattern", "title": "RPG Manager Overrides", "description": "Wrapping RPGManager methods to modify RPG progression and reward systems.", "tags": ["systems rpg progression rewards"], "group": "systems", "sz": 31, "body": "# RPG Manager Overrides\n\nWrapping RPGManager methods to modify RPG progression and reward systems.\n\n## Approach\n\nMods wrap `RPGManager` methods (18 wraps) to modify RPG progression mechanics. This includes changed XP rewards, modified level scaling, or custom progression rules. The RPG manager controls experience gain, level-up mechanics, and reward calculation.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Better Leveling V2 (Finalise)-22784-2-3-3-1759851280 | `r6/scripts/Better Leveling (Revamp of Custom Level Cap)/BTL_00_Main.reds` | Wraps `RPGManager.CalculateMinorActivityReward` |\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/scripts/Consumable Animations/Main/CAMainSystem.reds` | Wraps `RPGManager.ConsumeItem` |\n| Craft All-23494-1-0-0-1755273337 | `r6/scripts/Craft All/Craft All.reds` | Wraps `RPGManager.ProcessOnLootedPackages` |\n| Doctrine Hydra V1.0.3 32034 1.0.3 2026-08-03T07-48Z psSjsvrFY | `r6/scripts/DoctrineMultiTargetLauncher/35_module_slot_matching.reds` | Wraps `RPGManager.GetModsSlotIDs` |\n| Kolac Expanded-24491-1-3-1771507690 | `r6/scripts/KolacExpanded/KolacExpanded.reds` | Wraps `RPGManager.GetModsSlotIDs` |\n\n*7 more mods use this pattern.*\n\n## Related Concepts\n\n- [Stats System Modification](/player/stats-modification.md) \u2014 Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime.\n- [Player Development Overrides](/player/player-development-overrides.md) \u2014 Wrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression."}, {"id": "systems/scriptable-service-registration", "type": "Mechanic Pattern", "title": "ScriptableService Registration", "description": "Using the ScriptableService pattern to create persistent background services that run throughout the game session.", "tags": ["systems services architecture"], "group": "systems", "sz": 33, "body": "# ScriptableService Registration\n\nUsing the ScriptableService pattern to create persistent background services that run throughout the game session.\n\n## Approach\n\nMods create classes extending `ScriptableService` and register them with the game scriptable service container. These services persist throughout the game session and can register callbacks, maintain state, and provide APIs to other mod components. The `OnLoad` method is used for initialization, registering callbacks for `Session/Ready` or other lifecycle events. This is the modern architectural pattern for mod systems in REDScript.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/scripts/AldecaldosHighStakes/Main.reds` | Uses ScriptableService pattern |\n| Audioware-12001-v1-9-2-1775355328 | `r6/scripts/Audioware/Codeware.reds` | Uses ScriptableService pattern |\n| Better Leveling V2 (Finalise)-22784-2-3-3-1759851280 | `r6/scripts/Better Leveling (Revamp of Custom Level Cap)/BTL_02_TweakDB.reds` | Uses ScriptableService pattern |\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/scripts/Consumable Animations/Main/CAMainSystem.reds` | Uses ScriptableService pattern |\n| Craft All-23494-1-0-0-1755273337 | `r6/scripts/Craft All/Craft All.reds` | Uses ScriptableService pattern |\n\n*56 more mods use this pattern.*\n\n## Related Concepts\n\n- [Callback System Registration](/systems/callback-system-registration.md) \u2014 Using RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key.\n- [Player Lifecycle Hooks](/player/player-lifecycle-hooks.md) \u2014 Wrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup."}, {"id": "systems/state-machine-overrides", "type": "Mechanic Pattern", "title": "State Machine Overrides", "description": "Wrapping gamestateMachineComponent to modify player state machine behavior.", "tags": ["systems state-machine player"], "group": "systems", "sz": 28, "body": "# State Machine Overrides\n\nWrapping gamestateMachineComponent to modify player state machine behavior.\n\n## Approach\n\nMods use `@replaceMethod(gamestateMachineComponent)` to replace state machine logic for the player. This enables custom state transitions, modified state behavior, or entirely new states. The state machine controls movement, combat, and interaction states.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | Wraps `gamestateMachineComponent.OnStartTakedownEvent` |\n\n## Related Concepts\n\n- [Movement State Events](/player/movement-state-events.md) \u2014 Wrapping SprintEvents, ClimbEvents, LadderEvents, and other movement state classes to modify movement behavior.\n- [Action Input Handling](/player/action-input-handling.md) \u2014 Wrapping PlayerPuppet.OnAction and input-related methods to intercept player input events."}, {"id": "systems/tweakdb-character-records", "type": "Mechanic Pattern", "title": "TweakDB Character Record Modification", "description": "Modifying Character.* TweakDB records to alter NPC and character definitions.", "tags": ["systems tweakdb characters npc"], "group": "systems", "sz": 31, "body": "# TweakDB Character Record Modification\n\nModifying Character.* TweakDB records to alter NPC and character definitions.\n\n## Approach\n\nMods modify `Character.*` TweakDB records to change NPC stats, appearances, equipment, or behavior profiles. This is used for custom NPCs, modified enemy difficulty, or altered character appearances. Changes are static and applied at load time.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Artistic-13066-1-4-5-1774982712 | `r6/tweaks/Artistic/Artistic.yaml` | Modifies Character.* TweakDB records |\n| DropPointsReimagined-29563-1-0-0-1778351569 | `r6/tweaks/DropPointsReimagined/Package/Price/PerWeightUnit.yaml` | Modifies Character.* TweakDB records |\n| Fresh Start-18223-1-5-2-1778280888 | `r6/tweaks/FreshStart/FreshStart.yaml` | Modifies Character.* TweakDB records |\n| Friendly Cerberus-12283-1-0-1705082382 | `r6/tweaks/friendly_cerberus_robot/friendly_cerberus_robot.yaml` | Modifies Character.* TweakDB records |\n| Graven's Attribute Expansion-10250-1-01-1698033259 | `r6/tweaks/HpPerLevel.yaml` | Modifies Character.* TweakDB records |\n\n*29 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions.\n- [Drug Dealer Modifications](/economy/drug-dealer-modifications.md) \u2014 Modifying DrugDealer.* TweakDB records to alter drug dealer vendor behavior."}, {"id": "systems/tweakdb-effectors", "type": "Mechanic Pattern", "title": "TweakDB Effector Modifications", "description": "Modifying Effectors.* TweakDB records to alter game effectors that apply stat modifications.", "tags": ["systems tweakdb effectors stats"], "group": "systems", "sz": 31, "body": "# TweakDB Effector Modifications\n\nModifying Effectors.* TweakDB records to alter game effectors that apply stat modifications.\n\n## Approach\n\nMods modify `Effectors.*` TweakDB records to change how effectors apply stat modifications. Effectors are TweakDB-defined components that modify stats based on conditions \u2014 such as perk bonuses, equipment effects, or status effect modifiers. This is a lower-level stat modification approach compared to direct stat system manipulation.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Jackpot-15925-1-1-1725605473 | `r6/tweaks/Jackpot_Overture/Jackpot_Overture.yaml` | Modifies Effectors.* records |\n| MEArmorSystem 30548 1.0.4 2026-06-24T22-55Z 6ZNKZci2Q | `r6/tweaks/EnemyArmorOverhaul/bosses.yaml` | Modifies Effectors.* records |\n| Melee Overhaul-20792-1-0-1-1744018227 | `MeleeOverhaul/r6/tweaks/MeleeOverhaul/EnemyAI/BaseStats/Effectors.HitReactionTBHIncrease_inline6.value.yaml` | Modifies Effectors.* records |\n| Pyromania Unchained-19517-1-1-3-1740934944 | `r6/tweaks/PyromaniaUnchained/AllExplosions.yaml` | Modifies Effectors.* records |\n| Rebar Club-15874-1-1-1723878737 | `r6/tweaks/Rebar club/Rebar club.yaml` | Modifies Effectors.* records |\n\n*5 more mods use this pattern.*\n\n## Related Concepts\n\n- [Stats System Modification](/player/stats-modification.md) \u2014 Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime.\n- [TweakDB Status Effect Records](/systems/tweakdb-status-effects.md) \u2014 Modifying BaseStatusEffect.* and StatusEffects.* TweakDB records to alter status effects."}, {"id": "systems/tweakdb-item-records", "type": "Mechanic Pattern", "title": "TweakDB Item Record Modification", "description": "Modifying Items.* TweakDB records to add, alter, or remove item definitions.", "tags": ["systems tweakdb items"], "group": "systems", "sz": 32, "body": "# TweakDB Item Record Modification\n\nModifying Items.* TweakDB records to add, alter, or remove item definitions.\n\n## Approach\n\nMods modify `Items.*` TweakDB records via YAML tweak files to add custom items, modify existing item stats, or change item properties. This is the most common TweakDB manipulation pattern (157 mods). Changes are applied at game load time as static data. Items include weapons, clothing, consumables, and cyberware. Many mods combine this with archive file modifications for custom visual assets.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 01. Igla Double Tap - Longer Barrel-29554-1-0-1778467633 | `r6/tweaks/Igla Double Tap/Igla_DoubleTap.yaml` | Modifies Items.* TweakDB records |\n| 03. EX-1 Cybercriminal-28768-1-0-1775734058 | `r6/tweaks/EX1/EX1_Cybercriminal.yaml` | Modifies Items.* TweakDB records |\n| 2BT Skirts Skirts Skirts And A Dress-21070-2-0-1746284646 | `r6/tweaks/2BT/2bt_skirts.yaml` | Modifies Items.* TweakDB records |\n| A Normal Pizza Option-25788-1-0-0-1763760710 | `r6/tweaks/morepizzaoptions/MorePizzaOptions.yaml` | Modifies Items.* TweakDB records |\n| AK-77-14716-1-0-1715688582 | `r6/tweaks/AK_77.yaml` | Modifies Items.* TweakDB records |\n\n*152 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vendor Inventory Modification](/economy/vendor-inventory-modification.md) \u2014 Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices.\n- [Equipment System Manipulation](/player/equipment-system-manipulation.md) \u2014 Wrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior.\n- [Runtime TweakDB Modification](/systems/tweakdb-runtime-modification.md) \u2014 Using CET or REDScript to modify TweakDB records at runtime rather than via static YAML files."}, {"id": "systems/tweakdb-perks", "type": "Mechanic Pattern", "title": "TweakDB Perk Modifications", "description": "Modifying NewPerks.* TweakDB records to add or alter perk definitions.", "tags": ["systems tweakdb perks"], "group": "systems", "sz": 32, "body": "# TweakDB Perk Modifications\n\nModifying NewPerks.* TweakDB records to add or alter perk definitions.\n\n## Approach\n\nMods modify `NewPerks.*` TweakDB records to add custom perks, modify perk effects, or change perk prerequisites. This is the static data approach to perk modification \u2014 changes are loaded at game start and persist throughout the session.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| All Guns Are Cool-10969-1-1-1739533762 | `r6/tweaks/AllGunsAreCool/AllGunsAreCool.yaml` | Modifies NewPerks.* TweakDB records |\n| Better Borrowed Time - KILL 100-26218-0-3-1766572021 | `r6/tweaks/BetterBorrowedTime/BetterBorrowedTime.yaml` | Modifies NewPerks.* TweakDB records |\n| Hardcore Netrunning-17136-1-2-1772992233 | `Hardcore Netrunning/r6/tweaks/HardcoreNetrunning.yaml` | Modifies NewPerks.* TweakDB records |\n| Immersive Throwables-25074-1-0-0-1760684438 | `r6/tweaks/ImmersiveThrowables/NewPerks.Cool_Right_Milestone_2.yaml` | Modifies NewPerks.* TweakDB records |\n| ImmersiveGrenades-25334-3-3-0-1779622581 | `r6/tweaks/ImmersiveGrenades/Overrides/Perk/NewPerks.Tech_Inbetween_Left_3.yaml` | Modifies NewPerks.* TweakDB records |\n\n*10 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Development Overrides](/player/player-development-overrides.md) \u2014 Wrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression.\n- [Monowire Perk Tweaks](/player/monowire-perk-tweaks.md) \u2014 Modifying MonowirePerkTree.* TweakDB records to alter monowire cyberware perks.\n- [Attunement Tweaks](/player/attunement-tweaks.md) \u2014 Modifying Attunements.* TweakDB records to alter cyberware attunement mechanics."}, {"id": "systems/tweakdb-prerequisites", "type": "Mechanic Pattern", "title": "TweakDB Prerequisite Modifications", "description": "Modifying Prereqs.* TweakDB records to alter game prerequisite conditions.", "tags": ["systems tweakdb prerequisites conditions"], "group": "systems", "sz": 31, "body": "# TweakDB Prerequisite Modifications\n\nModifying Prereqs.* TweakDB records to alter game prerequisite conditions.\n\n## Approach\n\nMods modify `Prereqs.*` TweakDB records to change prerequisite conditions for perks, items, or game states. This enables custom unlock conditions, modified requirement checks, or conditional game behavior based on TweakDB-defined prerequisites.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ActualCantoBlackwall 25849 1.0.0.1 2026-07-27T14-38Z VquAqYzfW | `r6/tweaks/ActualCantoBlackwall/ActualCantoBlackwall.yaml` | Modifies Prereqs.* records |\n| All Guns Are Cool-10969-1-1-1739533762 | `r6/tweaks/AllGunsAreCool/AllGunsAreCool.yaml` | Modifies Prereqs.* records |\n| Black Storm-16080-1-1-1723878860 | `r6/tweaks/Black_Storm/Black_Storm.yaml` | Modifies Prereqs.* records |\n| Cyphire Sniper Cyberware-14345-1-0-1713879194 | `r6/tweaks/CyphireEyesCyberware/CyphireSniperEyesCyberwareTEMPLATES.yaml` | Modifies Prereqs.* records |\n| Heat Converter-11820-1-2-1-1754289864 | `r6/tweaks/SeijaxCyberware/HeatConverter.yaml` | Modifies Prereqs.* records |\n\n*15 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Perk Modifications](/systems/tweakdb-perks.md) \u2014 Modifying NewPerks.* TweakDB records to add or alter perk definitions.\n- [TweakDB Effector Modifications](/systems/tweakdb-effectors.md) \u2014 Modifying Effectors.* TweakDB records to alter game effectors that apply stat modifications."}, {"id": "systems/tweakdb-runtime-modification", "type": "Mechanic Pattern", "title": "Runtime TweakDB Modification", "description": "Using CET or REDScript to modify TweakDB records at runtime rather than via static YAML files.", "tags": ["systems tweakdb runtime lua"], "group": "systems", "sz": 33, "body": "# Runtime TweakDB Modification\n\nUsing CET or REDScript to modify TweakDB records at runtime rather than via static YAML files.\n\n## Approach\n\nMods use CET Lua APIs (`TweakDB:GetRecord`, `TweakDB:SetFlat`) or REDScript TweakDB interfaces to modify TweakDB records at runtime. This enables dynamic modifications based on game state, conditional item stats, or TweakDB changes that depend on player choices. Unlike static YAML tweaks, runtime modifications can change during gameplay.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ActualCantoBlackwall 25849 1.0.0.1 2026-07-27T14-38Z VquAqYzfW | `bin/x64/plugins/cyber_engine_tweaks/mods/ActualCantoBlackwall/init.lua` | Uses TweakDB at runtime |\n| Always Free Camera V1.5 31472 2 2026-07-16T09-54Z SlR4l6sf5 | `bin/x64/plugins/cyber_engine_tweaks/mods/AlwaysFreeCamera/init.lua` | Uses TweakDB at runtime |\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `bin/x64/plugins/cyber_engine_tweaks/mods/CustomHackingSystem/init.lua` | Uses TweakDB at runtime |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `bin/x64/plugins/cyber_engine_tweaks/mods/CustomHackingSystem/init.lua` | Uses TweakDB at runtime |\n| Better Leveling V2 (Finalise)-22784-2-3-3-1759851280 | `bin/x64/plugins/cyber_engine_tweaks/mods/BetterLeveling/init.lua` | Uses TweakDB at runtime |\n\n*49 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions.\n- [TweakDB Status Effect Records](/systems/tweakdb-status-effects.md) \u2014 Modifying BaseStatusEffect.* and StatusEffects.* TweakDB records to alter status effects.\n- [Vendor Inventory Modification](/economy/vendor-inventory-modification.md) \u2014 Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices."}, {"id": "systems/tweakdb-status-effects", "type": "Mechanic Pattern", "title": "TweakDB Status Effect Records", "description": "Modifying BaseStatusEffect.* and StatusEffects.* TweakDB records to alter status effects.", "tags": ["systems tweakdb status-effects"], "group": "systems", "sz": 33, "body": "# TweakDB Status Effect Records\n\nModifying BaseStatusEffect.* and StatusEffects.* TweakDB records to alter status effects.\n\n## Approach\n\nMods modify `BaseStatusEffect.*` and `StatusEffects.*` TweakDB records to add or alter status effects. This includes custom buff/debuff effects, modified duration, altered stat modifiers applied by effects, or new status effect types. Some mods use custom prefixes like `DarkFutureStatusEffect.*` for framework-specific effects.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 03. EX-1 Cybercriminal-28768-1-0-1775734058 | `r6/tweaks/EX1/EX1_Cybercriminal.yaml` | Modifies status effect TweakDB records |\n| ActualCantoBlackwall 25849 1.0.0.1 2026-07-27T14-38Z VquAqYzfW | `r6/tweaks/ActualCantoBlackwall/ActualCantoBlackwall.yaml` | Modifies status effect TweakDB records |\n| BFC900_Blackwall-11506-1-0-1702144119 | `r6/tweaks/BFC9000_Blackwall.yaml` | Modifies status effect TweakDB records |\n| Better Living Buffs-23297-1-3-1755182944 | `r6/tweaks/BetterLiving/BaseStatusEffect.Blackmarket_CarryCapacityBooster_inline1.yaml` | Modifies status effect TweakDB records |\n| Cyphire Sniper Cyberware-14345-1-0-1713879194 | `r6/tweaks/CyphireEyesCyberware/CyphireSniperEyesCyberwareTEMPLATES.yaml` | Modifies status effect TweakDB records |\n\n*35 more mods use this pattern.*\n\n## Related Concepts\n\n- [Status Effect Interception](/player/status-effect-interception.md) \u2014 Wrapping OnStatusEffectApplied/OnStatusEffectRemoved on PlayerPuppet and NPCPuppet to intercept status effect events.\n- [TweakDB Effector Modifications](/systems/tweakdb-effectors.md) \u2014 Modifying Effectors.* TweakDB records to alter game effectors that apply stat modifications.\n- [Healing System Tweaks](/player/healing-system-tweaks.md) \u2014 Modifying ImmersiveHealing.* TweakDB records to alter healing item behavior."}, {"id": "systems/tweakdb-vehicle-records", "type": "Mechanic Pattern", "title": "TweakDB Vehicle Record Modification", "description": "Modifying Vehicle.* TweakDB records to alter vehicle definitions and properties.", "tags": ["systems tweakdb vehicles"], "group": "systems", "sz": 31, "body": "# TweakDB Vehicle Record Modification\n\nModifying Vehicle.* TweakDB records to alter vehicle definitions and properties.\n\n## Approach\n\nMods modify `Vehicle.*` TweakDB records to change vehicle stats, add custom vehicles, or alter vehicle behavior parameters. This includes speed, handling, durability, or visual properties defined as TweakDB data.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/tweaks/AldecaldosHighStakes/tweaks.yaml` | Modifies Vehicle.* TweakDB records |\n| Devel Sixteen ver. B-19407-1-2-1754530569 | `r6/tweaks/_devel_sixteen/devel_sixteen.yaml` | Modifies Vehicle.* TweakDB records |\n| Disable Mounted Car Guns-10850-1-0-1699521648 | `r6/tweaks/UnmountedGuns/vehicles.yaml` | Modifies Vehicle.* TweakDB records |\n| Disable Visual Car Damage-10646-1-3-1735260528 | `r6/tweaks/DisableVisualDmg.yaml` | Modifies Vehicle.* TweakDB records |\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `r6/tweaks/DriveAerialVehicle/dav_default_model.yaml` | Modifies Vehicle.* TweakDB records |\n\n*18 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vehicle Object Manipulation](/vehicle/vehicle-object-manipulation.md) \u2014 Wrapping VehicleObject to modify vehicle entity properties and behavior.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "systems/unmatched-mods", "type": "Mechanic Pattern", "title": "Unmatched Mods (Gap)", "description": "Mods that do not match any identified mechanic manipulation pattern and lack code or identifiable data modifications.", "tags": ["systems gap unmatched"], "group": "systems", "sz": 28, "body": "# Unmatched Mods (Gap)\n\nMods that do not match any identified mechanic manipulation pattern and lack code or identifiable data modifications.\n\n## Approach\n\nThese mods could not be categorized into any specific game mechanic manipulation pattern. They may be configuration mods, fix patches, or mods that use patterns not yet identified. Further analysis may reveal additional patterns.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Auto Fixer Enhanced-14746-1-0-1715821041 | `` | Uncategorized (no-code) |\n| CC Fix - Remake-30257-1-0-1780600244 | `` | Uncategorized (no-code) |\n| CYB3RP0NK2077BASIC-CET.rar 30584 1 2026-06-19T13-55Z Co8doeQKc | `` | Uncategorized (no-code) |\n| Californication-7833-3-1-2-1774982483 | `` | Uncategorized (no-code) |\n| Core-22859-1-01-1753141539 | `` | Uncategorized (no-code) |\n\n*60 more mods use this pattern.*"}, {"id": "ui/browser-and-web-overrides", "type": "Mechanic Pattern", "title": "Browser and Web Page Overrides", "description": "Wrapping BrowserGameController and WebPage to modify in-game browser behavior.", "tags": ["ui browser web internet"], "group": "ui", "sz": 31, "body": "# Browser and Web Page Overrides\n\nWrapping BrowserGameController and WebPage to modify in-game browser behavior.\n\n## Approach\n\nMods wrap `BrowserGameController` (26 @addMethod) and `WebPage` (15 @addMethod) to modify the in-game internet browser. This includes custom web pages, modified browser behavior, or integration of custom content into the in-game internet.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 1st Night City Bank 29412 1.6 2026-06-29T12-18Z PYMIYqXtV | `r6/scripts/1stncbank/UI/Site.reds` | Wraps `BrowserGameController.OnInitialize` |\n| BrowserExtensionFramework-10038-0-9-7-1758341320 | `r6/scripts/BrowserExtension/browserController.overrides.reds` | Adds `BrowserGameController.LoadPageByAddress` |\n| Eviction Notice-23187-1-0-3-for-2-3-1755569719 | `r6/scripts/Eviction Notice/Utils/ENResourceUtils.reds` | Adds `WebPage.ENGetDepositAmountForPage` |\n| Much Better Eddies 30532 1.3 2026-07-12T02-46Z LACBAIygB | `r6/scripts/BetterEddies/DeadChannel/DeadChannelSite.reds` | Wraps `BrowserGameController.OnInitialize` |\n| NSGNowPlaying 27764 2.6.0 2026-06-28T15-38Z xNHtNXe1G | `r6/scripts/NSGNowPlaying/SetupNewSite.reds` | Wraps `BrowserGameController.OnInitialize` |\n\n## Related Concepts\n\n- [Ink Widget Extensions](/ui/ink-widget-extensions.md) \u2014 Using @addMethod on inkGameController and inkWidget to extend UI widget functionality.\n- [Device Interaction Extensions](/world/device-interaction-extensions.md) \u2014 Extending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior."}, {"id": "ui/character-creation-ui", "type": "Mechanic Pattern", "title": "Character Creation UI", "description": "Wrapping CharacterCreationStatsMenu to modify character creation interface.", "tags": ["ui character-creation appearance"], "group": "ui", "sz": 30, "body": "# Character Creation UI\n\nWrapping CharacterCreationStatsMenu to modify character creation interface.\n\n## Approach\n\nMods wrap `CharacterCreationStatsMenu` (9 wraps) to modify the character creation interface. This includes custom appearance options, modified stat allocation, or additional character creation features.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Better Leveling V2 (Finalise)-22784-2-3-3-1759851280 | `r6/scripts/Better Leveling (Revamp of Custom Level Cap)/BTL_00_Main.reds` | Wraps `CharacterCreationStatsMenu.ResetAllBtnBackToBaseline` |\n| Graven's Customizable Character Creation-10348-1-0-1698021055 | `r6/scripts/Graven's Customizable Character Creation/gravenCharacterCreationBase.reds` | Wraps `CharacterCreationStatsMenu.OnInitialize` |\n| NewGamePlus_1.3.1-15043-1-3-1-1775167014 | `red4ext/plugins/NewGamePlus/redscript/NGPlusCharacterInitialStats.reds` | Wraps `CharacterCreationStatsMenu.OnInitialize` |\n\n## Related Concepts\n\n- [Player Development Overrides](/player/player-development-overrides.md) \u2014 Wrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression.\n- [Stats System Modification](/player/stats-modification.md) \u2014 Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime."}, {"id": "ui/dialog-system-overrides", "type": "Mechanic Pattern", "title": "Dialog System Overrides", "description": "Overriding InteractionUIBase and dialog controllers to modify dialog interaction behavior.", "tags": ["ui dialog interaction"], "group": "ui", "sz": 33, "body": "# Dialog System Overrides\n\nOverriding InteractionUIBase and dialog controllers to modify dialog interaction behavior.\n\n## Approach\n\nMods use CET `Override` on `InteractionUIBase.OnDialogsData`, `OnDialogsSelectIndex`, and `dialogWidgetGameController.OnDialogsActivateHub` (6 instances each) to modify dialog behavior. This enables custom dialog options, modified hub menu interactions, or extended dialog system features.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/Modules/hud.lua` | CET Override `dialogWidgetGameController.OnDialogsActivateHub` |\n| FieldItems V-2-0-2.zip-12367-2-0-2-1775478370 | `bin/x64/plugins/cyber_engine_tweaks/mods/fielditems/external/InteractionUI.lua` | CET Override `dialogWidgetGameController.OnDialogsActivateHub` |\n| Gambling System - Roulette 15450 1.1.3 2026-06-13T22-43Z 5em9eoS1b | `bin/x64/plugins/cyber_engine_tweaks/mods/Gambling System - Roulette/External/interactionUI.lua` | CET Override `dialogWidgetGameController.OnDialogsActivateHub` |\n| Panam's Voicemail-23407-2-2-1755674552 | `bin/x64/plugins/cyber_engine_tweaks/mods/panam_wanted_mod/modules/interactionUI.lua` | CET Override `dialogWidgetGameController.OnDialogsActivateHub` |\n| SkillTrainers V-1-0-7.zip-12689-1-0-7-1771082449 | `bin/x64/plugins/cyber_engine_tweaks/mods/skilltrainers/external/InteractionUI.lua` | CET Override `dialogWidgetGameController.OnDialogsActivateHub` |\n\n*1 more mods use this pattern.*\n\n## Related Concepts\n\n- [Device Interaction Extensions](/world/device-interaction-extensions.md) \u2014 Extending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior.\n- [In-Game Menu Overrides](/ui/ingame-menu-overrides.md) \u2014 Wrapping gameuiInGameMenuGameController to modify in-game menu behavior."}, {"id": "ui/health-bar-customization", "type": "Mechanic Pattern", "title": "Health Bar Customization", "description": "Wrapping health and stamina bar widget controllers to modify health/stamina display.", "tags": ["ui health-bar stamina hud"], "group": "ui", "sz": 31, "body": "# Health Bar Customization\n\nWrapping health and stamina bar widget controllers to modify health/stamina display.\n\n## Approach\n\nMods wrap `healthbarWidgetGameController` (16 wraps, 15 @addMethod) and `StaminabarWidgetGameController` (10 wraps) to modify health and stamina bar display. This includes custom health bar visuals, modified stamina display, or conditional bar visibility.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/shieldPointsUI.reds` | Wraps `healthbarWidgetGameController.UpdateCurrentHealthText` |\n| Eye-Tracked HUD 30603 1.0.0 2026-06-20T15-56Z AgoGgivIA | `r6/scripts/Eye-Tracked HUD/EyeTrackedHUDController.reds` | Wraps `StaminabarWidgetGameController.EvaluateStaminaBarVisibility` |\n| HUD Painter-14935-1-3-0-1768645929 | `r6/scripts/HUDPainter/HudPainterPreviewControllerStubs.reds` | Wraps `healthbarWidgetGameController.OnInitialize` |\n| HUDitor-3315-1-1-0-1770366067 | `r6/scripts/HUDitor/preview.reds` | References health/stamina bar widgets |\n| HealthPercentCombat-24328-1-3-1760635378 | `r6/scripts/HealthPercentCombat/HealthPercentCombat-ArmorUpPatch.reds` | Wraps `healthbarWidgetGameController.UpdateCurrentHealthText` |\n\n*8 more mods use this pattern.*\n\n## Related Concepts\n\n- [HUD Manager Overrides](/ui/hud-manager-overrides.md) \u2014 Wrapping HUDManager to modify HUD element visibility, style, and compatibility.\n- [Stats System Modification](/player/stats-modification.md) \u2014 Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime."}, {"id": "ui/hud-manager-overrides", "type": "Mechanic Pattern", "title": "HUD Manager Overrides", "description": "Wrapping HUDManager to modify HUD element visibility, style, and compatibility.", "tags": ["ui hud hud-manager"], "group": "ui", "sz": 33, "body": "# HUD Manager Overrides\n\nWrapping HUDManager to modify HUD element visibility, style, and compatibility.\n\n## Approach\n\nMods wrap `HUDManager` methods (45 wraps, 35 @addMethod) to modify HUD behavior. Key methods include `ApplyFilterCompatibility` (11 wraps), `ApplyStyleCompatibility` (10 wraps), and `ApplyMappinCompatibility` (9 wraps). These methods are called when HUD elements need to check compatibility with active mods. The `@addMethod(HUDManager)` pattern is used to add custom HUD management logic.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/CompassBar.reds` | Adds `HUDManager.OnFactChanged` |\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameHUD.lua` | CET Override `WarningMessageGameController.UpdateWidgets` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameUI.lua` | CET Observe `gameuiGameSystemUI.PushGameContext` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `r6/scripts/Enhanced Vehicle System/Enhanced Vehicle System.reds` | References HUDManager |\n| FieldItems V-2-0-2.zip-12367-2-0-2-1775478370 | `bin/x64/plugins/cyber_engine_tweaks/mods/fielditems/external/GameUI.lua` | CET Observe `gameuiGameSystemUI.PushGameContext` |\n\n*26 more mods use this pattern.*\n\n## Related Concepts\n\n- [Ink Widget Extensions](/ui/ink-widget-extensions.md) \u2014 Using @addMethod on inkGameController and inkWidget to extend UI widget functionality.\n- [HUD Overlay Customization](/media/hud-overlay-customization.md) \u2014 Wrapping HUD overlay controllers like CompassController and hudCarController to customize HUD elements.\n- [Damage Number Display](/combat/damage-display.md) \u2014 Customizing how damage numbers are rendered in the HUD via DamageDigitsGameController."}, {"id": "ui/ingame-menu-overrides", "type": "Mechanic Pattern", "title": "In-Game Menu Overrides", "description": "Wrapping gameuiInGameMenuGameController to modify in-game menu behavior.", "tags": ["ui menu ingame"], "group": "ui", "sz": 31, "body": "# In-Game Menu Overrides\n\nWrapping gameuiInGameMenuGameController to modify in-game menu behavior.\n\n## Approach\n\nMods wrap `gameuiInGameMenuGameController` (11 wraps, 7 @addMethod) to modify in-game menu behavior. This includes custom menu options, modified radial menu behavior, or additional menu entries.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Audioware-12001-v1-9-2-1775355328 | `r6/scripts/Audioware/Hooks.reds` | Wraps `gameuiInGameMenuGameController.OnDeathScreenDelayEvent` |\n| AutoWalkToggle 31218 2 2026-07-06T19-28Z VquAqYzZD | `r6/scripts/AutoRunToggle/AutoRunToggle.reds` | Wraps `gameuiInGameMenuGameController.OnInitialize` |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFStashCraftingSystem.reds` | Wraps `gameuiInGameMenuGameController.OnInitialize` |\n| Equipment-EX-6945-1-2-9-1773737132 | `r6/scripts/EquipmentEx/EquipmentEx.Global.reds` | Wraps `gameuiInGameMenuGameController.OnInitialize` |\n| Fact Finder-12735-2-12-00-1709251155 | `r6/scripts/FactFinder/FactFinder.reds` | Wraps `gameuiInGameMenuGameController.OnInitialize` |\n\n*2 more mods use this pattern.*\n\n## Related Concepts\n\n- [Menu Controller Overrides](/ui/menu-controller-overrides.md) \u2014 Wrapping menu game controllers to modify settings, pause menu, and main menu behavior.\n- [Ink Widget Extensions](/ui/ink-widget-extensions.md) \u2014 Using @addMethod on inkGameController and inkWidget to extend UI widget functionality."}, {"id": "ui/ink-widget-extensions", "type": "Mechanic Pattern", "title": "Ink Widget Extensions", "description": "Using @addMethod on inkGameController and inkWidget to extend UI widget functionality.", "tags": ["ui ink widgets extensions"], "group": "ui", "sz": 32, "body": "# Ink Widget Extensions\n\nUsing @addMethod on inkGameController and inkWidget to extend UI widget functionality.\n\n## Approach\n\nMods use `@addMethod(inkGameController)` (39 instances) and `@addMethod(inkWidget)` (21 instances) to add new methods to base UI classes. This enables custom widget behavior, extended game controller functionality, or UI utility methods available across all UI controllers. Since these are base classes, additions affect all UI elements that inherit from them.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/CustomHackingSystem/CodewareExtensions/UI/Utility/InkAnimUtility.reds` | Adds `inkWidget.EaseInOpacity` |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/CustomHackingSystem/CodewareExtensions/UI/Utility/InkAnimUtility.reds` | Adds `inkWidget.EaseInOpacity` |\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/shieldPointsUI.reds` | Adds methods to ink widget classes |\n| BrowserExtensionFramework-10038-0-9-7-1758341320 | `r6/scripts/BrowserExtension/browserController.overrides.reds` | Adds methods to ink widget classes |\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/CompassBar.reds` | Adds methods to ink widget classes |\n\n*62 more mods use this pattern.*\n\n## Related Concepts\n\n- [HUD Manager Overrides](/ui/hud-manager-overrides.md) \u2014 Wrapping HUDManager to modify HUD element visibility, style, and compatibility.\n- [Inventory UI Overrides](/ui/inventory-ui-overrides.md) \u2014 Wrapping inventory-related game controllers to modify inventory and backpack display."}, {"id": "ui/inventory-ui-overrides", "type": "Mechanic Pattern", "title": "Inventory UI Overrides", "description": "Wrapping inventory-related game controllers to modify inventory and backpack display.", "tags": ["ui inventory backpack"], "group": "ui", "sz": 32, "body": "# Inventory UI Overrides\n\nWrapping inventory-related game controllers to modify inventory and backpack display.\n\n## Approach\n\nMods wrap `BackpackMainGameController` (21 wraps, 26 @addMethod), `gameuiInventoryGameController` (16 wraps, 24 @addMethod), `InventoryItemDisplayController` (18 wraps, 18 @addMethod), and `InventoryDataManagerV2` (12 wraps, 16 @addMethod) to modify inventory UI behavior. This includes custom item display, modified sorting, additional inventory columns, or custom item actions.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Cutscene Weapon Swapper-20743-1-4-1-1745154157 | `r6/scripts/CutsceneWeaponSwapper.reds` | References inventory UI controllers |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFStashCraftingSystem.reds` | Wraps `gameuiInventoryGameController.OnSetUserData` |\n| Doctrine Hydra V1.0.3 32034 1.0.3 2026-08-03T07-48Z psSjsvrFY | `r6/scripts/DoctrineMultiTargetLauncher/30_modules_ui_migration.reds` | Wraps `InventoryDataManagerV2.GetAttachmentSlotsForInventory` |\n| Enhanced Craft-4378-4-0-9-1779642516 | `r6/scripts/EnhancedCraft/naming/EnhancedCraft-System.reds` | References inventory UI controllers |\n| Equipment-EX-6945-1-2-9-1773737132 | `r6/scripts/EquipmentEx/EquipmentEx.Global.reds` | Wraps `BackpackMainGameController.OnInitialize` |\n\n*18 more mods use this pattern.*\n\n## Related Concepts\n\n- [Equipment System Manipulation](/player/equipment-system-manipulation.md) \u2014 Wrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior.\n- [Tooltip and Item Display](/ui/tooltip-and-item-display.md) \u2014 Wrapping item tooltip and helper classes to modify item information display."}, {"id": "ui/lua-imgui-overlays", "type": "Mechanic Pattern", "title": "CET ImGui Overlays", "description": "Using CET ImGui API to create custom UI overlays and mod configuration windows.", "tags": ["ui imgui lua cet overlays"], "group": "ui", "sz": 32, "body": "# CET ImGui Overlays\n\nUsing CET ImGui API to create custom UI overlays and mod configuration windows.\n\n## Approach\n\nMods use the Cyber Engine Tweaks (CET) ImGui API to draw custom UI overlays, configuration windows, and debug displays. This is a Lua-only pattern that creates immediate-mode GUI elements rendered on top of the game. Common uses include mod settings panels, debug overlays, and custom HUD elements that don't integrate with the native ink widget system.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ActualCantoBlackwall 25849 1.0.0.1 2026-07-27T14-38Z VquAqYzfW | `bin/x64/plugins/cyber_engine_tweaks/mods/ActualCantoBlackwall/init.lua` | Uses CET ImGui for UI |\n| CompassBar-22655-2-0-1770283479 | `bin/x64/plugins/cyber_engine_tweaks/mods/CompassBar/init.lua` | Uses CET ImGui for UI |\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/init.lua` | Uses CET ImGui for UI |\n| DriveVibration-28682-0-0-1-1775470587 | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveVibration/init.lua` | Uses CET ImGui for UI |\n| Easy Teleport-26570-1-0-4-1767111735 | `bin/x64/plugins/cyber_engine_tweaks/mods/easy_teleport/ui.lua` | Uses CET ImGui for UI |\n\n*24 more mods use this pattern.*\n\n## Related Concepts\n\n- [Ink Widget Extensions](/ui/ink-widget-extensions.md) \u2014 Using @addMethod on inkGameController and inkWidget to extend UI widget functionality.\n- [Runtime TweakDB Modification](/systems/tweakdb-runtime-modification.md) \u2014 Using CET or REDScript to modify TweakDB records at runtime rather than via static YAML files."}, {"id": "ui/menu-controller-overrides", "type": "Mechanic Pattern", "title": "Menu Controller Overrides", "description": "Wrapping menu game controllers to modify settings, pause menu, and main menu behavior.", "tags": ["ui menus settings pause-menu"], "group": "ui", "sz": 32, "body": "# Menu Controller Overrides\n\nWrapping menu game controllers to modify settings, pause menu, and main menu behavior.\n\n## Approach\n\nMods wrap `SettingsMainGameController` (24 wraps), `PauseMenuGameController` (12 wraps), `SingleplayerMenuGameController` (11 wraps), and `MenuScenario_HubMenu` to modify menu behavior. This includes custom settings options, modified pause menu functionality, or additional menu entries. The `@addMethod(SettingsMainGameController)` pattern (28 instances) is used to add mod settings integration via the Mod Settings framework.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| (DriveCE) Mod Settings-10032-2-0-0-1697876886 | `r6/scripts/DriveCarefullyExpanded/DriveCarefullyExpanded.reds` | Wraps `SettingsMainGameController.IsResetButtonEnabled` |\n| Audioware-12001-v1-9-2-1775355328 | `r6/scripts/Audioware/PreGame.reds` | References menu controllers |\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/CompassBar.reds` | Wraps `SettingsMainGameController.OnUninitialize` |\n| Custom Map Markers 3819 2.6.3 2026-08-01T19-36Z mPgaPVet3 | `r6/scripts/CustomMapMarkers/additions/MenuScenario_HubMenu.reds` | References menu controllers |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFStashCraftingSystem.reds` | References menu controllers |\n\n*38 more mods use this pattern.*\n\n## Related Concepts\n\n- [Ink Widget Extensions](/ui/ink-widget-extensions.md) \u2014 Using @addMethod on inkGameController and inkWidget to extend UI widget functionality.\n- [ScriptableService Registration](/systems/scriptable-service-registration.md) \u2014 Using the ScriptableService pattern to create persistent background services that run throughout the game session."}, {"id": "ui/minimap-and-worldmap", "type": "Mechanic Pattern", "title": "Minimap and World Map Customization", "description": "Wrapping minimap and world map controllers to modify map display and interaction.", "tags": ["ui minimap worldmap map"], "group": "ui", "sz": 32, "body": "# Minimap and World Map Customization\n\nWrapping minimap and world map controllers to modify map display and interaction.\n\n## Approach\n\nMods wrap `MinimapContainerController` (18 wraps), `WorldMapMenuGameController` (28 wraps, 40 @addMethod), and `WorldMapTooltipControll
