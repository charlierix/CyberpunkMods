const NODES=[{"id": "combat/armor-system-tweaks", "type": "Mechanic Pattern", "title": "Armor System Tweaks", "description": "Modifying ArmorUp.* TweakDB records to alter armor calculation and damage reduction.", "tags": ["combat armor tweakdb"], "group": "combat", "sz": 28, "body": "# Armor System Tweaks\n\nModifying ArmorUp.* TweakDB records to alter armor calculation and damage reduction.\n\n## Approach\n\nMods modify `ArmorUp.*` TweakDB records to change how armor mitigates damage. This allows custom armor rating curves, damage type resistances, or conditional armor effectiveness.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/tweaks/ArmorUp/z_vendors.yaml` | Modifies ArmorUp.* records |\n\n## Related Concepts\n\n- [Damage System Overrides](/combat/damage-system-overrides.md) \u2014 Replacing or extending DamageSystem methods to alter how damage is calculated and applied.\n- [Stats System Modification](/player/stats-modification.md) \u2014 Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime."}, {"id": "combat/attack-data-modification", "type": "Mechanic Pattern", "title": "Attack Data Modification", "description": "Manipulating AttackData structures to change attack properties like damage type, range, or impact.", "tags": ["combat attack-data damage"], "group": "combat", "sz": 31, "body": "# Attack Data Modification\n\nManipulating AttackData structures to change attack properties like damage type, range, or impact.\n\n## Approach\n\nMods reference `AttackData` structures within hit events or damage calculations to modify attack properties. This includes changing damage types, adding elemental effects, modifying attack ranges, or altering impact force values.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/armorTweaks.reds` | References AttackData |\n| Deadly Roads-7745-v2-31b-1701881641 | `r6/scripts/Deadly Roads/core/DeadlyRoads.reds` | References AttackData |\n| ExplosionShake V2.11 31285 2.11 2026-07-13T15-41Z 8ViLVPoT0 | `r6/scripts/ExplosionShake.reds` | References AttackData |\n| MEArmorSystem 30548 1.0.4 2026-06-24T22-55Z 6ZNKZci2Q | `r6/scripts/EnemyArmorOverhaul/damageArmor.reds` | References AttackData |\n| Melee Attacks Fixes And Enhancements-16921-0-41-1761400779 | `r6/scripts/MeleeAttacksFixesAndImprovements.reds` | References AttackData |\n\n*14 more mods use this pattern.*\n\n## Related Concepts\n\n- [Hit Event Interception](/combat/hit-event-interception.md) \u2014 Wrapping hit processing methods to intercept and modify damage before it resolves.\n- [TweakDB Attack Record Modification](/combat/tweakdb-attack-records.md) \u2014 Modifying Attacks.* TweakDB records to alter static attack damage values and properties."}, {"id": "combat/damage-display", "type": "Mechanic Pattern", "title": "Damage Number Display", "description": "Customizing how damage numbers are rendered in the HUD via DamageDigitsGameController.", "tags": ["combat ui damage-display"], "group": "combat", "sz": 28, "body": "# Damage Number Display\n\nCustomizing how damage numbers are rendered in the HUD via DamageDigitsGameController.\n\n## Approach\n\nMods extend `DamageDigitsGameController` via `@addMethod` to customize floating damage number rendering. This includes custom fonts, colors, positioning, or adding additional information to damage popups.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| BullseyesKnives 1.0.0 Beta 31418 1 2026-07-11T03-48Z 8ViLVPonV | `r6/scripts/BullseyeRicochet/BullseyeRicochet.reds` | Adds `DamageDigitsGameController.BullseyeCreateSegment` |\n\n## Related Concepts\n\n- [HUD Manager Overrides](/ui/hud-manager-overrides.md) \u2014 Wrapping HUDManager to modify HUD element visibility, style, and compatibility.\n- [Damage System Overrides](/combat/damage-system-overrides.md) \u2014 Replacing or extending DamageSystem methods to alter how damage is calculated and applied."}, {"id": "combat/damage-system-overrides", "type": "Mechanic Pattern", "title": "Damage System Overrides", "description": "Replacing or extending DamageSystem methods to alter how damage is calculated and applied.", "tags": ["combat damage damage-system"], "group": "combat", "sz": 31, "body": "# Damage System Overrides\n\nReplacing or extending DamageSystem methods to alter how damage is calculated and applied.\n\n## Approach\n\nMods use `@wrapMethod(DamageSystem)` to override damage calculation pipelines. This allows modifying damage types, applying custom damage reduction (e.g., armor calculations), or redirecting damage application. Unlike hit event interception, this operates at the system level rather than per-hit.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/armorTweaks.reds` | Wraps `DamageSystem.ProcessArmor` |\n| Deadly Roads-7745-v2-31b-1701881641 | `r6/scripts/Deadly Roads/core/DeadlyRoads.reds` | References DamageSystem |\n| Deck Of Spell 32170 1.0.0 2026-08-02T05-07Z ujWojTqiR | `r6/scripts/DeckOfSpells/elements_recovery.reds` | Wraps `DamageSystem.ProcessPipeline` |\n| ExplosionShake V2.11 31285 2.11 2026-07-13T15-41Z 8ViLVPoT0 | `r6/scripts/ExplosionShake.reds` | Wraps `DamageSystem.ProcessLocalizedDamage` |\n| ImmersiveShootingAI 22782 1.1 2026-06-16T09-25Z Z0ER0BulY | `r6/scripts/ImmersiveShootingAI/accuracy.reds` | Wraps `DamageSystem.ProcessOneShotProtection` |\n\n*12 more mods use this pattern.*\n\n## Related Concepts\n\n- [Hit Event Interception](/combat/hit-event-interception.md) \u2014 Wrapping hit processing methods to intercept and modify damage before it resolves.\n- [Stats System Modification](/player/stats-modification.md) \u2014 Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime."}, {"id": "combat/grenade-system-tweaks", "type": "Mechanic Pattern", "title": "Grenade System Tweaks", "description": "Modifying ImmersiveGrenades.* TweakDB records to alter grenade mechanics.", "tags": ["combat grenades tweakdb"], "group": "combat", "sz": 28, "body": "# Grenade System Tweaks\n\nModifying ImmersiveGrenades.* TweakDB records to alter grenade mechanics.\n\n## Approach\n\nMods modify `ImmersiveGrenades.*` TweakDB records to change grenade fuse times, blast radii, damage values, or throwing mechanics.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ImmersiveGrenades-25334-3-3-0-1779622581 | `r6/tweaks/ImmersiveGrenades/Custom/Cooldown.yaml` | Modifies ImmersiveGrenades.* records |\n\n## Related Concepts\n\n- [TweakDB Attack Record Modification](/combat/tweakdb-attack-records.md) \u2014 Modifying Attacks.* TweakDB records to alter static attack damage values and properties.\n- [TweakDB Effector Modifications](/systems/tweakdb-effectors.md) \u2014 Modifying Effectors.* TweakDB records to alter game effectors that apply stat modifications."}, {"id": "combat/hit-event-interception", "type": "Mechanic Pattern", "title": "Hit Event Interception", "description": "Wrapping hit processing methods to intercept and modify damage before it resolves.", "tags": ["combat damage hit-events"], "group": "combat", "sz": 32, "body": "# Hit Event Interception\n\nWrapping hit processing methods to intercept and modify damage before it resolves.\n\n## Approach\n\nMods wrap `HitEvent` processing or `ReactToHitProcess` on combat targets to intercept damage events before they are applied. At this interception point, a mod can read attack data, modify damage values, apply conditional multipliers (e.g., stealth bonuses), or cancel the hit entirely. The wrapped method calls `wrappedMethod()` to preserve original behavior, then applies modifications to the event data.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 1st Night City Bank 29412 1.6 2026-06-29T12-18Z PYMIYqXtV | `r6/scripts/1stncbank/DebtCollector/DamageTracker.reds` | Wraps `GameObject.ReactToHitProcess` |\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/armorTweaks.reds` | References HitEvent/ReactToHit |\n| BullseyesKnives 1.0.0 Beta 31418 1 2026-07-11T03-48Z 8ViLVPonV | `r6/scripts/BullseyeRicochet/BullseyeRicochet.reds` | References HitEvent/ReactToHit |\n| Deadly Roads-7745-v2-31b-1701881641 | `r6/scripts/Deadly Roads/core/DeadlyRoads.reds` | References HitEvent/ReactToHit |\n| Deck Of Spell 32170 1.0.0 2026-08-02T05-07Z ujWojTqiR | `r6/scripts/DeckOfSpells/elements_recovery.reds` | References HitEvent/ReactToHit |\n\n*25 more mods use this pattern.*\n\n## Related Concepts\n\n- [Damage System Overrides](/combat/damage-system-overrides.md) \u2014 Replacing or extending DamageSystem methods to alter how damage is calculated and applied.\n- [Attack Data Modification](/combat/attack-data-modification.md) \u2014 Manipulating AttackData structures to change attack properties like damage type, range, or impact."}, {"id": "combat/sandevistan-manipulation", "type": "Mechanic Pattern", "title": "Sandevistan State Manipulation", "description": "Intercepting Sandevistan activation/deactivation events to modify time dilation behavior.", "tags": ["combat sandevistan cyberware time-dilation"], "group": "combat", "sz": 28, "body": "# Sandevistan State Manipulation\n\nIntercepting Sandevistan activation/deactivation events to modify time dilation behavior.\n\n## Approach\n\nMods wrap `SandevistanEvents.OnEnter`, `OnExit`, and `OnForcedExit` to intercept when the player activates or deactivates the Sandevistan. This allows custom time dilation modifiers, extended duration, conditional effects, or modified stamina drain during Sandevistan use.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Time Dilation Overhaul 4931 2.32 2026-07-28T22-51Z q7jg7fhKQ | `r6/scripts/TDO/Core/RangedFireRateFix.reds` | Wraps `SandevistanEvents.OnEnter` |\n\n## Related Concepts\n\n- [Status Effect Interception](/player/status-effect-interception.md) \u2014 Wrapping OnStatusEffectApplied/OnStatusEffectRemoved on PlayerPuppet and NPCPuppet to intercept status effect events.\n- [Shoot Event Handling](/combat/shoot-events.md) \u2014 Wrapping ShootEvents to modify weapon firing behavior and combat state transitions."}, {"id": "combat/shoot-events", "type": "Mechanic Pattern", "title": "Shoot Event Handling", "description": "Wrapping ShootEvents to modify weapon firing behavior and combat state transitions.", "tags": ["combat weapons shooting"], "group": "combat", "sz": 29, "body": "# Shoot Event Handling\n\nWrapping ShootEvents to modify weapon firing behavior and combat state transitions.\n\n## Approach\n\nMods wrap `ShootEvents.OnEnter` to intercept when the player enters a shooting state. This enables custom recoil patterns, weapon handling modifications, or conditional firing behavior based on game state.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | Wraps `ShootEvents.OnEnter` |\n| Time Dilation Overhaul 4931 2.32 2026-07-28T22-51Z q7jg7fhKQ | `r6/scripts/TDO/Core/RangedFireRateFix.reds` | Wraps `ShootEvents.OnEnter` |\n| Trigger Mode Control-13077-2-8-1-1757088209 | `r6/scripts/TriggerModeControl/TriggerModeControl.reds` | Wraps `ShootEvents.OnExit` |\n\n## Related Concepts\n\n- [Action Input Handling](/player/action-input-handling.md) \u2014 Wrapping PlayerPuppet.OnAction and input-related methods to intercept player input events.\n- [Combat State Transitions](/player/combat-state-transitions.md) \u2014 Wrapping OnCombatStateChanged to intercept combat state changes and apply custom behavior."}, {"id": "combat/tweakdb-attack-records", "type": "Mechanic Pattern", "title": "TweakDB Attack Record Modification", "description": "Modifying Attacks.* TweakDB records to alter static attack damage values and properties.", "tags": ["combat tweakdb attacks"], "group": "combat", "sz": 32, "body": "# TweakDB Attack Record Modification\n\nModifying Attacks.* TweakDB records to alter static attack damage values and properties.\n\n## Approach\n\nMods modify `Attacks.*` TweakDB records via YAML tweak files to change base damage values, damage types, or attack properties. This is a static data approach compared to runtime hit event interception \u2014 the values are set at load time rather than computed per-hit.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 03. EX-1 Cybercriminal-28768-1-0-1775734058 | `r6/tweaks/EX1/EX1_Cybercriminal.yaml` | Modifies Attacks.* TweakDB records |\n| Carnage Grenade Launcher - Slower Reload-27730-1-0-1772155585 | `r6/tweaks/Carnage MPGL/Carnage_MPGL.yaml` | Modifies Attacks.* TweakDB records |\n| Doctrine Hydra V1.0.3 32034 1.0.3 2026-08-03T07-48Z psSjsvrFY | `r6/tweaks/DoctrineMultiTargetLauncher/attacks_and_rounds.yaml` | Modifies Attacks.* TweakDB records |\n| Exagryph Iconic Smart LMG-24124-1-0-0-1757971368 | `r6/tweaks/ZZZBSG_iconic/exagryph.yaml` | Modifies Attacks.* TweakDB records |\n| ExplosionShake V2.11 31285 2.11 2026-07-13T15-41Z 8ViLVPoT0 | `r6/tweaks/ExplosionShake/ExplosionStandupFix.yaml` | Modifies Attacks.* TweakDB records |\n\n*15 more mods use this pattern.*\n\n## Related Concepts\n\n- [Attack Data Modification](/combat/attack-data-modification.md) \u2014 Manipulating AttackData structures to change attack properties like damage type, range, or impact.\n- [Runtime TweakDB Modification](/systems/tweakdb-runtime-modification.md) \u2014 Using CET or REDScript to modify TweakDB records at runtime rather than via static YAML files."}, {"id": "economy/crafting-system-overrides", "type": "Mechanic Pattern", "title": "Crafting System Overrides", "description": "Wrapping CraftingLogicController and CraftingSystem to modify crafting recipes and behavior.", "tags": ["economy crafting items"], "group": "economy", "sz": 31, "body": "# Crafting System Overrides\n\nWrapping CraftingLogicController and CraftingSystem to modify crafting recipes and behavior.\n\n## Approach\n\nMods wrap `CraftingLogicController` and `CraftingSystem` methods to alter crafting behavior. This includes custom recipe requirements, modified crafting costs, additional craftable items, or conditional crafting availability. Some mods also modify crafting-related TweakDB records for recipe definitions.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Craft All-23494-1-0-0-1755273337 | `r6/scripts/Craft All/Craft All.reds` | References crafting system |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFStashCraftingSystem.reds` | References crafting system |\n| Enhanced Craft-4378-4-0-9-1779642516 | `r6/scripts/EnhancedCraft/common/EnhancedCraft-Fields.reds` | References crafting system |\n| Find-EX-8340-1-2-0-1697203025 | `r6/scripts/FindEx/FindEx.Global.reds` | Wraps `CraftingLogicController.Init` |\n| Immersive Crafting Access-16154-0-0-5-1723163219 | `r6/scripts/ImmersiveCraftingAccess/ImmersiveCraftingAccess.reds` | References crafting system |\n\n*8 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vendor Inventory Modification](/economy/vendor-inventory-modification.md) \u2014 Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices.\n- [Player Development Overrides](/player/player-development-overrides.md) \u2014 Wrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression."}, {"id": "economy/drop-point-modifications", "type": "Mechanic Pattern", "title": "Drop Point Modifications", "description": "Modifying DropPointsReimagined.* TweakDB records to alter drop point mechanics.", "tags": ["economy drop-points tweakdb"], "group": "economy", "sz": 28, "body": "# Drop Point Modifications\n\nModifying DropPointsReimagined.* TweakDB records to alter drop point mechanics.\n\n## Approach\n\nMods modify `DropPointsReimagined.*` TweakDB records to change drop point rewards, availability, or mechanics. This is part of the Drop Points Reimagined framework for customizing the drop point system.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| DropPointsReimagined-29563-1-0-0-1778351569 | `r6/tweaks/DropPointsReimagined/Card.yaml` | Modifies drop point records |\n\n## Related Concepts\n\n- [Vendor Inventory Modification](/economy/vendor-inventory-modification.md) \u2014 Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "economy/drug-dealer-modifications", "type": "Mechanic Pattern", "title": "Drug Dealer Modifications", "description": "Modifying DrugDealer.* TweakDB records to alter drug dealer vendor behavior.", "tags": ["economy drug-dealer tweakdb"], "group": "economy", "sz": 28, "body": "# Drug Dealer Modifications\n\nModifying DrugDealer.* TweakDB records to alter drug dealer vendor behavior.\n\n## Approach\n\nMods modify `DrugDealer.*` TweakDB records to change what drug dealers sell, their inventory composition, or pricing. This is a specialized vendor modification pattern for the drug dealer NPC type.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Drug Dealer 27800 6.5.6 2026-06-26T12-36Z 5em9eoSzt | `r6/tweaks/DrugDealer/DrugDealer.Drug.Base.yaml` | Modifies DrugDealer.* records |\n\n## Related Concepts\n\n- [Vendor Inventory Modification](/economy/vendor-inventory-modification.md) \u2014 Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices.\n- [TweakDB Character Record Modification](/systems/tweakdb-character-records.md) \u2014 Modifying Character.* TweakDB records to alter NPC and character definitions."}, {"id": "economy/price-adjustment", "type": "Mechanic Pattern", "title": "Price Adjustment via TweakDB", "description": "Modifying Price.* TweakDB records to alter item pricing globally.", "tags": ["economy pricing tweakdb"], "group": "economy", "sz": 30, "body": "# Price Adjustment via TweakDB\n\nModifying Price.* TweakDB records to alter item pricing globally.\n\n## Approach\n\nMods modify `Price.*` TweakDB records to globally adjust item prices. This includes buy prices, sell prices, and price multipliers for different item categories. Changes are static and applied at game load time.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Artistic-13066-1-4-5-1774982712 | `r6/tweaks/Artistic/Artistic.yaml` | Modifies Price.* records |\n| Immersive Cyberware-21916-1-0-2-1755792059 | `r6/tweaks/ImmersiveCyberware/lenses/common.yaml` | Modifies Price.* records |\n| New Iconic Conventional Weapons-20694-1-0-1743523219 | `r6/tweaks/NewIconics/NewIconics.yaml` | Modifies Price.* records |\n| Nue x-MOD2-20741-1-0-0-1743706626 | `r6/tweaks/Nue x-MOD2/Items.m1klos_Nue_XMOD2.yaml` | Modifies Price.* records |\n| Perkware 2.0 29611 2.1.3 2026-07-15T23-18Z UQrhQStni | `r6/tweaks/Perkware/PerkwarePrices.yaml` | Modifies Price.* records |\n\n*9 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vendor Inventory Modification](/economy/vendor-inventory-modification.md) \u2014 Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "economy/vendor-inventory-modification", "type": "Mechanic Pattern", "title": "Vendor Inventory Modification", "description": "Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices.", "tags": ["economy vendors tweakdb"], "group": "economy", "sz": 31, "body": "# Vendor Inventory Modification\n\nModifying Vendors.* TweakDB records to change what items vendors sell and at what prices.\n\n## Approach\n\nMods modify `Vendors.*` TweakDB records via YAML tweak files to add items to vendor inventories, change stock quantities, or adjust buy/sell prices. This is the most common economy manipulation pattern \u2014 it modifies static game data rather than runtime behavior.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 01. Igla Double Tap - Longer Barrel-29554-1-0-1778467633 | `r6/tweaks/Igla Double Tap/Igla_DoubleTap.yaml` | Modifies Vendors.* TweakDB records |\n| 03. EX-1 Cybercriminal-28768-1-0-1775734058 | `r6/tweaks/EX1/EX1_Cybercriminal.yaml` | Modifies Vendors.* TweakDB records |\n| ACHILLES 3FX-27613-1-0-1-1773480076 | `r6/tweaks/c3_achilles_3fx/c3_achilles_3fx.yaml` | Modifies Vendors.* TweakDB records |\n| AK-77-14716-1-0-1715688582 | `r6/tweaks/AK_77.yaml` | Modifies Vendors.* TweakDB records |\n| Artistic-13066-1-4-5-1774982712 | `r6/tweaks/Artistic/Artistic.yaml` | Modifies Vendors.* TweakDB records |\n\n*73 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vendor Logic Overrides](/economy/vendor-logic-overrides.md) \u2014 Wrapping Vendor class methods to change vendor interaction behavior at runtime.\n- [Price Adjustment via TweakDB](/economy/price-adjustment.md) \u2014 Modifying Price.* TweakDB records to alter item pricing globally.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "economy/vendor-logic-overrides", "type": "Mechanic Pattern", "title": "Vendor Logic Overrides", "description": "Wrapping Vendor class methods to change vendor interaction behavior at runtime.", "tags": ["economy vendors runtime"], "group": "economy", "sz": 31, "body": "# Vendor Logic Overrides\n\nWrapping Vendor class methods to change vendor interaction behavior at runtime.\n\n## Approach\n\nMods use `@wrapMethod(Vendor)` to override vendor interaction logic at runtime. This enables dynamic pricing, conditional item availability, custom vendor behaviors, or integration with other game systems. Unlike TweakDB modifications, these overrides are computed per-interaction.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/injector.reds` | Wraps `Vendor.PlayerCanBuy` |\n| Better Leveling V2 (Finalise)-22784-2-3-3-1759851280 | `r6/scripts/Better Leveling Addon/Extra Street Credit Tier/BTL_00_ExtraStreetCred.reds` | Wraps `Vendor.OnVendorMenuOpen` |\n| DropPointsReimagined-29563-1-0-0-1778351569 | `r6/scripts/DropPointsReimagined/Overrides/Vendor.reds` | Wraps `Vendor.OnVendorMenuOpen` |\n| Much Better Eddies 30532 1.3 2026-07-12T02-46Z LACBAIygB | `r6/scripts/BetterEddies/Pricing/SellDisplayWrap.reds` | Wraps `Vendor.OnVendorMenuOpen` |\n| Smarter Scrapper-2687-2-3-6-1774445898 | `r6/scripts/smarterScrapper.reds` | Wraps `Vendor.PerformItemTransfer` |\n\n*2 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vendor Inventory Modification](/economy/vendor-inventory-modification.md) \u2014 Modifying Vendors.* TweakDB records to change what items vendors sell and at what prices.\n- [Vendor UI Overrides](/ui/vendor-ui-overrides.md) \u2014 Wrapping vendor and ripperdoc game controllers to modify vendor interaction UI."}, {"id": "media/arcade-system-overrides", "type": "Mechanic Pattern", "title": "Arcade System Overrides", "description": "Intercepting arcade minigame controllers to customize arcade gameplay.", "tags": ["media arcade minigame"], "group": "media", "sz": 33, "body": "# Arcade System Overrides\n\nIntercepting arcade minigame controllers to customize arcade gameplay.\n\n## Approach\n\nMods observe arcade minigame controllers like `gameuiPanzerHUDGameController` and `ArcadeMachineControllerPS` via CET to intercept arcade minigame events. This enables custom arcade behavior, modified scoring, or additional arcade features.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Doom2077 31634 1 2026-07-17T20-07Z 4rpqrKUEh | `Doom2077/bin/x64/plugins/cyber_engine_tweaks/mods/Doom2077/init.lua` | CET Override `ArcadeMachineControllerPS.OnBeginArcadeMinigameUI` |\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameUI.lua` | CET Observe `gameuiPanzerHUDGameController.OnUninitialize` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameUI.lua` | CET Observe `gameuiPanzerHUDGameController.OnUninitialize` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enhanced Vehicle System/GameUI.lua` | CET Observe `gameuiPanzerHUDGameController.OnUninitialize` |\n| FieldItems V-2-0-2.zip-12367-2-0-2-1775478370 | `bin/x64/plugins/cyber_engine_tweaks/mods/fielditems/external/GameUI.lua` | CET Observe `gameuiPanzerHUDGameController.OnUninitialize` |\n\n*18 more mods use this pattern.*\n\n## Related Concepts\n\n- [Callback System Registration](/systems/callback-system-registration.md) \u2014 Using RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key.\n- [Device Interaction Extensions](/world/device-interaction-extensions.md) \u2014 Extending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior."}, {"id": "media/braindance-manipulation", "type": "Mechanic Pattern", "title": "Braindance Manipulation", "description": "Intercepting BraindanceGameController to modify braindance mode behavior.", "tags": ["media braindance scanning"], "group": "media", "sz": 32, "body": "# Braindance Manipulation\n\nIntercepting BraindanceGameController to modify braindance mode behavior.\n\n## Approach\n\nMods observe `BraindanceGameController.OnIsActiveUpdated` via CET to intercept braindance activation/deactivation. This enables custom braindance scanning behavior, modified visual effects, or integration with other gameplay systems during braindance mode.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/CompassBar.reds` | References BraindanceGameController |\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameUI.lua` | CET Observe `BraindanceGameController.OnIsActiveUpdated` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameUI.lua` | CET Observe `BraindanceGameController.OnIsActiveUpdated` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enhanced Vehicle System/GameUI.lua` | CET Observe `BraindanceGameController.OnIsActiveUpdated` |\n| FieldItems V-2-0-2.zip-12367-2-0-2-1775478370 | `bin/x64/plugins/cyber_engine_tweaks/mods/fielditems/external/GameUI.lua` | CET Observe `BraindanceGameController.OnIsActiveUpdated` |\n\n*18 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Vision Mode](/player/player-vision-mode.md) \u2014 Intercepting PlayerVisionModeController to modify scanning and vision modes.\n- [HUD Overlay Customization](/media/hud-overlay-customization.md) \u2014 Wrapping HUD overlay controllers like CompassController and hudCarController to customize HUD elements."}, {"id": "media/custom-radio-streams", "type": "Mechanic Pattern", "title": "Custom Radio Streams", "description": "Adding custom radio stations via Channels.* TweakDB records and audio archive files.", "tags": ["media radio tweakdb audio"], "group": "media", "sz": 31, "body": "# Custom Radio Streams\n\nAdding custom radio stations via Channels.* TweakDB records and audio archive files.\n\n## Approach\n\nMods add custom radio stations by modifying `Channels.*` TweakDB records and including audio archive files. This is primarily a data-driven approach \u2014 the radio station metadata is defined in TweakDB, and the audio streams are packaged as archive files. Many radio mods are archive-only with no code.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Artistic-13066-1-4-5-1774982712 | `r6/tweaks/Artistic/Artistic.yaml` | Adds/modifies radio Channels.* records |\n| 12.26 limbus radio-18791-1-8-7-1766193756 | `archive/` | Radio stream mod (archive-only or no-code) |\n| 201.5 HANABIE.-20921-1-0-1744465889 | `archive/` | Radio stream mod (archive-only or no-code) |\n| 3 LOFI Radio Stream-19122-1-1-1737059666 | `3 LOFI Radio Stream/archive/pc/mod/3 LOFI Radio Stream.archive` | Custom radio stream via archive files |\n| 323.5 KTRK-20791-1-0-1743921184 | `archive/` | Radio stream mod (archive-only or no-code) |\n\n*8 more mods use this pattern.*\n\n## Related Concepts\n\n- [Radio Station Manipulation](/media/radio-station-manipulation.md) \u2014 Wrapping radio controller classes to modify in-vehicle radio behavior.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "media/hud-overlay-customization", "type": "Mechanic Pattern", "title": "HUD Overlay Customization", "description": "Wrapping HUD overlay controllers like CompassController and hudCarController to customize HUD elements.", "tags": ["media hud compass overlay"], "group": "media", "sz": 32, "body": "# HUD Overlay Customization\n\nWrapping HUD overlay controllers like CompassController and hudCarController to customize HUD elements.\n\n## Approach\n\nMods wrap `CompassController`, `hudCarController`, and other HUD overlay controllers to customize HUD rendering. This includes compass modifications, vehicle HUD customization, or hiding/showing HUD elements conditionally. CET `Observe` is commonly used to react to HUD state changes.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/LHUDCompat.reds` | References HUD overlay controllers |\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameUI.lua` | CET Observe `hudCarController.OnCameraModeChanged` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameUI.lua` | CET Observe `hudCarController.OnCameraModeChanged` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `r6/scripts/Enhanced Vehicle System/Enhanced Vehicle System.reds` | References HUD overlay controllers |\n| Eye-Tracked HUD 30603 1.0.0 2026-06-20T15-56Z AgoGgivIA | `r6/scripts/Eye-Tracked HUD/EyeTrackedHUDController.reds` | References HUD overlay controllers |\n\n*25 more mods use this pattern.*\n\n## Related Concepts\n\n- [HUD Manager Overrides](/ui/hud-manager-overrides.md) \u2014 Wrapping HUDManager to modify HUD element visibility, style, and compatibility.\n- [Braindance Manipulation](/media/braindance-manipulation.md) \u2014 Intercepting BraindanceGameController to modify braindance mode behavior."}, {"id": "media/loading-screen-customization", "type": "Mechanic Pattern", "title": "Loading Screen Customization", "description": "Customizing loading screen display via LoadingScreenProgressBarController.", "tags": ["media loading-screen ui"], "group": "media", "sz": 33, "body": "# Loading Screen Customization\n\nCustomizing loading screen display via LoadingScreenProgressBarController.\n\n## Approach\n\nMods observe `LoadingScreenProgressBarController.SetProgress` via CET to intercept loading screen progress updates. This enables custom loading screen visuals, progress indicators, or loading screen modifications.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameUI.lua` | CET Observe `LoadingScreenProgressBarController.SetProgress` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameUI.lua` | CET Observe `LoadingScreenProgressBarController.SetProgress` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enhanced Vehicle System/GameUI.lua` | CET Observe `LoadingScreenProgressBarController.SetProgress` |\n| FieldItems V-2-0-2.zip-12367-2-0-2-1775478370 | `bin/x64/plugins/cyber_engine_tweaks/mods/fielditems/external/GameUI.lua` | CET Observe `LoadingScreenProgressBarController.SetProgress` |\n| Flying Tank-16138-1-2-4-1770820062 | `bin/x64/plugins/cyber_engine_tweaks/mods/FlyingTank/External/GameUI.lua` | CET Observe `LoadingScreenProgressBarController.SetProgress` |\n\n*17 more mods use this pattern.*\n\n## Related Concepts\n\n- [Menu Controller Overrides](/ui/menu-controller-overrides.md) \u2014 Wrapping menu game controllers to modify settings, pause menu, and main menu behavior.\n- [Callback System Registration](/systems/callback-system-registration.md) \u2014 Using RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key."}, {"id": "media/photo-mode-overrides", "type": "Mechanic Pattern", "title": "Photo Mode Overrides", "description": "Intercepting photo mode activation and rendering to customize photo mode behavior.", "tags": ["media photo-mode camera"], "group": "media", "sz": 32, "body": "# Photo Mode Overrides\n\nIntercepting photo mode activation and rendering to customize photo mode behavior.\n\n## Approach\n\nMods wrap `gameuiPhotoModeMenuController` methods and observe photo mode events via CET to intercept photo mode activation/deactivation. This enables custom camera angles, unlocked movement, additional photo mode features, or removal of photo mode restrictions. Both REDScript `@wrapMethod` and CET `Observe` patterns are used.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Always Free Camera V1.5 31472 2 2026-07-16T09-54Z SlR4l6sf5 | `bin/x64/plugins/cyber_engine_tweaks/mods/AlwaysFreeCamera/init.lua` | CET Override `gamePhotoModeSystem.CanPhotoModeBeEnabled` |\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/Spawn/VehicleSpawnSystem.reds` | References photo mode classes |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/AntiTheftMeasures/Spawn/VehicleSpawnSystem.reds` | References photo mode classes |\n| BullseyesKnives 1.0.0 Beta 31418 1 2026-07-11T03-48Z 8ViLVPonV | `r6/scripts/BullseyeRicochet/BullseyeRicochet.reds` | References photo mode classes |\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/CompassBar.reds` | References photo mode classes |\n\n*34 more mods use this pattern.*\n\n## Related Concepts\n\n- [Photo Mode Pose Tweaks](/media/photo-mode-poses.md) \u2014 Modifying PhotoModePoses.* TweakDB records to add or alter photo mode poses.\n- [HUD Overlay Customization](/media/hud-overlay-customization.md) \u2014 Wrapping HUD overlay controllers like CompassController and hudCarController to customize HUD elements."}, {"id": "media/photo-mode-poses", "type": "Mechanic Pattern", "title": "Photo Mode Pose Tweaks", "description": "Modifying PhotoModePoses.* TweakDB records to add or alter photo mode poses.", "tags": ["media photo-mode tweakdb poses"], "group": "media", "sz": 29, "body": "# Photo Mode Pose Tweaks\n\nModifying PhotoModePoses.* TweakDB records to add or alter photo mode poses.\n\n## Approach\n\nMods modify `PhotoModePoses.*` TweakDB records to add custom poses to photo mode or alter existing pose definitions. This is a static data approach \u2014 poses are defined as TweakDB records loaded at game start.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Emmjay's FF NSFW Threesome Pose Pack - PM 2.3-21744-2-0-1753681489 | `r6/tweaks/emmjay_threesome_nsfw_poses/emmjay_threesome_nsfw_poses.yaml` | Modifies PhotoModePoses.* records |\n| PMU - Sitting Set - Masc-8361-2-31-1759810388 | `r6/tweaks/zwei/ZWEI_PMU_Sit_MascV.yaml` | Modifies PhotoModePoses.* records |\n\n## Related Concepts\n\n- [Photo Mode Overrides](/media/photo-mode-overrides.md) \u2014 Intercepting photo mode activation and rendering to customize photo mode behavior.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "media/radio-station-manipulation", "type": "Mechanic Pattern", "title": "Radio Station Manipulation", "description": "Wrapping radio controller classes to modify in-vehicle radio behavior.", "tags": ["media radio vehicle audio"], "group": "media", "sz": 32, "body": "# Radio Station Manipulation\n\nWrapping radio controller classes to modify in-vehicle radio behavior.\n\n## Approach\n\nMods wrap `RadioControllerPS`, `RadioInkGameController`, `PocketRadio`, and `VehicleRadioPopupGameController` to modify radio station behavior. This includes custom station switching, default station setting, radio toggle interception, or adding custom radio streams. Both CET Override and REDScript @wrapMethod patterns are used.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/scripts/Consumable Animations/Services/CAAnimationService.reds` | References radio system classes |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFVehicleSleepSystem.reds` | References radio system classes |\n| Limited HUD 2592 2.22.4 2026-07-26T18-22Z LACBAIyo3 | `r6/scripts/LHUD/core/listeners.reds` | References radio system classes |\n| Logitech Wheel Support-29172-2-31-2-1780181543 | `gwheel_reds/gwheel_vehicle_signals.reds` | Wraps `VehicleComponent.OnRadioToggleEvent` |\n| Metro Pocket Guide-11882-1-2-12-1769330167 | `r6/scripts/MetroPocketGuide/widgetdisplay/TrackMetroEnterExit.reds` | References radio system classes |\n\n*3 more mods use this pattern.*\n\n## Related Concepts\n\n- [Custom Radio Streams](/media/custom-radio-streams.md) \u2014 Adding custom radio stations via Channels.* TweakDB records and audio archive files.\n- [Vehicle Component Extensions](/vehicle/vehicle-component-extensions.md) \u2014 Extending VehicleComponent and VehicleComponentPS via wrapping and method addition to modify vehicle behavior."}, {"id": "player/action-input-handling", "type": "Mechanic Pattern", "title": "Action Input Handling", "description": "Wrapping PlayerPuppet.OnAction and input-related methods to intercept player input events.", "tags": ["player input actions"], "group": "player", "sz": 32, "body": "# Action Input Handling\n\nWrapping PlayerPuppet.OnAction and input-related methods to intercept player input events.\n\n## Approach\n\nMods wrap `PlayerPuppet.OnAction` (16 instances) to intercept player input actions. This enables custom key bindings, modified input behavior, conditional action handling, or integration of custom actions into the input system. CET Observe is also used to monitor `QuickSlotsManager` for hotkey events.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | Hooks OnAction for input handling |\n| Always Free Camera V1.5 31472 2 2026-07-16T09-54Z SlR4l6sf5 | `bin/x64/plugins/cyber_engine_tweaks/mods/AlwaysFreeCamera/init.lua` | CET Observe `PlayerPuppet.OnAction` |\n| Anti-Tracking Breach-27505-2-0-1773756783 | `r6/scripts/Anti-TrackingBreach/AntiTrackingBreach.reds` | Wraps `PlayerPuppet.OnAction` |\n| AutoAim1.20-28776-1-2-0-1776799767 | `r6/scripts/AutoAim/AutoAimHooks.reds` | Wraps `PlayerPuppet.OnAction` |\n| AutoWalkToggle 31218 2 2026-07-06T19-28Z VquAqYzZD | `r6/scripts/AutoRunToggle/AutoRunToggle.reds` | Wraps `PlayerPuppet.OnAction` |\n\n*47 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Lifecycle Hooks](/player/player-lifecycle-hooks.md) \u2014 Wrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup.\n- [Movement State Events](/player/movement-state-events.md) \u2014 Wrapping SprintEvents, ClimbEvents, LadderEvents, and other movement state classes to modify movement behavior."}, {"id": "player/attachment-slot-tweaks", "type": "Mechanic Pattern", "title": "Attachment Slot Tweaks", "description": "Modifying AttachmentSlots.* TweakDB records to alter equipment attachment slots.", "tags": ["player equipment tweakdb attachments"], "group": "player", "sz": 31, "body": "# Attachment Slot Tweaks\n\nModifying AttachmentSlots.* TweakDB records to alter equipment attachment slots.\n\n## Approach\n\nMods modify `AttachmentSlots.*` TweakDB records to add or modify weapon attachment slots. This enables custom weapon attachments, modified slot configurations, or new attachment types.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Kolac Expanded-24491-1-3-1771507690 | `r6/tweaks/KolacExpanded/KolacVariants.yaml` | Modifies AttachmentSlots.* records |\n| New Iconic Conventional Weapons-20694-1-0-1743523219 | `r6/tweaks/NewIconics/NewIconics.yaml` | Modifies AttachmentSlots.* records |\n| Slots Should Be Clean 2.0-27788-1-0-1-1772116675 | `r6/tweaks/c3_slots_should_be_clean2/c3_slots_should_be_clean2.yaml` | Modifies AttachmentSlots.* records |\n| Tremere - vampiric tech SMG-19727-1-0-0-1741537750 | `r6/tweaks/Tremere/Items.Xmod2_Tech_SMG_Blueprint.yaml` | Modifies AttachmentSlots.* records |\n| cyberpunk-vr-port 30093 0.1.1 2026-08-03T09-27Z ozVyzbgII | `r6/tweaks/vrcigarette/AttachmentSlots.WeaponRight.yaml` | Modifies AttachmentSlots.* records |\n\n## Related Concepts\n\n- [Equipment System Manipulation](/player/equipment-system-manipulation.md) \u2014 Wrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "player/attunement-tweaks", "type": "Mechanic Pattern", "title": "Attunement Tweaks", "description": "Modifying Attunements.* TweakDB records to alter cyberware attunement mechanics.", "tags": ["player cyberware attunement tweakdb"], "group": "player", "sz": 30, "body": "# Attunement Tweaks\n\nModifying Attunements.* TweakDB records to alter cyberware attunement mechanics.\n\n## Approach\n\nMods modify `Attunements.*` TweakDB records to change how cyberware attunements work. This includes modified attunement bonuses, custom attunement types, or altered attunement requirements.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Cyphire Sniper Cyberware-14345-1-0-1713879194 | `r6/tweaks/CyphireEyesCyberware/CyphireSniperEyesCyberwareTEMPLATES.yaml` | Modifies Attunements.* records |\n| Perkware 2.0 29611 2.1.3 2026-07-15T23-18Z UQrhQStni | `r6/tweaks/Perkware/Attunement/Localization.yaml` | Modifies Attunements.* records |\n| Rootkit-29469-2-1778504485 | `r6/tweaks/Rootkit/Items.RootKit.yaml` | Modifies Attunements.* records |\n| Time Dilation Overhaul 4931 2.32 2026-07-28T22-51Z q7jg7fhKQ | `r6/tweaks/TDO/apogee.yaml` | Modifies Attunements.* records |\n\n## Related Concepts\n\n- [Player Development Overrides](/player/player-development-overrides.md) \u2014 Wrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression.\n- [TweakDB Perk Modifications](/systems/tweakdb-perks.md) \u2014 Modifying NewPerks.* TweakDB records to add or alter perk definitions."}, {"id": "player/combat-state-transitions", "type": "Mechanic Pattern", "title": "Combat State Transitions", "description": "Wrapping OnCombatStateChanged to intercept combat state changes and apply custom behavior.", "tags": ["player combat state-transitions"], "group": "player", "sz": 32, "body": "# Combat State Transitions\n\nWrapping OnCombatStateChanged to intercept combat state changes and apply custom behavior.\n\n## Approach\n\nMods wrap `PlayerPuppet.OnCombatStateChanged` (9 instances) to detect when the player enters or exits combat. This enables conditional behavior based on combat state \u2014 such as modified movement speed, changed UI display, or custom effects triggered by combat engagement.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Services/DFPlayerStateService.reds` | Wraps `PlayerPuppet.OnCombatStateChanged` |\n| Dynamic Movement-26963-2-6-1-1772108240 | `r6/scripts/Dynamic Movement/StateCallbacks/BlackboardCallbacks.reds` | Wraps `PlayerPuppet.OnCombatStateChanged` |\n| Dynamic Wardrobe-27791-2-1-1773744332 | `r6/scripts/Dynamic Wardrobe/Core/OutfitManager.reds` | Hooks OnCombatStateChanged |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `r6/scripts/Enhanced Vehicle System/Enhanced Vehicle System.reds` | Wraps `PlayerPuppet.OnCombatStateChanged` |\n| Gen Texting-28275-V6-1774838745 | `r6/scripts/GenerativeTexting/GenerativeTextingHooks.reds` | Wraps `PlayerPuppet.OnCombatStateChanged` |\n\n*5 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Lifecycle Hooks](/player/player-lifecycle-hooks.md) \u2014 Wrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup.\n- [Shoot Event Handling](/combat/shoot-events.md) \u2014 Wrapping ShootEvents to modify weapon firing behavior and combat state transitions.\n- [Prevention System Overrides](/systems/prevention-system-overrides.md) \u2014 Wrapping PreventionSystem to modify police response and crime detection behavior."}, {"id": "player/death-and-defeat-handling", "type": "Mechanic Pattern", "title": "Death and Defeat Handling", "description": "Wrapping OnDeath and OnDefeated on PlayerPuppet and ScriptedPuppet to intercept death/defeat events.", "tags": ["player death defeat npc"], "group": "player", "sz": 32, "body": "# Death and Defeat Handling\n\nWrapping OnDeath and OnDefeated on PlayerPuppet and ScriptedPuppet to intercept death/defeat events.\n\n## Approach\n\nMods wrap `PlayerPuppet.OnDeath`, `ScriptedPuppet.OnDefeated`, and `NPCPuppet` death methods to intercept when characters die or are defeated. This enables custom death behavior, modified defeat handling, death penalties, or revival mechanics.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 1st Night City Bank 29412 1.6 2026-06-29T12-18Z PYMIYqXtV | `r6/scripts/1stncbank/DebtCollector/DebtCollector.reds` | Wraps `PlayerPuppet.OnDeath` |\n| Audioware-12001-v1-9-2-1775355328 | `r6/scripts/Audioware/Hooks.reds` | Wraps `ScriptedPuppet.OnDefeated` |\n| Deck Of Spell 32170 1.0.0 2026-08-02T05-07Z ujWojTqiR | `r6/scripts/DeckOfSpells/elements_recovery.reds` | Wraps `ScriptedPuppet.OnDefeated` |\n| Drug Dealer 27800 6.5.6 2026-06-26T12-36Z 5em9eoSzt | `r6/scripts/DrugDealer/Spawn/EntitySpawnSystem.reds` | Wraps `ScriptedPuppet.OnDefeated` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameSession.lua` | CET Observe `PlayerPuppet.OnDeath` |\n\n*22 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Lifecycle Hooks](/player/player-lifecycle-hooks.md) \u2014 Wrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup.\n- [Combat State Transitions](/player/combat-state-transitions.md) \u2014 Wrapping OnCombatStateChanged to intercept combat state changes and apply custom behavior."}, {"id": "player/equipment-system-manipulation", "type": "Mechanic Pattern", "title": "Equipment System Manipulation", "description": "Wrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior.", "tags": ["player equipment inventory"], "group": "player", "sz": 32, "body": "# Equipment System Manipulation\n\nWrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior.\n\n## Approach\n\nMods wrap `EquipmentSystemPlayerData` (28 wraps, 14 @addMethod) to modify equipment behavior. This includes custom equipment slots, modified equip/unequip logic, or integration with other systems. Some mods also modify `AttachmentSlots.*` TweakDB records for equipment slot configuration.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | References EquipmentSystemPlayerData |\n| Auto Leveler-27010-2-31-01-1769096078 | `r6/scripts/Auto Leveler/AutoLevel.reds` | References EquipmentSystemPlayerData |\n| Daemon Netrunning (Revamp)-23894-1-2-1-1759846597 | `r6/scripts/Daemon Netrunning (Revamp)/DNR_Core.reds` | References EquipmentSystemPlayerData |\n| Dynamic Wardrobe-27791-2-1-1773744332 | `r6/scripts/Dynamic Wardrobe/Events/SceneHandler.reds` | Wraps `EquipmentSystemPlayerData.UnequipWardrobeSet` |\n| Equipment-EX-6945-1-2-9-1773737132 | `r6/scripts/EquipmentEx/EquipmentEx.Global.reds` | Wraps `EquipmentSystemPlayerData.OnAttach` |\n\n*13 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Development Overrides](/player/player-development-overrides.md) \u2014 Wrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression.\n- [Inventory UI Overrides](/ui/inventory-ui-overrides.md) \u2014 Wrapping inventory-related game controllers to modify inventory and backpack display.\n- [Attachment Slot Tweaks](/player/attachment-slot-tweaks.md) \u2014 Modifying AttachmentSlots.* TweakDB records to alter equipment attachment slots."}, {"id": "player/first-equip-system", "type": "Mechanic Pattern", "title": "First Equip System", "description": "Wrapping FirstEquipSystem and EquipCycleDecisions to modify weapon equipping behavior.", "tags": ["player weapons equip"], "group": "player", "sz": 30, "body": "# First Equip System\n\nWrapping FirstEquipSystem and EquipCycleDecisions to modify weapon equipping behavior.\n\n## Approach\n\nMods wrap `FirstEquipSystem` and `EquipCycleDecisions` to modify how weapons are equipped for the first time. This includes custom first-equip behavior, modified equip cycles, or conditional equip rules. The `EquipCycleDecisions` class controls the state machine for weapon equip decisions.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | References FirstEquipSystem/EquipCycleDecisions |\n| Weapon Handling Control-11474-2-2-2-1762730218 | `r6/scripts/WeaponHandlingControl/WeaponHandlingControl.reds` | References FirstEquipSystem/EquipCycleDecisions |\n| cyberpunk-vr-port 30093 0.1.1 2026-08-03T09-27Z ozVyzbgII | `r6/scripts/CyberpunkVRPort_NoAnims/vrport_no_anims.reds` | Wraps `FirstEquipSystem.HasPlayedFirstEquip` |\n\n## Related Concepts\n\n- [Equipment System Manipulation](/player/equipment-system-manipulation.md) \u2014 Wrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior.\n- [Movement State Events](/player/movement-state-events.md) \u2014 Wrapping SprintEvents, ClimbEvents, LadderEvents, and other movement state classes to modify movement behavior."}, {"id": "player/healing-system-tweaks", "type": "Mechanic Pattern", "title": "Healing System Tweaks", "description": "Modifying ImmersiveHealing.* TweakDB records to alter healing item behavior.", "tags": ["player healing tweakdb"], "group": "player", "sz": 28, "body": "# Healing System Tweaks\n\nModifying ImmersiveHealing.* TweakDB records to alter healing item behavior.\n\n## Approach\n\nMods modify `ImmersiveHealing.*` TweakDB records to change healing item mechanics. This includes modified heal amounts, healing over time, or custom healing item behavior.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ImmersiveHealing-26281-3-3-0-1779621922 | `r6/tweaks/ImmersiveHealing/Custom/Cooldown.yaml` | Modifies ImmersiveHealing.* records |\n\n## Related Concepts\n\n- [TweakDB Status Effect Records](/systems/tweakdb-status-effects.md) \u2014 Modifying BaseStatusEffect.* and StatusEffects.* TweakDB records to alter status effects.\n- [TweakDB Base Stats Modification](/player/tweakdb-base-stats.md) \u2014 Modifying BaseStats.* TweakDB records to alter base character statistics."}, {"id": "player/monowire-perk-tweaks", "type": "Mechanic Pattern", "title": "Monowire Perk Tweaks", "description": "Modifying MonowirePerkTree.* TweakDB records to alter monowire cyberware perks.", "tags": ["player monowire perks tweakdb cyberware"], "group": "player", "sz": 28, "body": "# Monowire Perk Tweaks\n\nModifying MonowirePerkTree.* TweakDB records to alter monowire cyberware perks.\n\n## Approach\n\nMods modify `MonowirePerkTree.*` TweakDB records to change monowire-specific perk behavior. This is a specialized perk tree modification for the monowire cyberware weapon.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| MonowirePerkTree 31515 1.2.0 2026-07-25T13-51Z HncQn2NEd | `r6/tweaks/MonowirePerkTree/status_effects.yaml` | Modifies MonowirePerkTree.* records |\n\n## Related Concepts\n\n- [TweakDB Perk Modifications](/systems/tweakdb-perks.md) \u2014 Modifying NewPerks.* TweakDB records to add or alter perk definitions.\n- [Attunement Tweaks](/player/attunement-tweaks.md) \u2014 Modifying Attunements.* TweakDB records to alter cyberware attunement mechanics."}, {"id": "player/movement-action-tweaks", "type": "Mechanic Pattern", "title": "Movement Action Tweaks", "description": "Modifying MovementActions.* TweakDB records to alter movement mechanics.", "tags": ["player movement tweakdb"], "group": "player", "sz": 29, "body": "# Movement Action Tweaks\n\nModifying MovementActions.* TweakDB records to alter movement mechanics.\n\n## Approach\n\nMods modify `MovementActions.*` TweakDB records to change movement-related actions. This includes sprint speed, jump height, dodge mechanics, or other movement parameters defined as static TweakDB data.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Melee Overhaul-20792-1-0-1-1744018227 | `MeleeOverhaul/r6/tweaks/MeleeOverhaul/EnemyAI/Chasing/CatchUpDistance.yaml` | Modifies MovementActions.* records |\n| Sandevistan Enhanced-20953-1-0-0-1744552512 | `Sandevistan Enhanced/r6/tweaks/Sandevistan/Sandevistan/SandevistanCondition.yaml` | Modifies MovementActions.* records |\n\n## Related Concepts\n\n- [Movement State Events](/player/movement-state-events.md) \u2014 Wrapping SprintEvents, ClimbEvents, LadderEvents, and other movement state classes to modify movement behavior.\n- [TweakDB Base Stats Modification](/player/tweakdb-base-stats.md) \u2014 Modifying BaseStats.* TweakDB records to alter base character statistics."}, {"id": "player/movement-state-events", "type": "Mechanic Pattern", "title": "Movement State Events", "description": "Wrapping SprintEvents, ClimbEvents, LadderEvents, and other movement state classes to modify movement behavior.", "tags": ["player movement sprint climb"], "group": "player", "sz": 32, "body": "# Movement State Events\n\nWrapping SprintEvents, ClimbEvents, LadderEvents, and other movement state classes to modify movement behavior.\n\n## Approach\n\nMods wrap state event classes like `SprintEvents`, `ClimbEvents`, `LadderEvents`, `CarriedObjectEvents`, and `CoolExitingEvents` to intercept movement state transitions. This enables custom sprint mechanics, modified climbing behavior, or conditional movement restrictions. These classes are part of the player state machine and wrapping their `OnEnter`/`OnExit` methods allows intercepting state changes.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | Wraps `ClimbEvents.OnEnter` |\n| Dynamic Movement-26963-2-6-1-1772108240 | `r6/scripts/Dynamic Movement/StateCallbacks/StateMachineWraps.reds` | Wraps `LadderEvents.OnEnter` |\n| Omni Combat v1.0 FabledFoundry-24008-1-0-1756973720 | `r6/scripts/Omni-Combat/OmniCombat_Pack.reds` | Wraps `SprintEvents.OnEnter` |\n| Running Man 26611 1.2.0 2026-07-29T21-57Z Q6xF6lvEu | `r6/scripts/RunningMan/double_sprint.reds` | Wraps `SprintEvents.OnUpdate` |\n| Time Dilation Overhaul 4931 2.32 2026-07-28T22-51Z q7jg7fhKQ | `r6/scripts/TDO/Sandy/Juggernaut.reds` | Wraps `ClimbEvents.OnEnter` |\n\n*1 more mods use this pattern.*\n\n## Related Concepts\n\n- [Action Input Handling](/player/action-input-handling.md) \u2014 Wrapping PlayerPuppet.OnAction and input-related methods to intercept player input events.\n- [Movement Action Tweaks](/player/movement-action-tweaks.md) \u2014 Modifying MovementActions.* TweakDB records to alter movement mechanics."}, {"id": "player/player-development-overrides", "type": "Mechanic Pattern", "title": "Player Development Overrides", "description": "Wrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression.", "tags": ["player perks skills progression"], "group": "player", "sz": 31, "body": "# Player Development Overrides\n\nWrapping PlayerDevelopmentData methods to modify perk, attribute, and skill progression.\n\n## Approach\n\nMods wrap `PlayerDevelopmentData` methods (15 wraps, 33 @addMethod) to modify how the player gains perks, attributes, and skills. This includes custom perk trees, modified leveling curves, or additional development options. The `@addMethod` pattern is used to add new methods to the player development system.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Auto Leveler-27010-2-31-01-1769096078 | `r6/scripts/Auto Leveler/AutoLevel.reds` | Wraps `PlayerDevelopmentData.OnRestored` |\n| Better Leveling V2 (Finalise)-22784-2-3-3-1759851280 | `r6/scripts/Better Leveling (Revamp of Custom Level Cap)/BTL_00_Main.reds` | References PlayerDevelopmentData |\n| Daemon Netrunning (Revamp)-23894-1-2-1-1759846597 | `r6/scripts/Daemon Netrunning (Revamp)/DNR_Core.reds` | References PlayerDevelopmentData |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Main/DFMainSystem.reds` | References PlayerDevelopmentData |\n| Dash Fix-16272-1-0-0-1723844109 | `r6/scripts/DashFix/DashFix.reds` | References PlayerDevelopmentData |\n\n*13 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Perk Modifications](/systems/tweakdb-perks.md) \u2014 Modifying NewPerks.* TweakDB records to add or alter perk definitions.\n- [Equipment System Manipulation](/player/equipment-system-manipulation.md) \u2014 Wrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior."}, {"id": "player/player-lifecycle-hooks", "type": "Mechanic Pattern", "title": "Player Lifecycle Hooks", "description": "Wrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup.", "tags": ["player lifecycle initialization playerpuppet"], "group": "player", "sz": 34, "body": "# Player Lifecycle Hooks\n\nWrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup.\n\n## Approach\n\nMods wrap `PlayerPuppet.OnGameAttached` (the most common hook, 87 instances) to initialize mod state when the player entity is created. `OnDetach` is wrapped for cleanup. `OnMakePlayerVisibleAfterSpawn` is wrapped for post-spawn initialization. This is the foundational pattern for player-modifying mods \u2014 it provides the entry point for registering listeners, setting up systems, and injecting custom behavior. Both REDScript @wrapMethod and CET Observe patterns are used.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/scripts/AldecaldosHighStakes/Main.reds` | Adds `PlayerPuppet.TestPopup` |\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | Wraps `PlayerPuppet.OnGameAttached` |\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/CustomHackingSystem/CodewareExtensions/TickManager.reds` | Wraps `PlayerPuppet.OnGameAttached` |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/CustomHackingSystem/CodewareExtensions/TickManager.reds` | Wraps `PlayerPuppet.OnGameAttached` |\n| Anti-Tracking Breach-27505-2-0-1773756783 | `r6/scripts/Anti-TrackingBreach/AntiTrackingBreach.reds` | Wraps `PlayerPuppet.SetIsBeingRevealed` |\n\n*99 more mods use this pattern.*\n\n## Related Concepts\n\n- [Status Effect Interception](/player/status-effect-interception.md) \u2014 Wrapping OnStatusEffectApplied/OnStatusEffectRemoved on PlayerPuppet and NPCPuppet to intercept status effect events.\n- [Action Input Handling](/player/action-input-handling.md) \u2014 Wrapping PlayerPuppet.OnAction and input-related methods to intercept player input events.\n- [Callback System Registration](/systems/callback-system-registration.md) \u2014 Using RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key."}, {"id": "player/player-vision-mode", "type": "Mechanic Pattern", "title": "Player Vision Mode", "description": "Intercepting PlayerVisionModeController to modify scanning and vision modes.", "tags": ["player vision scanning"], "group": "player", "sz": 32, "body": "# Player Vision Mode\n\nIntercepting PlayerVisionModeController to modify scanning and vision modes.\n\n## Approach\n\nMods observe `PlayerVisionModeController.OnRestrictedSceneChanged` (45 instances) via CET to intercept vision mode changes. This enables custom scanning behavior, modified vision mode effects, or conditional vision restrictions based on game context.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/CompassBar.reds` | References PlayerVisionModeController |\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameUI.lua` | CET Observe `PlayerVisionModeController.OnRestrictedSceneChanged` |\n| DynamicEnemyMultiplier_1.1 31555 1.1 2026-07-17T00-18Z k8Iw8mCTa | `bin/x64/plugins/cyber_engine_tweaks/mods/DynamicEnemyMultiplier/init.lua` | CET Observe `PlayerVisionModeController.OnRestrictedSceneChanged` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameUI.lua` | CET Observe `PlayerVisionModeController.OnRestrictedSceneChanged` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enhanced Vehicle System/GameUI.lua` | CET Observe `PlayerVisionModeController.OnRestrictedSceneChanged` |\n\n*19 more mods use this pattern.*\n\n## Related Concepts\n\n- [Braindance Manipulation](/media/braindance-manipulation.md) \u2014 Intercepting BraindanceGameController to modify braindance mode behavior.\n- [Hacking System Extensions](/systems/hacking-system-extensions.md) \u2014 Extending quickhack and hacking system classes to modify network breach and quickhack behavior."}, {"id": "player/stats-modification", "type": "Mechanic Pattern", "title": "Stats System Modification", "description": "Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime.", "tags": ["player stats modifiers"], "group": "player", "sz": 32, "body": "# Stats System Modification\n\nUsing StatsSystem and stat modifiers to modify player and NPC stat values at runtime.\n\n## Approach\n\nMods reference `StatsSystem` (417 occurrences), `gameStatModifierType`, and `gameStatModifierData` to modify character stats at runtime. This includes applying custom stat modifiers, reading stat values for conditional behavior, or modifying stat calculation pipelines. Some mods also modify `BaseStats.*` TweakDB records for static stat definitions.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 1st Night City Bank 29412 1.6 2026-06-29T12-18Z PYMIYqXtV | `r6/scripts/1stncbank/Core/System.reds` | References StatsSystem/stat modifiers |\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | References StatsSystem/stat modifiers |\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/CustomHackingSystem/Main/CustomHackingSystem.reds` | References StatsSystem/stat modifiers |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/CustomHackingSystem/Main/CustomHackingSystem.reds` | References StatsSystem/stat modifiers |\n| Anti-Tracking Breach-27505-2-0-1773756783 | `r6/scripts/Anti-TrackingBreach/AntiTrackingBreach.reds` | References StatsSystem/stat modifiers |\n\n*55 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Base Stats Modification](/player/tweakdb-base-stats.md) \u2014 Modifying BaseStats.* TweakDB records to alter base character statistics.\n- [Damage System Overrides](/combat/damage-system-overrides.md) \u2014 Replacing or extending DamageSystem methods to alter how damage is calculated and applied.\n- [RPG Manager Overrides](/systems/rpg-manager-overrides.md) \u2014 Wrapping RPGManager methods to modify RPG progression and reward systems."}, {"id": "player/status-effect-interception", "type": "Mechanic Pattern", "title": "Status Effect Interception", "description": "Wrapping OnStatusEffectApplied/OnStatusEffectRemoved on PlayerPuppet and NPCPuppet to intercept status effect events.", "tags": ["player status-effects combat"], "group": "player", "sz": 33, "body": "# Status Effect Interception\n\nWrapping OnStatusEffectApplied/OnStatusEffectRemoved on PlayerPuppet and NPCPuppet to intercept status effect events.\n\n## Approach\n\nMods wrap `PlayerPuppet.OnStatusEffectApplied` (20 instances) and `OnStatusEffectRemoved` (13 instances) to intercept when status effects are applied to or removed from the player. NPCPuppet variants are also wrapped for NPC status effect handling. This enables custom status effect behavior, conditional effect stacking, or effect modification based on game state.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/shieldPointsSystem.reds` | Wraps `PlayerPuppet.OnStatusEffectApplied` |\n| AutoAim1.20-28776-1-2-0-1776799767 | `r6/scripts/AutoAim/AutoAimHooks.reds` | Wraps `PlayerPuppet.OnStatusEffectRemoved` |\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/scripts/Consumable Animations/Services/CAGameStateService.reds` | Wraps `PlayerPuppet.OnStatusEffectApplied` |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFInteractionSystem.reds` | Wraps `PlayerPuppet.OnStatusEffectApplied` |\n| Deadly Roads-7745-v2-31b-1701881641 | `r6/scripts/Deadly Roads/core/DeadlyRoads.reds` | Wraps `PlayerPuppet.OnStatusEffectRemoved` |\n\n*37 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Lifecycle Hooks](/player/player-lifecycle-hooks.md) \u2014 Wrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup.\n- [TweakDB Status Effect Records](/systems/tweakdb-status-effects.md) \u2014 Modifying BaseStatusEffect.* and StatusEffects.* TweakDB records to alter status effects.\n- [Sandevistan State Manipulation](/combat/sandevistan-manipulation.md) \u2014 Intercepting Sandevistan activation/deactivation events to modify time dilation behavior."}, {"id": "player/tweakdb-base-stats", "type": "Mechanic Pattern", "title": "TweakDB Base Stats Modification", "description": "Modifying BaseStats.* TweakDB records to alter base character statistics.", "tags": ["player stats tweakdb"], "group": "player", "sz": 31, "body": "# TweakDB Base Stats Modification\n\nModifying BaseStats.* TweakDB records to alter base character statistics.\n\n## Approach\n\nMods modify `BaseStats.*` TweakDB records to change base character stats like health, stamina, armor, or cyberware capacity. This is a static data approach \u2014 stats are modified at load time rather than computed at runtime.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/tweaks/ArmorUp/cyberware/heavyArmorPlating.yaml` | Modifies BaseStats.* records |\n| DropPointsReimagined-29563-1-0-0-1778351569 | `r6/tweaks/DropPointsReimagined/Package/ServiceTier.yaml` | Modifies BaseStats.* records |\n| Graven's Attribute Expansion-10250-1-01-1698033259 | `r6/tweaks/HealthPerLevelBaseStatDeclarations.yaml` | Modifies BaseStats.* records |\n| Health Mod-10213-1-01-1697839946 | `r6/tweaks/HealthPerLevelBaseStatDeclarations.yaml` | Modifies BaseStats.* records |\n| Immersive Cyberware-21916-1-0-2-1755792059 | `r6/tweaks/ImmersiveCyberware/biomon.yaml` | Modifies BaseStats.* records |\n\n*17 more mods use this pattern.*\n\n## Related Concepts\n\n- [Stats System Modification](/player/stats-modification.md) \u2014 Using StatsSystem and stat modifiers to modify player and NPC stat values at runtime.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "systems/ai-behavior-modification", "type": "Mechanic Pattern", "title": "AI Behavior Modification", "description": "Modifying AI behavior classes and AISubAction records to alter NPC AI behavior.", "tags": ["systems ai behavior npc"], "group": "systems", "sz": 28, "body": "# AI Behavior Modification\n\nModifying AI behavior classes and AISubAction records to alter NPC AI behavior.\n\n## Approach\n\nMods modify `AISubActionApplyTimeDilation_Record_Implementation` (33 @addMethod instances) and `AIActionsFX.*` TweakDB records to alter AI behavior. This includes custom AI actions, modified time dilation behavior during AI actions, or custom AI effect definitions.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Time Dilation Overhaul 4931 2.32 2026-07-28T22-51Z q7jg7fhKQ | `r6/scripts/EnemySandevistanRework/tickSystem.reds` | References AI behavior classes |\n\n## Related Concepts\n\n- [Reaction Manager Overrides](/systems/reaction-manager-overrides.md) \u2014 Wrapping ReactionManagerComponent to modify NPC reaction behavior.\n- [NPC Puppet Extensions](/systems/npc-puppet-extensions.md) \u2014 Adding methods to NPCPuppet via @addMethod to extend NPC behavior and capabilities."}, {"id": "systems/callback-system-registration", "type": "Mechanic Pattern", "title": "Callback System Registration", "description": "Using RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key.", "tags": ["systems callbacks events initialization"], "group": "systems", "sz": 33, "body": "# Callback System Registration\n\nUsing RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key.\n\n## Approach\n\nMods register callbacks via REDScript `RegisterCallback` or CET `RegisterHook`/`RegisterForEvent` to listen for game lifecycle events. The most common events are `Resource/PostLoad` (7245 instances), `Resource/Ready`, `Session/Ready`, `Input/Key`, and `Entity/Attached`. This is the primary initialization pattern \u2014 mods register callbacks to know when the game has loaded, when the session starts, or when input events occur.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| 1st Night City Bank 29412 1.6 2026-06-29T12-18Z PYMIYqXtV | `r6/scripts/1stncbank/Core/Config.reds` | Registers callback for `Session/Ready` |\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/scripts/AldecaldosHighStakes/Main.reds` | Registers callback for `Session/Ready` |\n| Audioware-12001-v1-9-2-1775355328 | `r6/scripts/Audioware/Codeware.reds` | Registers callback for `Session/Ready` |\n| Cutscene Weapon Swapper-20743-1-4-1-1745154157 | `r6/scripts/CutsceneWeaponSwapper.reds` | Registers callback for `Resource/PostLoad` |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Settings/DFSettings.reds` | Registers callback for `Session/Start` |\n\n*48 more mods use this pattern.*\n\n## Related Concepts\n\n- [Player Lifecycle Hooks](/player/player-lifecycle-hooks.md) \u2014 Wrapping PlayerPuppet lifecycle methods (OnGameAttached, OnDetach, OnMakePlayerVisibleAfterSpawn) to run mod initialization and cleanup.\n- [ScriptableService Registration](/systems/scriptable-service-registration.md) \u2014 Using the ScriptableService pattern to create persistent background services that run throughout the game session."}, {"id": "systems/dark-future-integration", "type": "Mechanic Pattern", "title": "Dark Future Framework Integration", "description": "Modifying DarkFuture-prefixed TweakDB records for integration with the Dark Future mod framework.", "tags": ["systems dark-future framework tweakdb"], "group": "systems", "sz": 30, "body": "# Dark Future Framework Integration\n\nModifying DarkFuture-prefixed TweakDB records for integration with the Dark Future mod framework.\n\n## Approach\n\nMods modify `DarkFutureStatusEffect.*` and `DarkFutureProps.*` TweakDB records to integrate with the Dark Future framework. This framework provides extended survival and immersion mechanics, and mods modify its TweakDB records to add custom effects or props compatible with the framework.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/tweaks/Consumable Animations/ConsumableAnimations.ConsumableAnimData.yaml` | DarkFuture framework records |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/tweaks/Dark Future/DarkFuture.BaseGameUpdate_AlcoholData.yaml` | DarkFuture framework records |\n| Perkware 2.0 29611 2.1.3 2026-07-15T23-18Z UQrhQStni | `r6/tweaks/PerkwarePatches/Dark Future/zzzDarkFuturePatch.yaml` | DarkFuture framework records |\n\n## Related Concepts\n\n- [TweakDB Status Effect Records](/systems/tweakdb-status-effects.md) \u2014 Modifying BaseStatusEffect.* and StatusEffects.* TweakDB records to alter status effects.\n- [Healing System Tweaks](/player/healing-system-tweaks.md) \u2014 Modifying ImmersiveHealing.* TweakDB records to alter healing item behavior."}, {"id": "systems/fact-system-manipulation", "type": "Mechanic Pattern", "title": "Fact System Manipulation", "description": "Using GetFact and SetFact to read and modify game quest facts that control game state.", "tags": ["systems facts quest state"], "group": "systems", "sz": 31, "body": "# Fact System Manipulation\n\nUsing GetFact and SetFact to read and modify game quest facts that control game state.\n\n## Approach\n\nMods use `GetFact` (263 occurrences) and `SetFact`/`SetFactValue` (258 occurrences) to read and modify game quest facts. Facts are boolean/integer game state variables that control quest progression, NPC behavior, and world state. This enables mods to check game state, trigger quest-like behavior, or modify game progression. Some mods also use `QuestSystem` for more advanced quest manipulation.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/scripts/AldecaldosHighStakes/Main.reds` | Uses GetFact/SetFact |\n| BrowserExtensionFramework-10038-0-9-7-1758341320 | `r6/scripts/BrowserExtension/browserController.overrides.reds` | Uses GetFact/SetFact |\n| CompassBar-22655-2-0-1770283479 | `r6/scripts/CompassBar/CompassBar.reds` | Uses GetFact/SetFact |\n| Completely Non-Manual Looting-16040-2-13-01-1727125795 | `r6/scripts/Completely Non-Manual Loot/CNML.reds` | Uses GetFact/SetFact |\n| Computer Anywhere 12520 2.2.0 2026-07-30T18-54Z Co8doeA0Q | `r6/scripts/liftcheck.reds` | Uses GetFact/SetFact |\n\n*39 more mods use this pattern.*\n\n## Related Concepts\n\n- [Prevention System Overrides](/systems/prevention-system-overrides.md) \u2014 Wrapping PreventionSystem to modify police response and crime detection behavior.\n- [Device Interaction Extensions](/world/device-interaction-extensions.md) \u2014 Extending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior."}, {"id": "systems/fast-travel-overrides", "type": "Mechanic Pattern", "title": "Fast Travel Overrides", "description": "Observing FastTravelSystem events to intercept and modify fast travel behavior.", "tags": ["systems fast-travel travel"], "group": "systems", "sz": 33, "body": "# Fast Travel Overrides\n\nObserving FastTravelSystem events to intercept and modify fast travel behavior.\n\n## Approach\n\nMods observe `FastTravelSystem.OnPerformFastTravelRequest`, `OnLoadingScreenFinished`, and `OnUpdateFastTravelPointRecordRequest` via CET to intercept fast travel events. This enables custom fast travel behavior, restricted travel destinations, or modified travel costs.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameUI.lua` | CET Observe `FastTravelSystem.OnUpdateFastTravelPointRecordRequest` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameSession.lua` | CET Observe `FastTravelSystem.OnUpdateFastTravelPointRecordRequest` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enhanced Vehicle System/GameSession.lua` | CET Observe `FastTravelSystem.OnUpdateFastTravelPointRecordRequest` |\n| Enterable Interiors 2.6.0-13209-2-6-0-1763996310 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enterable Interiors/external/GameSession.lua` | CET Observe `FastTravelSystem.OnUpdateFastTravelPointRecordRequest` |\n| FieldItems V-2-0-2.zip-12367-2-0-2-1775478370 | `bin/x64/plugins/cyber_engine_tweaks/mods/fielditems/external/GameUI.lua` | CET Observe `FastTravelSystem.OnToggleFastTravelAvailabilityOnMapRequest` |\n\n*21 more mods use this pattern.*\n\n## Related Concepts\n\n- [Callback System Registration](/systems/callback-system-registration.md) \u2014 Using RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key.\n- [Loading Screen Customization](/media/loading-screen-customization.md) \u2014 Customizing loading screen display via LoadingScreenProgressBarController."}, {"id": "systems/game-object-extensions", "type": "Mechanic Pattern", "title": "Game Object Extensions", "description": "Adding methods to GameObject base class to extend all game entities.", "tags": ["systems game-object extensions"], "group": "systems", "sz": 31, "body": "# Game Object Extensions\n\nAdding methods to GameObject base class to extend all game entities.\n\n## Approach\n\nMods use `@addMethod(GameObject)` (11 instances) and `@wrapMethod(GameObject)` to extend the base game object class. Since all entities inherit from GameObject, these additions affect all game objects. This is a powerful but broad pattern used for utility methods that need to be available on any entity.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Com
