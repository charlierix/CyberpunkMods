-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameSession.lua` | CET Observe `QuestTrackerGameController.OnInitialize` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enhanced Vehicle System/GameSession.lua` | CET Observe `QuestTrackerGameController.OnInitialize` |\n| Enterable Interiors 2.6.0-13209-2-6-0-1763996310 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enterable Interiors/external/GameSession.lua` | CET Observe `QuestTrackerGameController.OnInitialize` |\n\n*31 more mods use this pattern.*\n\n## Related Concepts\n\n- [Fact System Manipulation](/systems/fact-system-manipulation.md) \u2014 Using GetFact and SetFact to read and modify game quest facts that control game state.\n- [HUD Manager Overrides](/ui/hud-manager-overrides.md) \u2014 Wrapping HUDManager to modify HUD element visibility, style, and compatibility."}, {"id": "ui/timeskip-ui", "type": "Mechanic Pattern", "title": "Timeskip UI", "description": "Wrapping TimeskipGameController to modify the time-skip interaction.", "tags": ["ui timeskip time"], "group": "ui", "sz": 30, "body": "# Timeskip UI\n\nWrapping TimeskipGameController to modify the time-skip interaction.\n\n## Approach\n\nMods wrap `TimeskipGameController` (24 wraps, 18 @addMethod) to modify the time-skip feature. This includes custom time-skip behavior, modified time progression, or additional time-skip options.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/cyberwareScripts/toolHandRepair.reds` | Wraps `TimeskipGameController.OnCloseAfterFinishing` |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/UI/DFTimeskipMenuUI.reds` | Wraps `TimeskipGameController.OnInitialize` |\n| Immersive Timeskip-5115-2-2-2-1767878170 | `r6/scripts/ImmersiveTimeskip/base/TimeskipGameController-added.reds` | Adds `TimeskipGameController.TweakWidgetAppearance` |\n| Survival System-7510-v0-91b-1734794608 | `r6/scripts/Survival System/core/ControllerTimeskip.reds` | Wraps `TimeskipGameController.OnInitialize` |\n\n## Related Concepts\n\n- [Fact System Manipulation](/systems/fact-system-manipulation.md) \u2014 Using GetFact and SetFact to read and modify game quest facts that control game state.\n- [Menu Controller Overrides](/ui/menu-controller-overrides.md) \u2014 Wrapping menu game controllers to modify settings, pause menu, and main menu behavior."}, {"id": "ui/tooltip-and-item-display", "type": "Mechanic Pattern", "title": "Tooltip and Item Display", "description": "Wrapping item tooltip and helper classes to modify item information display.", "tags": ["ui tooltips items display"], "group": "ui", "sz": 31, "body": "# Tooltip and Item Display\n\nWrapping item tooltip and helper classes to modify item information display.\n\n## Approach\n\nMods wrap `ItemTooltipBottomModule` (13 wraps), `UIItemsHelper` (18 wraps), and `ItemActionsHelper` to modify how item information is displayed. This includes custom tooltip content, modified item stats display, or additional item action options.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Auto Leveler-27010-2-31-01-1769096078 | `r6/scripts/Auto Leveler/AutoLevel.reds` | References item tooltip/helpers |\n| Completely Non-Manual Looting-16040-2-13-01-1727125795 | `r6/scripts/Completely Non-Manual Loot/CNML.reds` | References item tooltip/helpers |\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/scripts/Consumable Animations/Main/CAMainSystem.reds` | Wraps `ItemActionsHelper.ProcessItemAction` |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Needs/DFNeedConsumables.reds` | Wraps `ItemActionsHelper.ProcessItemAction` |\n| Doctrine Hydra V1.0.3 32034 1.0.3 2026-08-03T07-48Z psSjsvrFY | `r6/scripts/DoctrineMultiTargetLauncher/30_modules_ui_migration.reds` | Wraps `UIItemsHelper.GetSlotName` |\n\n*13 more mods use this pattern.*\n\n## Related Concepts\n\n- [Inventory UI Overrides](/ui/inventory-ui-overrides.md) \u2014 Wrapping inventory-related game controllers to modify inventory and backpack display.\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions."}, {"id": "ui/tutorial-system-overrides", "type": "Mechanic Pattern", "title": "Tutorial System Overrides", "description": "Observing tutorial popup controllers to modify tutorial behavior.", "tags": ["ui tutorial popups"], "group": "ui", "sz": 33, "body": "# Tutorial System Overrides\n\nObserving tutorial popup controllers to modify tutorial behavior.\n\n## Approach\n\nMods observe `gameuiTutorialPopupGameController.PauseGame` (33 instances) via CET to intercept tutorial popups. This enables disabling tutorials, custom tutorial content, or modified tutorial timing.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/External/GameUI.lua` | CET Observe `gameuiTutorialPopupGameController.PauseGame` |\n| Enhanced DualSense Support - Update 2.3-4156-4-62-1753534659 | `bin/x64/plugins/cyber_engine_tweaks/mods/DualSense Support/modules/GameSession.lua` | CET Observe `gameuiTutorialPopupGameController.PauseGame` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enhanced Vehicle System/GameSession.lua` | CET Observe `gameuiTutorialPopupGameController.PauseGame` |\n| Enterable Interiors 2.6.0-13209-2-6-0-1763996310 | `bin/x64/plugins/cyber_engine_tweaks/mods/Enterable Interiors/external/GameSession.lua` | CET Observe `gameuiTutorialPopupGameController.PauseGame` |\n| FieldItems V-2-0-2.zip-12367-2-0-2-1775478370 | `bin/x64/plugins/cyber_engine_tweaks/mods/fielditems/external/GameUI.lua` | CET Observe `gameuiTutorialPopupGameController.PauseGame` |\n\n*21 more mods use this pattern.*\n\n## Related Concepts\n\n- [Menu Controller Overrides](/ui/menu-controller-overrides.md) \u2014 Wrapping menu game controllers to modify settings, pause menu, and main menu behavior.\n- [Callback System Registration](/systems/callback-system-registration.md) \u2014 Using RegisterCallback and CET RegisterHook to register for game events like Session/Ready, Resource/PostLoad, and Input/Key."}, {"id": "ui/tweakdb-ui-icons", "type": "Mechanic Pattern", "title": "TweakDB UI Icon Modification", "description": "Modifying UIIcon.* TweakDB records to add or alter UI icons.", "tags": ["ui icons tweakdb"], "group": "ui", "sz": 31, "body": "# TweakDB UI Icon Modification\n\nModifying UIIcon.* TweakDB records to add or alter UI icons.\n\n## Approach\n\nMods modify `UIIcon.*` TweakDB records to add custom icons or modify existing icon references. This is used for custom item icons, perk icons, or UI element graphics. Changes are static and loaded at game start.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| A Normal Pizza Option-25788-1-0-0-1763760710 | `r6/tweaks/morepizzaoptions/MorePizzaOptions.yaml` | Modifies UIIcon.* records |\n| Artistic-13066-1-4-5-1774982712 | `r6/tweaks/Artistic/Artistic.yaml` | Modifies UIIcon.* records |\n| Combat Pants-14224-1-0-1713144460 | `707 combat pants/r6/tweaks/caibro_militech_pants.yaml` | Modifies UIIcon.* records |\n| Consumable Animations-26762-1-1-3-for-2-31-1768709491 | `r6/tweaks/Consumable Animations/ConsumableAnimations.ConsumableCigarettes.yaml` | Modifies UIIcon.* records |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/tweaks/Dark Future/DarkFuture.BaseGameUpdate_ConsumableItemData.yaml` | Modifies UIIcon.* records |\n\n*32 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions.\n- [Inventory UI Overrides](/ui/inventory-ui-overrides.md) \u2014 Wrapping inventory-related game controllers to modify inventory and backpack display."}, {"id": "ui/vendor-ui-overrides", "type": "Mechanic Pattern", "title": "Vendor UI Overrides", "description": "Wrapping vendor and ripperdoc game controllers to modify vendor interaction UI.", "tags": ["ui vendor ripperdoc shops"], "group": "ui", "sz": 31, "body": "# Vendor UI Overrides\n\nWrapping vendor and ripperdoc game controllers to modify vendor interaction UI.\n\n## Approach\n\nMods wrap `FullscreenVendorGameController` (36 wraps, 37 @addMethod) and `RipperDocGameController` (31 wraps) to modify vendor UI behavior. This includes custom vendor displays, modified item purchasing, or additional vendor UI features.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| ArmorUp-24801-1-0-4-1774830868 | `r6/scripts/ArmorUp/armorTweaks.reds` | Wraps `RipperDocGameController.UpdateArmorBar` |\n| DropPointsReimagined-29563-1-0-0-1778351569 | `r6/scripts/DropPointsReimagined/Overrides/FullscreenVendorGameController.reds` | Wraps `FullscreenVendorGameController.HandleVendorSlotClick` |\n| Enhanced Craft-4378-4-0-9-1779642516 | `r6/scripts/EnhancedCraft/core/Stash-Helpers.reds` | Wraps `FullscreenVendorGameController.PopulateVendorInventory` |\n| Filthy Access Points-27698-1-2-1-1780438657 | `r6/scripts/FilthyAccessPoints/FilthyAccessPoints.reds` | Wraps `RipperDocGameController.SetButtonHints` |\n| Immersive Cyberware-21916-1-0-2-1755792059 | `r6/scripts/ImmersiveCyberware/slotSupport.reds` | Wraps `RipperDocGameController.OnPreviewCyberwareClick` |\n\n*13 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vendor Logic Overrides](/economy/vendor-logic-overrides.md) \u2014 Wrapping Vendor class methods to change vendor interaction behavior at runtime.\n- [Inventory UI Overrides](/ui/inventory-ui-overrides.md) \u2014 Wrapping inventory-related game controllers to modify inventory and backpack display."}, {"id": "ui/weapon-roster-ui", "type": "Mechanic Pattern", "title": "Weapon Roster UI", "description": "Wrapping WeaponRosterGameController to modify weapon selection display.", "tags": ["ui weapons roster hud"], "group": "ui", "sz": 31, "body": "# Weapon Roster UI\n\nWrapping WeaponRosterGameController to modify weapon selection display.\n\n## Approach\n\nMods wrap `WeaponRosterGameController` (14 wraps, 12 @addMethod) to modify the weapon selection UI. This includes custom weapon display, modified sorting, or additional weapon roster features.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Environmental Weapon Handling 29803 1.2.1 2026-06-16T11-31Z hF7PF40bO | `r6/scripts/EnvironmentalWeaponHandling/EnvironmentalWeaponHUD.reds` | Wraps `WeaponRosterGameController.OnInitialize` |\n| Eye-Tracked HUD 30603 1.0.0 2026-06-20T15-56Z AgoGgivIA | `r6/scripts/Eye-Tracked HUD/EyeTrackedHUDController.reds` | Wraps `WeaponRosterGameController.OnInitialize` |\n| HUD Painter-14935-1-3-0-1768645929 | `r6/scripts/HUDPainter/HudPainterPreviewControllerStubs.reds` | Wraps `WeaponRosterGameController.OnInitialize` |\n| Immersive Cyberware-21916-1-0-2-1755792059 | `r6/scripts/ImmersiveCyberware/handCyberware.reds` | Wraps `WeaponRosterGameController.OnUpdate` |\n| Limited HUD 2592 2.22.4 2026-07-26T18-22Z LACBAIyo3 | `r6/scripts/LHUD/modules/weaponRoster.reds` | Adds `WeaponRosterGameController.OnLHUDEvent` |\n\n*1 more mods use this pattern.*\n\n## Related Concepts\n\n- [Equipment System Manipulation](/player/equipment-system-manipulation.md) \u2014 Wrapping EquipmentSystemPlayerData to modify equipment and inventory management behavior.\n- [First Equip System](/player/first-equip-system.md) \u2014 Wrapping FirstEquipSystem and EquipCycleDecisions to modify weapon equipping behavior."}, {"id": "vehicle/vehicle-component-extensions", "type": "Mechanic Pattern", "title": "Vehicle Component Extensions", "description": "Extending VehicleComponent and VehicleComponentPS via wrapping and method addition to modify vehicle behavior.", "tags": ["vehicle vehicle-component extensions"], "group": "vehicle", "sz": 33, "body": "# Vehicle Component Extensions\n\nExtending VehicleComponent and VehicleComponentPS via wrapping and method addition to modify vehicle behavior.\n\n## Approach\n\nMods wrap `VehicleComponent` (115 wraps, 400 @addMethod) and `VehicleComponentPS` (17 wraps, 33 @addMethod) to extend vehicle behavior. This is the primary pattern for vehicle-modifying mods \u2014 VehicleComponent is the core vehicle entity component. Wrapping its methods enables custom vehicle behavior, modified mounting logic, or integration with other systems. The high @addMethod count (400) reflects how many mods add custom methods to the vehicle component.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| (DriveCE) Mod Settings-10032-2-0-0-1697876886 | `r6/scripts/DriveCarefullyExpanded/DriveCarefullyExpanded.reds` | References VehicleComponent |\n| 1st Night City Bank 29412 1.6 2026-06-29T12-18Z PYMIYqXtV | `r6/scripts/1stncbank/DebtCollector/DebtCollector.reds` | References VehicleComponent |\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/scripts/AldecaldosHighStakes/Vehicle.reds` | Wraps `VehicleComponent.EvaluateDamageLevel` |\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | References VehicleComponent |\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/CounterMeasure/CounterMeasure.reds` | References VehicleComponent |\n\n*46 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vehicle Mount Events](/vehicle/vehicle-mount-events.md) \u2014 Wrapping vehicle mount/unmount event methods to intercept player entering and exiting vehicles.\n- [Vehicle Quickhack Interception](/vehicle/vehicle-quickhack-interception.md) \u2014 Wrapping VehicleComponentPS.GetQuickHackActions to intercept and modify vehicle quickhack options.\n- [Radio Station Manipulation](/media/radio-station-manipulation.md) \u2014 Wrapping radio controller classes to modify in-vehicle radio behavior."}, {"id": "vehicle/vehicle-management-ui", "type": "Mechanic Pattern", "title": "Vehicle Management UI", "description": "Wrapping VehiclesManagerPopupGameController to modify the vehicle management interface.", "tags": ["vehicle ui management"], "group": "vehicle", "sz": 31, "body": "# Vehicle Management UI\n\nWrapping VehiclesManagerPopupGameController to modify the vehicle management interface.\n\n## Approach\n\nMods wrap `VehiclesManagerPopupGameController` (11 wraps, 4 @addMethod) to modify the vehicle management UI. This includes custom vehicle list display, modified vehicle calling behavior, or additional vehicle management features.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| FindMyRide 1.1.0 31610 1.1.0 2026-07-31T15-52Z mPgaPVeOM | `r6/scripts/FindMyRide/FindMyRide.reds` | Wraps `VehiclesManagerPopupGameController.SetupVirtualList` |\n| Limited HUD 2592 2.22.4 2026-07-26T18-22Z LACBAIyo3 | `r6/scripts/LHUD/modules/actionButtons.reds` | References VehiclesManagerPopup |\n| Realistic Transport Dispatch 28220 1.2.2 2026-07-01T06-48Z G5yE5CJYJ | `Realistic Transport Dispatch/r6/scripts/RealisticTransportDispatch/RealisticTransportDispatch.reds` | Wraps `VehiclesManagerPopupGameController.OnShowAnimFinished` |\n| Vehicle Call Plus-27683-1-1-3-1776218501 | `r6/scripts/Vehicle Call Plus/VehicleCall_Cooldowns.reds` | Wraps `VehiclesManagerPopupGameController.OnPlayerAttach` |\n\n## Related Concepts\n\n- [Vehicle System Overrides](/vehicle/vehicle-system-overrides.md) \u2014 Overriding VehicleSystem methods via CET to modify vehicle spawning and management.\n- [In-Game Menu Overrides](/ui/ingame-menu-overrides.md) \u2014 Wrapping gameuiInGameMenuGameController to modify in-game menu behavior."}, {"id": "vehicle/vehicle-mount-events", "type": "Mechanic Pattern", "title": "Vehicle Mount Events", "description": "Wrapping vehicle mount/unmount event methods to intercept player entering and exiting vehicles.", "tags": ["vehicle mount enter exit"], "group": "vehicle", "sz": 33, "body": "# Vehicle Mount Events\n\nWrapping vehicle mount/unmount event methods to intercept player entering and exiting vehicles.\n\n## Approach\n\nMods wrap `VehicleComponent.OnVehicleFinishedMountingEvent` (20 wraps), `OnVehicleStartedMountingEvent` (14 wraps), `OnUnmountingEvent` (12 wraps), and `OnGameAttach` (12 wraps) to intercept vehicle mounting events. This enables custom behavior when entering/exiting vehicles, conditional mounting restrictions, or integration with other systems during vehicle transitions.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/Hacking/VehicleHackRegistration.reds` | Wraps `VehicleComponent.OnVehicleFinishedMountingEvent` |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/AntiTheftMeasures/Hacking/VehicleHackRegistration.reds` | Wraps `VehicleComponent.OnVehicleFinishedMountingEvent` |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFVehicleSleepSystem.reds` | Wraps `VehicleComponent.OnVehicleFinishedMountingEvent` |\n| Dynamic Movement-26963-2-6-1-1772108240 | `r6/scripts/Dynamic Movement/StateCallbacks/StateMachineWraps.reds` | Wraps `VehicleComponent.OnUnmountingEvent` |\n| Enhanced Vehicle System v17.8 11765 17.8 2026-06-21T09-19Z gMz5MuDD8 | `r6/scripts/Enhanced Vehicle System/Enhanced Vehicle System.reds` | Wraps `VehicleComponent.OnMountingEvent` |\n\n*8 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vehicle Component Extensions](/vehicle/vehicle-component-extensions.md) \u2014 Extending VehicleComponent and VehicleComponentPS via wrapping and method addition to modify vehicle behavior.\n- [Action Input Handling](/player/action-input-handling.md) \u2014 Wrapping PlayerPuppet.OnAction and input-related methods to intercept player input events."}, {"id": "vehicle/vehicle-object-manipulation", "type": "Mechanic Pattern", "title": "Vehicle Object Manipulation", "description": "Wrapping VehicleObject to modify vehicle entity properties and behavior.", "tags": ["vehicle vehicle-object properties"], "group": "vehicle", "sz": 31, "body": "# Vehicle Object Manipulation\n\nWrapping VehicleObject to modify vehicle entity properties and behavior.\n\n## Approach\n\nMods wrap `VehicleObject` (25 wraps, 28 @addMethod) to modify vehicle entity properties. This includes custom vehicle stats, modified radio behavior, or integration of vehicle-specific features. VehicleObject is the base vehicle entity class.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| (DriveCE) Mod Settings-10032-2-0-0-1697876886 | `r6/scripts/DriveCarefullyExpanded/DriveCarefullyExpanded.reds` | Wraps `VehicleObject.OnVehicleBumpEvent` |\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/scripts/AldecaldosHighStakes/Vehicle.reds` | References VehicleObject |\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/CounterMeasure/Alarm/AlarmCallback.reds` | References VehicleObject |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/AntiTheftMeasures/CounterMeasure/Alarm/AlarmCallback.reds` | References VehicleObject |\n| Dark Future Core-26956-2-0-3-for-2-31-1768879964 | `r6/scripts/Dark Future/Gameplay/DFVehicleSleepSystem.reds` | Wraps `VehicleObject.OnMountingEvent` |\n\n*27 more mods use this pattern.*\n\n## Related Concepts\n\n- [Vehicle Component Extensions](/vehicle/vehicle-component-extensions.md) \u2014 Extending VehicleComponent and VehicleComponentPS via wrapping and method addition to modify vehicle behavior.\n- [TweakDB Vehicle Record Modification](/systems/tweakdb-vehicle-records.md) \u2014 Modifying Vehicle.* TweakDB records to alter vehicle definitions and properties."}, {"id": "vehicle/vehicle-quickhack-interception", "type": "Mechanic Pattern", "title": "Vehicle Quickhack Interception", "description": "Wrapping VehicleComponentPS.GetQuickHackActions to intercept and modify vehicle quickhack options.", "tags": ["vehicle quickhack hacking security"], "group": "vehicle", "sz": 33, "body": "# Vehicle Quickhack Interception\n\nWrapping VehicleComponentPS.GetQuickHackActions to intercept and modify vehicle quickhack options.\n\n## Approach\n\nMods wrap `VehicleComponentPS.GetQuickHackActions` to intercept the quickhack actions available on vehicles. This enables custom vehicle quickhack options, gating quickhacks behind security systems, or disabling certain vehicle quickhacks. The wrapped method calls `wrappedMethod()` to get the default actions, then modifies the action list based on mod logic.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/Hacking/QuickHackInterceptor.reds` | Wraps `VehicleComponentPS.GetQuickHackActions` |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/AntiTheftMeasures/Hacking/QuickHackInterceptor.reds` | Wraps `VehicleComponentPS.GetQuickHackActions` |\n| Immersive Crafting-22824-1-0-5-1760029324 | `r6/scripts/immersive_crafting/immersive_crafting.reds` | Intercepts vehicle quickhack actions |\n| Much Better Netrunning 27237 2.20 2026-07-03T02-38Z lcXrcZgIw | `r6/scripts/BetterNetrunning/Core/DeviceUnlockUtils.reds` | Intercepts vehicle quickhack actions |\n| VehicleSecurityRework v1.4.0-5092-1-4-0-1732392843 | `r6/scripts/VehicleSecurityRework/Quickhacks/DeviceActionsTemplate.reds` | Wraps `VehicleComponentPS.GetQuickHackActions` |\n\n*1 more mods use this pattern.*\n\n## Related Concepts\n\n- [Hacking System Extensions](/systems/hacking-system-extensions.md) \u2014 Extending quickhack and hacking system classes to modify network breach and quickhack behavior.\n- [Vehicle Component Extensions](/vehicle/vehicle-component-extensions.md) \u2014 Extending VehicleComponent and VehicleComponentPS via wrapping and method addition to modify vehicle behavior."}, {"id": "vehicle/vehicle-system-overrides", "type": "Mechanic Pattern", "title": "Vehicle System Overrides", "description": "Overriding VehicleSystem methods via CET to modify vehicle spawning and management.", "tags": ["vehicle vehicle-system spawn"], "group": "vehicle", "sz": 31, "body": "# Vehicle System Overrides\n\nOverriding VehicleSystem methods via CET to modify vehicle spawning and management.\n\n## Approach\n\nMods use CET `Override` on `VehicleSystem.SpawnActivePlayerVehicle` to modify vehicle spawning behavior. This enables custom vehicle spawn locations, modified spawn conditions, or integration with other vehicle management systems.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Drive an Aerial Vehicle 13842 3.2.1 2026-06-15T16-52Z rxs7xR59h | `bin/x64/plugins/cyber_engine_tweaks/mods/DriveAerialVehicle/Modules/core.lua` | CET Override `VehicleSystem.SpawnActivePlayerVehicle` |\n| Flying Tank-16138-1-2-4-1770820062 | `bin/x64/plugins/cyber_engine_tweaks/mods/FlyingTank/Modules/core.lua` | CET Override `VehicleSystem.SpawnActivePlayerVehicle` |\n| Much Better Eddies 30532 1.3 2026-07-12T02-46Z LACBAIygB | `r6/scripts/BetterEddies/DeadChannel/DeadChannelSummonWatch.reds` | Wraps `VehicleSystem.OnSummonVehicleFailed` |\n| Vehicle Summon Tweaks - Dismiss-4658-2-3-4-1779350650 | `r6/scripts/vehicleSummonTweaksDismiss.reds` | Wraps `VehicleSystem.IsSummoningVehiclesRestricted` |\n\n## Related Concepts\n\n- [Vehicle Component Extensions](/vehicle/vehicle-component-extensions.md) \u2014 Extending VehicleComponent and VehicleComponentPS via wrapping and method addition to modify vehicle behavior.\n- [Vehicle Management UI](/vehicle/vehicle-management-ui.md) \u2014 Wrapping VehiclesManagerPopupGameController to modify the vehicle management interface."}, {"id": "world/access-point-modifications", "type": "Mechanic Pattern", "title": "Access Point Modifications", "description": "Extending AccessPointControllerPS to modify access point hacking behavior.", "tags": ["world access-point hacking devices"], "group": "world", "sz": 29, "body": "# Access Point Modifications\n\nExtending AccessPointControllerPS to modify access point hacking behavior.\n\n## Approach\n\nMods use `@addMethod(AccessPointControllerPS)` (16 instances) to extend access point behavior. This enables custom access point hacking, modified breach rewards, or integration with the hacking system for access point-specific features.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Daemon Netrunning (Revamp)-23894-1-2-1-1759846597 | `r6/scripts/Daemon Netrunning (Revamp)/DNR_Core.reds` | References AccessPointControllerPS |\n| Much Better Netrunning 27237 2.20 2026-07-03T02-38Z lcXrcZgIw | `r6/scripts/BetterNetrunning/Breach/BreachHelpers.reds` | Adds `AccessPointControllerPS.GetMainframe` |\n\n## Related Concepts\n\n- [Hacking System Extensions](/systems/hacking-system-extensions.md) \u2014 Extending quickhack and hacking system classes to modify network breach and quickhack behavior.\n- [Device Interaction Extensions](/world/device-interaction-extensions.md) \u2014 Extending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior."}, {"id": "world/cosmetic-archive-mods", "type": "Mechanic Pattern", "title": "Cosmetic Archive Modifications", "description": "Archive-only mods that modify visual assets (clothing, appearances, textures, environments) without code changes.", "tags": ["world cosmetic archive visual"], "group": "world", "sz": 31, "body": "# Cosmetic Archive Modifications\n\nArchive-only mods that modify visual assets (clothing, appearances, textures, environments) without code changes.\n\n## Approach\n\nThese mods modify game visual assets through archive file replacements without any code. This includes custom clothing, character appearances, texture replacements, environmental decorations, and physics modifications. The archive files replace or add to the game's existing visual asset packages. While these mods don't manipulate game mechanics through code, they complement system logic by providing visual assets that other mods reference.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| A New Dawn Beyond Night City 15524 2.3 2026-06-24T00-55Z 5em9eoSld | `archive/` | Cosmetic mod (no code) |\n| Ada Wong RE4R Dress Hyst AIO Archive XL-7949-1-1-1682769778 | `archive/` | Cosmetic mod (no code) |\n| Apartments Enhanced - H10 addon-19521-2-02a-1764055469 | `archive/` | Cosmetic mod (no code) |\n| ApplyFovEverywhere-20478-25-3-27-0-1743032142 | `archive/` | Cosmetic mod (no code) |\n| Citizen Breast Physics FOMOD-21520-1-2-2-1764937228 | `curvy/packed/archive/pc/mod/citizen_breast_physics.archive` | Visual asset modification via archive |\n\n*20 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Item Record Modification](/systems/tweakdb-item-records.md) \u2014 Modifying Items.* TweakDB records to add, alter, or remove item definitions.\n- [Custom Radio Streams](/media/custom-radio-streams.md) \u2014 Adding custom radio stations via Channels.* TweakDB records and audio archive files."}, {"id": "world/device-interaction-extensions", "type": "Mechanic Pattern", "title": "Device Interaction Extensions", "description": "Extending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior.", "tags": ["world devices interaction"], "group": "world", "sz": 33, "body": "# Device Interaction Extensions\n\nExtending ScriptableDeviceComponentPS and InteractiveDevice to modify device interaction behavior.\n\n## Approach\n\nMods wrap `ScriptableDeviceComponentPS` (22 wraps, 16 @addMethod) and reference `InteractiveDevice` to modify device interaction behavior. This includes custom device actions, modified interaction options, or integration of new device functionality. The `OnInstantiated` method (16 wraps) is commonly wrapped to initialize device state. Mods also extend `ShardCaseContainer` and `DataTerm` for specific device types.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| AldecaldosHighStakes-18023-1-3-2-1738265460 | `r6/scripts/AldecaldosHighStakes/Main.reds` | Wraps `ShardCaseContainer.OnInteraction` |\n| Always First Equip-2557-2-1-5-1779632278 | `r6/scripts/alwaysFirstEquip.reds` | References device component classes |\n| Anti-Theft Measures-27229-2-1-1-1778768828 | `r6/scripts/AntiTheftMeasures/Hacking/QuickHackInterceptor.reds` | References device component classes |\n| Anti-Theft Measures-27229-2-1-1-1778768828 (1) | `r6/scripts/AntiTheftMeasures/Hacking/QuickHackInterceptor.reds` | References device component classes |\n| CustomHackingSystem v1.3.0-5091-1-3-0-1704395205 | `r6/scripts/CustomHackingSystem/Main/Quickhacks/QuickhackExtensions.reds` | References device component classes |\n\n*32 more mods use this pattern.*\n\n## Related Concepts\n\n- [Access Point Modifications](/world/access-point-modifications.md) \u2014 Extending AccessPointControllerPS to modify access point hacking behavior.\n- [Vending Machine Extensions](/world/vending-machine-extensions.md) \u2014 Extending VendingMachine class to modify vending machine behavior.\n- [Hacking System Extensions](/systems/hacking-system-extensions.md) \u2014 Extending quickhack and hacking system classes to modify network breach and quickhack behavior."}, {"id": "world/dynamic-spawn-modifications", "type": "Mechanic Pattern", "title": "Dynamic Spawn Modifications", "description": "Modifying DynamicSpawnSystem.* TweakDB records to alter dynamic entity spawning.", "tags": ["world spawn tweakdb dynamic"], "group": "world", "sz": 31, "body": "# Dynamic Spawn Modifications\n\nModifying DynamicSpawnSystem.* TweakDB records to alter dynamic entity spawning.\n\n## Approach\n\nMods modify `DynamicSpawnSystem.*` TweakDB records to change how entities are dynamically spawned in the world. This includes custom spawn locations, modified spawn conditions, or new dynamic spawn definitions for NPCs, items, or vehicles.\n\n## Representative Examples\n\n| Mod | File | Notes |\n|-----|------|-------|\n| Disable Car Chases - All In One 30554 1.0.1 2026-06-16T20-01Z vD6JDH8pI | `r6/tweaks/disablecarchasesgigs.yaml` | Modifies DynamicSpawnSystem.* records |\n| Much Better Eddies 30532 1.3 2026-07-12T02-46Z LACBAIygB | `r6/tweaks/BetterEddies/deadchannel.yaml` | Modifies DynamicSpawnSystem.* records |\n| NewGamePlus_1.3.1-15043-1-3-1-1775167014 | `red4ext/plugins/NewGamePlus/tweaks/NGPlus_FastSoloBoss.yaml` | Modifies DynamicSpawnSystem.* records |\n| Reinforcements Gang Vs Gang-24243-2-0-0-1759309714 | `r6/tweaks/reinforcements_gangvgang/reinforcements/6thStreet.yaml` | Modifies DynamicSpawnSystem.* records |\n| Reinforcements System 21532 1.2 2026-06-16T14-22Z iubCuMHAW | `r6/tweaks/ReinforcementsSystem/reinforcements/6thStreet.yaml` | Modifies DynamicSpawnSystem.* records |\n\n*1 more mods use this pattern.*\n\n## Related Concepts\n\n- [TweakDB Character Record Modification](/systems/tweakdb-character-records.md) \u2014 Modifying Character.* TweakDB records to alter NPC and character definitions.\n- [Fact System Manipulation](/systems/fact-system-manipulation.md) \u2014 Using GetFact and SetFact to read and modify game quest facts that control game state."}, {"id": "world/vending-machine-extensions", "type": "Mechanic Pattern", "title": "Vending Machine Extensions", "description": "Extending VendingMachine class to modify vending machine behavior.", "tags": ["world vending-machine devices"], "group": "world", "sz": 31, "body": "# Vending Machine Extensions\n\nExtending VendingMachine class to modify vending machine behavior.\n\n## Approach\n\nMods use `@addMethod(VendingMachine const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],

  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,

  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],

const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?marked.parse(n.body):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}
document.getElementById('search').oninput=applyFilter;
document.getElementById('type').oninput=applyFilter;
